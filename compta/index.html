const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

let DATA=null,TAB='simple',TIMER=null,MONTH=null,PROD=null;
function setMonth(m){MONTH=m;render(TAB);}
function setProd(p){PROD=p;render(TAB);}
// multiplicateur de spend propre au compte publicitaire du produit
function mfOf(prod){const par=DATA.params,c=(par.produits||{})[prod];
const b=c?c.meta_billing_fee_pct:par.meta_billing_fee_pct,f=c?c.meta_fee_pct:par.meta_fee_pct;
return (1+(b||0))*(1+(f||0));}
function cogsUnit(prod){const c=(DATA.params.produits||{})[prod];
return c&&c.cogs_per_order!=null?c.cogs_per_order:DATA.params.cogs_per_order_bundle;}
function prodLabel(p){const c=(DATA.params.produits||{})[p];return c&&c.label?c.label:p;}

// ---------- saisies locales (overlay auto-expirant — MÊME clé/format que la prod : interop) ----------
const PKEY='compta_pending';
// une saisie est identifiee par date + produit : deux produits d'une meme date sont deux lignes distinctes
const ekey=(date,prod)=>date+'|'+(prod||'coussin');
const loadP=()=>{try{const p=JSON.parse(localStorage.getItem(PKEY))||{edits:{},sentAt:null};
// migration des saisies ecrites avant la dimension produit (cle = date seule)
for(const k of Object.keys(p.edits||{})){if(k.indexOf('|')<0){const e=p.edits[k];delete p.edits[k];p.edits[ekey(k,e._prod)]=e;}}
return p;}catch(e){return{edits:{},sentAt:null}}};
const saveP=(p)=>localStorage.setItem(PKEY,JSON.stringify(p));
let P=loadP();
function boot(data){DATA=data;
// si un rebuild plus récent que notre dernier envoi est arrivé, l'overlay a été absorbé → on le purge
if(P.sentAt&&new Date(DATA.generatedAt).getTime()>P.sentAt&&!Object.keys(P.edits).some(d=>P.edits[d]._unsent)){P={edits:{},sentAt:null};saveP(P);}
const g=document.getElementById('gen');
if(g)g.textContent='Généré le '+new Date(DATA.generatedAt).toLocaleDateString('fr-FR')+' à '+new Date(DATA.generatedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
render(TAB);
// filet de sécurité : des saisies non envoyées (fenêtre fermée trop vite) partent dès la réouverture
if(Object.values(P.edits).some(e=>e._unsent))setTimeout(()=>pushNow(),1500);}

// ---------- calculs (miroir du build, côté client — COPIE PROD, ne pas modifier) ----------
function computeAll(month){const par=DATA.params,fixed=DATA.monthlyFixed/30;
const PRODS=[...new Set(DATA.days.map(d=>d.produit))].sort();
// vue produit : on ne garde que ses lignes. Vue Total : on agrège les produits d'une même date,
// en pondérant le spend réel par le multiplicateur propre à chaque compte publicitaire.
// les saisies locales sont appliquees ligne par ligne (date|produit) AVANT tout regroupement :
// sans ca une saisie coussin ecraserait aussi la ligne chaussettes de la meme date
const applyEdit=(r)=>{const e=P.edits[ekey(r.date,r.produit)];
r._ed={spend:false,cogs:false,revenue:false};
if(!e)return r;
if(e.spend!==undefined){r.sMeta=parseFloat(e.spend);r._ed.spend=true;}
if(e.cogs!==undefined){r.cogsM=parseFloat(e.cogs);r.cogsProv=false;r._ed.cogs=true;}
if(e.revenue!==undefined){r.revenue=parseFloat(e.revenue);r.feesR=null;r._ed.revenue=true;}
return r;};
let src=DATA.days.map(r=>applyEdit({...r}));
// lignes saisies localement sur une date/produit absents du journal publie
for(const k of Object.keys(P.edits)){const i=k.indexOf('|'),d=k.slice(0,i),pr=k.slice(i+1);
if(!src.some(x=>x.date===d&&x.produit===pr))src.push(applyEdit({date:d,produit:pr,sMeta:null,sGoogle:null,sAutre:null,orders:0,revenue:null,refunds:0,cogsM:null,cogsProv:false,feesR:null,note:'saisie locale \u2014 sync Shopify a faire'}));}
if(PROD){src=src.filter(r=>r.produit===PROD);}
else{const g={};
for(const r of src){const k=r.date;
if(!g[k]){g[k]={date:k,produit:'total',sMeta:null,sGoogle:null,sAutre:null,orders:0,revenue:null,
refunds:0,cogsM:null,cogsProv:false,feesR:null,note:'',_mixReal:0,_mixNom:0,_ed:{spend:false,cogs:false,revenue:false}};}
const a=g[k],add=(f,v)=>{if(v!=null&&!isNaN(v))a[f]=(a[f]==null?0:a[f])+v;};
add('sMeta',r.sMeta);add('sGoogle',r.sGoogle);add('sAutre',r.sAutre);
add('revenue',r.revenue);add('cogsM',r.cogsM);add('feesR',r.feesR);
a.orders+=r.orders;a.refunds+=r.refunds;a.cogsProv=a.cogsProv||r.cogsProv;
for(const f of['spend','cogs','revenue'])a._ed[f]=a._ed[f]||(r._ed&&r._ed[f]);
if(r.sMeta!=null&&!isNaN(r.sMeta)){a._mixNom+=r.sMeta;a._mixReal+=r.sMeta*mfOf(r.produit);}
if(r.note)a.note+=(a.note?' | ':'')+prodLabel(r.produit)+' : '+r.note;}
// si un CA du jour a ete saisi a la main, les frais reels ne couvrent plus tout : on repasse en estime
src=Object.values(g).map(a=>{if(a._ed.revenue)a.feesR=null;return a;});}
const raw=src;
// complétion automatique à l'ouverture : une ligne pour chaque jour manquant jusqu'à aujourd'hui,
// pour pouvoir saisir spend/COGS directement même si l'agent n'a pas encore créé la ligne
const iso=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
if(raw.length){const cur=new Date(raw.reduce((m,x)=>x.date<m?x.date:m,raw[0].date)+'T12:00:00');const end=iso(new Date());
for(;iso(cur)<=end;cur.setDate(cur.getDate()+1)){const dt=iso(cur);
if(!raw.some(x=>x.date===dt))raw.push(applyEdit({date:dt,produit:PROD||'coussin',sMeta:null,sGoogle:null,sAutre:null,orders:0,revenue:null,refunds:0,cogsM:null,cogsProv:false,feesR:null,note:'ligne auto \u2014 sync a venir'}));}}
raw.sort((a,b)=>a.date<b.date?-1:1);
const days=raw.map(r=>{const ed=r._ed||{spend:false,cogs:false,revenue:false};
const sMeta=r.sMeta;
const cogsM=r.cogsM;
const revenue=r.revenue;
const revEntered=revenue!=null&&!isNaN(revenue);
const parts=[sMeta,r.sGoogle,r.sAutre].filter(x=>x!==null&&!isNaN(x));
const spend=parts.length?+parts.reduce((a,b)=>a+b,0).toFixed(2):null;
// coût réel du spend : multiplicateur propre au compte publicitaire du produit.
// En vue Total, on utilise le ratio pondéré des produits du jour (comptes EUR et USD mélangés).
const mf=(!PROD&&r._mixNom>0)?(r._mixReal/r._mixNom):mfOf(r.produit);
const spendReal=spend==null?null:+(spend*mf).toFixed(2);
const sMetaReal=sMeta==null||isNaN(sMeta)?null:+(sMeta*mf).toFixed(2);
const cogs=cogsM!=null&&!isNaN(cogsM)?cogsM:+(r.orders*cogsUnit(r.produit)).toFixed(2);
// frais réels Shopify (synchronisés par l'agent depuis les transactions) ; estimation en fallback
const fees=r.feesR!=null?r.feesR:+(revenue*par.payment_fee_pct+r.orders*par.payment_fee_fixed).toFixed(2);
const feesEstime=r.feesR==null;
// CA du jour = ventes du jour ; les remboursements (colonne refunds) ne sont PAS déduits ici :
// un refund d'une commande passée un autre jour ne doit pas polluer la marge de pilotage du jour.
const netRevenue=revEntered?+(+revenue).toFixed(2):null;
const caApres=netRevenue==null?null:+(netRevenue-fees).toFixed(2);
const gross=netRevenue==null?null:+(netRevenue-cogs-fees).toFixed(2);
const net=(spend===null||netRevenue==null)?null:+(gross-spendReal-fixed).toFixed(2);
// version "sans taxe" : on ignore frais Shopify, surfacturation Meta et conversion Mercury
const netST=(spend===null||netRevenue==null)?null:+(netRevenue-cogs-spend-fixed).toFixed(2);
const netSTPct=netST!==null&&netRevenue>0?+((netST/netRevenue)*100).toFixed(1):null;
return{...r,revenue,revEntered,sMeta,sMetaReal,cogsM,spend,spendReal,cogs,cogsEstime:cogsM==null||!!r.cogsProv,fees,feesEstime,netRevenue,caApres,gross,net,netST,netSTPct,
netPct:net!==null&&netRevenue>0?+((net/netRevenue)*100).toFixed(1):null,
mer:spend&&netRevenue!=null?+(netRevenue/spend).toFixed(2):null,roas:spend&&netRevenue!=null?+(netRevenue/spend).toFixed(2):null,cac:spend&&r.orders?+(spend/r.orders).toFixed(2):null,
aov:r.orders&&netRevenue!=null?+(netRevenue/r.orders).toFixed(2):null,
edited:{spend:ed.spend,cogs:ed.cogs,revenue:ed.revenue}};});
days.forEach((d,i)=>{const win=days.slice(Math.max(0,i-2),i+1).filter(x=>x.spend!==null&&x.netRevenue!=null);
const s=win.reduce((a,x)=>a+x.spend,0);d.mer3=s>0?+(win.reduce((a,x)=>a+x.netRevenue,0)/s).toFixed(2):null;});
// Filtre mois (null = total) : appliqué au tableau, à la ligne Total et aux tuiles KPI
const months=[...new Set(days.map(d=>d.date.slice(0,7)))].sort();
const vis=month?days.filter(d=>d.date.slice(0,7)===month):days;
// Ligne Total & KPIs profit : UNIQUEMENT les jours dont le spend Meta est rempli
// (un jour sans spend saisi est exclu du total — COGS estimé accepté).
const ws=vis.filter(d=>d.sMeta!=null&&!isNaN(d.sMeta)&&d.netRevenue!=null);const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]??0),0);
// Remboursements payés sur la période — comptés sur TOUS les jours visibles (même sans spend),
// déduits UNIQUEMENT du Total/mois (jamais de la marge d'un jour → pilotage propre).
const refundsPeriod=+sum(vis,'refunds').toFixed(2);
const salesRev=+sum(ws,'netRevenue').toFixed(2);
const t={salesRevenue:salesRev,revenue:+(salesRev-refundsPeriod).toFixed(2),refunds:refundsPeriod,orders:sum(ws,'orders'),
spend:ws.length?+sum(ws,'spend').toFixed(2):null,sMeta:+sum(ws,'sMeta').toFixed(2),
sMetaReal:+sum(ws,'sMetaReal').toFixed(2),spendReal:ws.length?+sum(ws,'spendReal').toFixed(2):null,
cogs:+sum(ws,'cogs').toFixed(2),fees:+sum(ws,'fees').toFixed(2),
net:ws.length?+(sum(ws,'net')-refundsPeriod).toFixed(2):null,netST:ws.length?+(sum(ws,'netST')-refundsPeriod).toFixed(2):null,fixedMonthly:DATA.monthlyFixed,
spendMissingDays:vis.length-ws.length,mer:null,roas:null,cac:null};
if(t.spend>0){t.mer=+(salesRev/t.spend).toFixed(2);t.roas=t.mer;t.cac=t.orders?+(t.spend/t.orders).toFixed(2):null;}
t.netPct=t.net!==null&&salesRev>0?+((t.net/salesRev)*100).toFixed(1):null;
t.netSTPct=t.netST!==null&&salesRev>0?+((t.netST/salesRev)*100).toFixed(1):null;
// agrégat toutes-lignes de la période visible (pour la tuile CA) — net des remboursements
const tAllSales=+sum(vis,'netRevenue').toFixed(2),tAllRef=+sum(vis,'refunds').toFixed(2);
const tAll={revenue:+(tAllSales-tAllRef).toFixed(2),refunds:tAllRef,orders:sum(vis,'orders'),cogs:+sum(vis,'cogs').toFixed(2)};
// cibles dynamiques : fenêtre glissante 14 jours ancrée sur le dernier jour saisi (le mix
// récent — upsells post-achat, Colis Assuré, offres — fait foi ; l'historique complet traîne
// le panier des premières semaines). Fallback historique complet si <50 commandes en fenêtre.
// Jamais le filtre mois : les cibles ne dépendent pas de l'onglet période affiché.
const anchor=days.length?days[days.length-1].date:null;
const cut=anchor?new Date(new Date(anchor+'T12:00:00Z').getTime()-13*86400e3).toISOString().slice(0,10):null;
const win14=cut?days.filter(d=>d.date>=cut):days;
const useWin=!!cut&&sum(win14,'orders')>=50;
const tgDays=useWin?win14:days;
const tgWin=useWin?14:null;
const gAll={revenue:+sum(tgDays,'netRevenue').toFixed(2),orders:sum(tgDays,'orders')};
const feeDays=tgDays.filter(d=>d.feesR!=null);const feeOrd=sum(feeDays,'orders');
const aov=gAll.orders?+(gAll.revenue/gAll.orders).toFixed(2):49;
const feePo=feeOrd?+(sum(feeDays,'fees')/feeOrd).toFixed(2):+(aov*par.payment_fee_pct+par.payment_fee_fixed).toFixed(2);
// COGS/commande REEL de la vue courante (et non une constante coussin) : sinon le BE ROAS
// des chaussettes serait calcule avec le COGS d'un coussin.
const cogsDays=tgDays.filter(d=>d.orders>0&&d.cogs!=null);const cogsOrd=sum(cogsDays,'orders');
const cogsPo=cogsOrd?+(sum(cogsDays,'cogs')/cogsOrd).toFixed(2):cogsUnit(PROD||'coussin');
const margin=+(aov-cogsPo-feePo).toFixed(2);
// cibles exprimées en spend NOMINAL (celui d'Ads Manager) — le coût réel du compte est intégré
const mfT=PROD?mfOf(PROD):(t.spend>0&&t.spendReal>0?t.spendReal/t.spend:mfOf('coussin'));
const tg={aov,feePo,cogsPo,margin,win:tgWin,winOrders:gAll.orders,beCpa:+(margin/mfT).toFixed(2),cpa20:+((margin-0.2*aov)/mfT).toFixed(2)};
tg.beRoas=+(aov/tg.beCpa).toFixed(2);tg.roas20=+(aov/tg.cpa20).toFixed(2);
return{days:vis,t,tAll,tg,months,prods:PRODS};}

// ---------- édition inline (pattern prod) ----------
function startEdit(td,key,field){if(td.querySelector('input'))return;
const e=P.edits[key]||{};const cur=e[field]!==undefined?e[field]:'';
td.innerHTML='<input type="number" step="0.01" inputmode="decimal" value="'+cur+'" placeholder="€">';
const inp=td.querySelector('input');inp.focus();inp.select();
const commit=()=>{window.__commit=null;const v=inp.value.trim();if(v===''){render(TAB);return;}
P.edits[key]=P.edits[key]||{};P.edits[key][field]=v;P.edits[key]._unsent=true;saveP(P);
schedulePush();render(TAB);};
window.__commit=commit; // pour pouvoir commiter une saisie encore ouverte si la page se ferme
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value='';inp.blur();}});
inp.addEventListener('blur',commit);}
function schedulePush(){clearTimeout(TIMER);TIMER=setTimeout(pushNow,60000);}
const flush=(kA)=>{if(window.__commit)window.__commit();if(Object.values(P.edits).some(e=>e._unsent))pushNow(kA);};
window.addEventListener('pagehide',()=>flush(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true);});

// ---------- push groupé vers GitHub ----------
const REPO='clementmardargent/vivelan-compta',CSVPATH='data/journal.csv';
let PUSHING=false; // verrou : jamais deux envois simultanés (aller-retour d'onglets AliExpress ↔ compta)
const b64utf8=(s)=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const utf8b64=(b)=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function pushNow(keepalive){clearTimeout(TIMER);
const unsent=Object.entries(P.edits).filter(([,e])=>e._unsent);if(!unsent.length)return;
if(PUSHING){TIMER=setTimeout(pushNow,2000);return;}
PUSHING=true;
const el=document.getElementById('sync');if(el)el.textContent='⏳ Envoi…';
try{const H={Authorization:'Bearer '+DATA.gh,Accept:'application/vnd.github+json'};
const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CSVPATH,{headers:H});
if(!r.ok)throw new Error('lecture HTTP '+r.status);
const f=await r.json();const lines=utf8b64(f.content).trim().split('\n');
// colonnes : 0 date · 1 produit · 2 spend_meta · 3 google · 4 autre · 5 orders · 6 revenue · 7 refunds · 8 cogs · 9 fees · 10 note
for(const[key,e]of unsent){let found=false;const ix=key.indexOf('|'),date=key.slice(0,ix),prod=key.slice(ix+1);
for(let i=1;i<lines.length;i++){const c=lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
if(c[0]===date&&(c[1]||'coussin')===prod){if(e.spend!==undefined)c[2]=e.spend;
if(e.revenue!==undefined){c[6]=e.revenue;c[9]='';}if(e.cogs!==undefined)c[8]=e.cogs;
lines[i]=c.join(',');found=true;break;}}
if(!found)lines.push(date+','+prod+','+(e.spend||'')+',,,0,'+(e.revenue||0)+',0,'+(e.cogs||'')+',,saisie dashboard — sync Shopify à faire');}
const put=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CSVPATH,{method:'PUT',headers:H,keepalive:!!keepalive,
body:JSON.stringify({message:'saisie dashboard : '+unsent.map(([k])=>k.replace('|',' ')).join(', '),content:b64utf8(lines.join('\n')+'\n'),sha:f.sha})});
if(!put.ok){
// 409 = quelqu'un (ou un envoi précédent) a poussé entre notre lecture et notre écriture → on relit et on renvoie
if(put.status===409){PUSHING=false;TIMER=setTimeout(pushNow,800);const e3=document.getElementById('sync');if(e3)e3.textContent='⏳ Conflit de version — nouvel essai…';return;}
throw new Error('commit HTTP '+put.status);}
for(const[,e]of unsent)delete e._unsent;P.sentAt=Date.now();saveP(P);render(TAB);
}catch(e){const el2=document.getElementById('sync');if(el2)el2.textContent='❌ Envoi échoué ('+e.message+') — réessai automatique.';
TIMER=setTimeout(pushNow,60000);}finally{PUSHING=false;}}
