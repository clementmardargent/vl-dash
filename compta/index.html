const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

let DATA=null,TAB='simple',TIMER=null,MONTH=null,PROD=null;
function setMonth(m){MONTH=m;render(TAB);}
function setProd(p){PROD=p;render(TAB);}
// multiplicateur de spend propre au compte publicitaire du produit
// date du jour (Paris) : les CIBLES se calculent au taux en vigueur aujourd'hui, pas a la moyenne de la fenetre
const AUJ=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Paris'});
function mfOf(prod,date){const par=DATA.params,c=(par.produits||{})[prod]||{};
const v=[...(c.multiplicateurs||[])].sort(function(a,b){return a.valable_du.localeCompare(b.valable_du);})
.filter(function(x){return !date||x.valable_du<=date;}).slice(-1)[0]||c;
const b=v.meta_billing_fee_pct!=null?v.meta_billing_fee_pct:par.meta_billing_fee_pct;
const f=v.meta_fee_pct!=null?v.meta_fee_pct:par.meta_fee_pct;
return (1+(b||0))*(1+(f||0));}
// spend_autre = spend de CE produit facture sur l'AUTRE compte pub (campagne cross-BM) :
// son multiplicateur est celui du compte qui facture, pas celui du produit.
function mfAutre(prod,date){const src=((DATA.params.produits||{})[prod]||{}).spend_autre_source;
return src?mfOf(src,date):mfOf(prod,date);}
function cogsUnit(prod){const c=(DATA.params.produits||{})[prod];
return c&&c.cogs_per_order!=null?c.cogs_per_order:DATA.params.cogs_per_order_bundle;}
function prodLabel(p){const c=(DATA.params.produits||{})[p];return c&&c.label?c.label:p;}

// ---------- saisies locales (overlay auto-expirant — MÊME clé/format que la prod : interop) ----------
const PKEY='compta_pending';
// une saisie est identifiee par date + produit : deux produits d'une meme date sont deux lignes distinctes
const ekey=(date,prod)=>date+'|'+(prod||'coussin');
const loadP=()=>{try{const p=JSON.parse(localStorage.getItem(PKEY))||{edits:{},sentAt:null};
// migration des saisies ecrites avant la dimension produit (cle = date seule)
for(const k of Object.keys(p.edits||{})){if(k.indexOf('|')<0){const e=p.edits[k];delete p.edits[k];p.edits[ekey(k,e._prod)]=e;}}
return p;}catch(e){return{edits:{},sentAt:null}}};
const saveP=(p)=>localStorage.setItem(PKEY,JSON.stringify(p));
let P=loadP();
function boot(data){DATA=data;
// si un rebuild plus récent que notre dernier envoi est arrivé, l'overlay a été absorbé → on le purge
if(P.sentAt&&new Date(DATA.generatedAt).getTime()>P.sentAt&&!Object.keys(P.edits).some(d=>P.edits[d]._unsent)){P={edits:{},sentAt:null};saveP(P);}
const g=document.getElementById('gen');
if(g)g.textContent='Généré le '+new Date(DATA.generatedAt).toLocaleDateString('fr-FR')+' à '+new Date(DATA.generatedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
render(TAB);
// filet de sécurité : des saisies non envoyées (fenêtre fermée trop vite) partent dès la réouverture
if(Object.values(P.edits).some(e=>e._unsent))setTimeout(()=>pushNow(),1500);}

// ---------- calculs (miroir du build, côté client — COPIE PROD, ne pas modifier) ----------
function computeAll(month){const par=DATA.params,fixed=DATA.monthlyFixed/30;
const PRODS=[...new Set(DATA.days.map(d=>d.produit))].sort();
// vue produit : on ne garde que ses lignes. Vue Total : on agrège les produits d'une même date,
// en pondérant le spend réel par le multiplicateur propre à chaque compte publicitaire.
// les saisies locales sont appliquees ligne par ligne (date|produit) AVANT tout regroupement :
// sans ca une saisie coussin ecraserait aussi la ligne chaussettes de la meme date
const applyEdit=(r)=>{const e=P.edits[ekey(r.date,r.produit)];
r._ed={spend:false,cogs:false,revenue:false};
if(!e)return r;
if(e.spend!==undefined){r.sMeta=parseFloat(e.spend);r._ed.spend=true;}
if(e.cogs!==undefined){r.cogsM=parseFloat(e.cogs);r.cogsProv=false;r.cogsApprox=false;r._ed.cogs=true;}
if(e.revenue!==undefined){r.revenue=parseFloat(e.revenue);r.feesR=null;r._ed.revenue=true;}
return r;};
let src=DATA.days.map(r=>applyEdit({...r}));
// lignes saisies localement sur une date/produit absents du journal publie
for(const k of Object.keys(P.edits)){const i=k.indexOf('|'),d=k.slice(0,i),pr=k.slice(i+1);
if(!src.some(x=>x.date===d&&x.produit===pr))src.push(applyEdit({date:d,produit:pr,sMeta:null,sGoogle:null,sAutre:null,orders:0,revenue:null,refunds:0,cogsM:null,cogsProv:false,cogsApprox:false,feesR:null,note:'saisie locale \u2014 sync Shopify a faire'}));}
// COGS des CIBLES (break-even, marge 20 %) : pour les journées d'avant le passage à l'agent sourcing, COGS agent

+'<span style="font-size:13.5px;text-align:right;color:var(--mut)">'+(cpa>0?eur(cpa,2):'—')+'</span>'
+'</div>';}
html+='</div>';}
PROD=prodSav;MONTH=monthSav;
html+='<p style="font-size:12.5px;line-height:1.6;color:var(--faint);margin:0;max-width:960px;text-wrap:pretty">'
+'<b>À quoi ça sert.</b> Une ad est jugée dans Ads Manager, où Meta ne voit pas tout : upsells post-achat hors pixel, commandes non attribuées, consentement refusé. Le ROAS qu’on y lit est donc mécaniquement plus bas que le vrai. La colonne <b>Ads Manager</b> est la cible à appliquer là-bas pour atteindre la marge nette de la ligne. '
+'<b>Calcul.</b> ROAS Shopify = AOV ÷ CPA max, avec CPA max = (marge contributive − marge visée × AOV) ÷ multiplicateur du compte (surcoûts de facturation Meta et conversion de devise). ROAS Ads Manager = ROAS Shopify × part du CA que Meta remonte, mesurée sur la même fenêtre (data/meta-attribution.csv). '
+'Pas de CPA cible côté Meta : les arbitrages s’y font au ROAS. Fenêtre : 14 derniers jours saisis, recalculée à chaque publication. Charges fixes non incluses.</p>';
root.innerHTML=html;}

// ---------- édition inline (pattern prod) ----------
function startEdit(td,key,field){if(td.querySelector('input'))return;
const e=P.edits[key]||{};const cur=e[field]!==undefined?e[field]:'';
td.innerHTML='<input type="number" step="0.01" inputmode="decimal" value="'+cur+'" placeholder="€">';
const inp=td.querySelector('input');inp.focus();inp.select();
const commit=()=>{window.__commit=null;const v=inp.value.trim();if(v===''){render(TAB);return;}
P.edits[key]=P.edits[key]||{};P.edits[key][field]=v;P.edits[key]._unsent=true;saveP(P);
schedulePush();render(TAB);};
window.__commit=commit; // pour pouvoir commiter une saisie encore ouverte si la page se ferme
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value='';inp.blur();}});
inp.addEventListener('blur',commit);}
function schedulePush(){clearTimeout(TIMER);TIMER=setTimeout(pushNow,60000);}
const flush=(kA)=>{if(window.__commit)window.__commit();if(Object.values(P.edits).some(e=>e._unsent))pushNow(kA);};
window.addEventListener('pagehide',()=>flush(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush(true);});

// ---------- push groupé vers GitHub ----------
const REPO='clementmardargent/vivelan-compta',CSVPATH='data/journal.csv';
let PUSHING=false; // verrou : jamais deux envois simultanés (aller-retour d'onglets AliExpress ↔ compta)
const b64utf8=(s)=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const utf8b64=(b)=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function pushNow(keepalive){clearTimeout(TIMER);
const unsent=Object.entries(P.edits).filter(([,e])=>e._unsent);if(!unsent.length)return;
if(PUSHING){TIMER=setTimeout(pushNow,2000);return;}
PUSHING=true;
const el=document.getElementById('sync');if(el)el.textContent='⏳ Envoi…';
try{const H={Authorization:'Bearer '+DATA.gh,Accept:'application/vnd.github+json'};
const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CSVPATH,{headers:H});
if(!r.ok)throw new Error('lecture HTTP '+r.status);
const f=await r.json();const lines=utf8b64(f.content).trim().split('\n');
// colonnes : 0 date · 1 produit · 2 spend_meta · 3 google · 4 autre · 5 orders · 6 revenue · 7 refunds · 8 cogs · 9 fees · 10 note
for(const[key,e]of unsent){let found=false;const ix=key.indexOf('|'),date=key.slice(0,ix),prod=key.slice(ix+1);
for(let i=1;i<lines.length;i++){const c=lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
if(c[0]===date&&(c[1]||'coussin')===prod){if(e.spend!==undefined)c[2]=e.spend;
if(e.revenue!==undefined){c[6]=e.revenue;c[9]='';}if(e.cogs!==undefined)c[8]=e.cogs;
lines[i]=c.join(',');found=true;break;}}
if(!found)lines.push(date+','+prod+','+(e.spend||'')+',,,0,'+(e.revenue||0)+',0,'+(e.cogs||'')+',,saisie dashboard — sync Shopify à faire');}
const put=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+CSVPATH,{method:'PUT',headers:H,keepalive:!!keepalive,
body:JSON.stringify({message:'saisie dashboard : '+unsent.map(([k])=>k.replace('|',' ')).join(', '),content:b64utf8(lines.join('\n')+'\n'),sha:f.sha})});
if(!put.ok){
// 409 = quelqu'un (ou un envoi précédent) a poussé entre notre lecture et notre écriture → on relit et on renvoie
if(put.status===409){PUSHING=false;TIMER=setTimeout(pushNow,800);const e3=document.getElementById('sync');if(e3)e3.textContent='⏳ Conflit de version — nouvel essai…';return;}
throw new Error('commit HTTP '+put.status);}
for(const[,e]of unsent)delete e._unsent;P.sentAt=Date.now();saveP(P);render(TAB);
}catch(e){const el2=document.getElementById('sync');if(el2)el2.textContent='❌ Envoi échoué ('+e.message+') — réessai automatique.';
TIMER=setTimeout(pushNow,60000);}finally{PUSHING=false;}}
