<script>try{if(localStorage.getItem('vivelan-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
[hidden]{display:none!important} /* nos display:flex écraseraient sinon l'attribut hidden */
/* sous-navigation Créas (même patron que le SAV) */
.crea-nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 48px;background:var(--card);border-bottom:1px solid var(--bd);flex:none}
.crea-nav a,.crea-nav span{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.crea-nav span{opacity:.6}
.crea-nav a:hover{background:var(--panel);color:var(--ink)}
.crea-nav a.on,.crea-nav a.on:hover{color:var(--cream);background:var(--grn)}
.soon-pill{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);border:1px dashed var(--bd-strong);padding:1px 7px;border-radius:999px;margin-left:6px}
@media (max-width:720px){.crea-nav{padding:8px 16px}}
.crea-main{flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;padding:24px 48px 32px;box-sizing:border-box;display:flex;flex-direction:column}
.crea-box{flex:1;min-height:0;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
@media (max-width:720px){
.crea-main{padding:14px 10px 16px}
/* mobile : c'est la page entière qui défile (en-tête, sous-nav, recherche et filtres s'effacent),
   seules les puces produit / dossier restent collées en haut. Préfixe #dvHost : cette page seulement
   (la pop-up de Génération, déjà plein écran, n'est pas concernée) et priorité sur driveCss. */
.vl-shell{height:auto!important}
.crea-box{flex:none;overflow:visible}
#dvHost .dv{border-radius:15px}
#dvHost .dv-main{overflow:visible}
#dvHost .dv-chips{position:sticky;top:0;z-index:5;background:var(--card)}
#dvHost .dv-crumb{position:static}
#dvHost .dv-prev{position:fixed;inset:0;z-index:70;width:auto}
}</style>
<style>
/* ===== Drive « Contenu » (bibliothèque) — tout est préfixé dv ===== */
@keyframes dvspin{to{transform:rotate(360deg)}}
.dv-host{flex:1;min-width:0;min-height:0;display:flex}
.dv{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--card);color:var(--tx);font-family:'Figtree',sans-serif}
.dv button{font-family:'Figtree',sans-serif}
.dv :focus-visible{outline:2px solid var(--grn);outline-offset:2px}
/* -- en-tête : section, recherche, statuts -- */
.dv-top{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.dv-seg{flex:none;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--panel)}
.dv-seg button{display:flex;align-items:center;gap:7px;padding:7px 14px;border:none;border-radius:8px;background:transparent;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer}
.dv-seg button:hover{color:var(--ink)}
.dv-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,53,45,.14)}
.dv-n{font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.dv-search{flex:1;min-width:200px;height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--bd-strong);border-radius:9px;background:var(--input);color:var(--faint);box-sizing:border-box;cursor:text}
.dv-search:focus-within{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
.dv-search svg{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.dv-q{flex:1;min-width:0;height:100%;padding:0;border:none;outline:none;background:transparent;color:var(--tx);font-family:'Figtree',sans-serif;font-size:13px}
.dv .dv-q:focus-visible{outline:none}
.dv-stf{flex:none;display:flex;gap:6px}
.dv-st{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--bd-strong);background:var(--card);color:var(--faint);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.dv-st:hover{color:var(--ink)}
.dv-st .dv-dot{opacity:.4}
.dv-st.on{color:var(--ink);background:var(--panel);border-color:var(--bd-hov)}
.dv-st.on .dv-dot{opacity:1}
.dv-dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%}
.dv-s-valide{background:var(--grn)}
.dv-s-a_valider{background:var(--gold)}
.dv-s-ecarte{background:var(--red)}
.dv-x{flex:none;width:32px;height:32px;border:none;border-radius:8px;background:var(--panel);color:var(--mut);font-size:15px;line-height:1;cursor:pointer}
.dv-x:hover{background:var(--track);color:var(--ink)}
.dv-close{margin-left:auto}
/* -- corps : arbre + zone principale -- */
.dv-body{flex:1;min-height:0;display:flex}
.dv-tree{flex:none;width:236px;overflow-y:auto;padding:10px 8px 16px;border-right:1px solid var(--bd);box-sizing:border-box}
.dv-tpb{display:flex;align-items:center;gap:6px;width:100%;padding:8px;border:none;border-radius:8px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:700;text-align:left;cursor:pointer}
.dv-tpb:hover{background:var(--panel)}
.dv-tpb svg{flex:none;width:14px;height:14px;fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.dv-tp.open .dv-tpb svg{transform:rotate(90deg)}
.dv-tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-tn{flex:none;font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.dv-tds{display:flex;flex-direction:column;gap:1px;margin:1px 0 8px}
.dv-td{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px 6px 28px;border:none;border-radius:8px;background:transparent;color:var(--mut);font-size:13px;font-weight:500;text-align:left;cursor:pointer}
.dv-td:hover{background:var(--panel);color:var(--ink)}
.dv-td.vide{opacity:.55}
.dv-td.dv-all{margin-bottom:6px;padding-left:8px;color:var(--ink);font-size:13.5px;font-weight:700}
.dv-td.on,.dv-td.on:hover{background:var(--grn-bg);color:var(--grn);font-weight:700;opacity:1}
.dv-td.on .dv-tn{color:var(--grn)}
.dv-chips{display:none}
.dv-main{flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative}
.dv-crumb{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd-soft);font-size:13px;color:var(--faint)}
.dv-cp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-cp .sep{margin:0 6px}
.dv-cp .here{color:var(--grn);font-weight:600}
.dv-cp button{padding:0;border:none;background:none;color:var(--mut);font-size:13px;cursor:pointer}
.dv-cp button:hover{color:var(--ink)}
.dv-cn{flex:none;font-size:12px;font-variant-numeric:tabular-nums}
/* -- grille de tuiles -- */
/* mosaïque : 5 colonnes pour les B-rolls, 3 pour les refs (2 sur mobile) ; chaque vignette garde son ratio */
.dv-grid{display:flex;align-items:flex-start;gap:14px;padding:16px 18px 28px}
.dv-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:18px}
.dv-grid:empty{display:none}
.dv-tile{position:relative;min-width:0}
.dv-tb{display:flex;flex-direction:column;gap:3px;width:100%;padding:0;border:none;border-radius:10px;background:transparent;color:inherit;text-align:left;cursor:pointer}
.dv-tb:focus-visible{outline-offset:4px}
.dv-th{position:relative;display:block;aspect-ratio:3/4;max-width:100%;margin-bottom:5px;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--bd-soft);transition:box-shadow .15s}
.dv-tb:hover .dv-th{box-shadow:0 0 0 2px var(--grn)}
.dv-th img,.dv-hv{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.dv-hv{opacity:0;transition:opacity .15s;pointer-events:none}
.dv-hv.on{opacity:1}
.dv-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.dv-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dv-dur{position:absolute;right:6px;bottom:6px;z-index:1;padding:2px 6px;border-radius:6px;background:rgba(10,20,17,.68);color:#fdf9ef;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.dv-pill{position:absolute;left:7px;top:7px;z-index:1;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.92)}
.dv-ok{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(23,86,74,.74);color:#fdf9ef;opacity:0;transition:opacity .15s;pointer-events:none}
.dv-ok svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dv-tile.dv-done .dv-ok{opacity:1}
.dv-tile.dv-ec .dv-th>img,.dv-tile.dv-ec .dv-ic{opacity:.5;filter:grayscale(.6)}
.dv-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.dv-nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:var(--ink)}
.dv-ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.4;color:var(--mut)}
.dv-ou{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;font-size:11px;font-weight:600;color:var(--faint)}
.dv-info{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:none;border-radius:50%;background:rgba(10,20,17,.62);color:#fdf9ef;cursor:pointer;opacity:0;transition:opacity .12s}
.dv-info svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.dv-info:hover{background:rgba(10,20,17,.86)}
.dv-tile:hover .dv-info,.dv-tile:focus-within .dv-info{opacity:1}
@media (hover:none){.dv-info{opacity:1}}
/* -- messages (chargement, vide, erreur) -- */
.dv-msg{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px;text-align:center;font-size:14px;line-height:1.55;color:var(--mut);text-wrap:pretty}
.dv-msg .t{font-family:'Lora',serif;font-weight:600;font-size:19px;color:var(--ink)}
.dv-spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--grn-bg-hov);border-top-color:var(--grn);animation:dvspin .9s linear infinite;box-sizing:border-box}
.dv-btn{padding:9px 16px;border:none;border-radius:9px;background:var(--grn);color:var(--cream);font-size:13px;font-weight:700;cursor:pointer}
.dv-btn:hover{background:var(--grn-dk)}
/* -- panneau d'aperçu -- */
.dv-prev{position:absolute;top:0;right:0;bottom:0;z-index:6;width:400px;max-width:100%;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--bd);box-shadow:-14px 0 36px rgba(20,53,45,.14)}
.dv-ph{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--bd)}
.dv-pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700;color:var(--ink)}
.dv-pb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px 18px 22px}
.dv-pm{flex:none;display:flex;align-items:center;justify-content:center;min-height:120px;border-radius:12px;overflow:hidden;background:var(--panel)}
.dv-pm video,.dv-pm img{display:block;width:100%;max-height:52vh;object-fit:contain}
.dv-pm video{background:#0a1411}
.dv-pa{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:24px 14px;color:var(--faint);box-sizing:border-box}
.dv-pa svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dv-pa audio{width:100%}
.dv-pst{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-size:12px;color:var(--faint)}
.dv-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.dv-b-valide{background:var(--grn-bg);color:var(--grn)}
.dv-b-a_valider{background:var(--amb-bg);color:var(--amb)}
.dv-b-ecarte{background:var(--red-bg);color:var(--red)}
.dv-pd{margin:0;font-size:14px;line-height:1.55;color:var(--tx);text-wrap:pretty}
.dv-pbloc .k{margin-bottom:4px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.dv-pbloc .v{font-size:13.5px;line-height:1.5;color:var(--tx)}
.dv-pbloc.ecart .v{color:var(--red)}
.dv-path{display:flex;align-items:flex-start;gap:8px}
.dv-path code{flex:1;min-width:0;padding:8px 10px;border-radius:8px;background:var(--panel);color:var(--ink);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;line-height:1.5;word-break:break-all;user-select:all}
.dv-mini{flex:none;padding:7px 11px;border:none;border-radius:8px;background:var(--grn-bg);color:var(--grn);font-size:12px;font-weight:700;cursor:pointer}
.dv-mini:hover{background:var(--grn-bg-hov)}
.dv-acts{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.dv-open{font-size:12.5px;font-weight:600}
.dv-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12.5px}
.dv-meta dt{font-weight:600;color:var(--faint)}
.dv-meta dd{margin:0;min-width:0;color:var(--tx);word-break:break-word;font-variant-numeric:tabular-nums}
.dv-meta code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px}
.dv-cr{display:inline-block;margin:0 4px 3px 0;padding:1px 7px;border-radius:6px;background:var(--panel);font-size:11.5px;font-weight:700}
/* -- toast -- */
.dv-toast{position:fixed;left:50%;bottom:28px;z-index:300;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--card);font-family:'Figtree',sans-serif;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(10,20,17,.3);opacity:0;transform:translate(-50%,10px);transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
.dv-toast.on{opacity:1;transform:translate(-50%,0)}
/* -- pop-up (page Génération) -- */
.dv-pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,53,45,.45)}
.dv-popbox{width:92vw;max-width:1200px;height:86vh;display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(20,53,45,.3)}
.dv-popbox:focus{outline:none}
/* -- boutons Refs / B-rolls de la sous-nav (même gabarit que les liens) -- */
.dv-navr{margin-left:auto;display:flex;gap:4px}
.dv-navbtn{display:flex;align-items:center;gap:7px;padding:7px 14px;border:none;border-radius:8px;background:transparent;color:var(--mut);font-family:'Figtree',sans-serif;font-size:13px;font-weight:600;line-height:normal;cursor:pointer}
.dv-navbtn:hover{background:var(--panel);color:var(--ink)}
.dv-navbtn:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.dv-navbtn svg{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){
.dv-toast,.dv-th,.dv-hv,.dv-ok,.dv-tpb svg,.dv-info{transition:none}
.dv-spin{animation-duration:2.4s}
}
/* -- mobile ≤720px : uniquement des surcharges -- */
@media (max-width:720px){
.dv-top{gap:8px;padding:10px 12px}
.dv-seg{order:1}
.dv-close{order:2}
.dv-search{order:3;flex-basis:100%;min-width:0}
.dv-q{font-size:16px} /* sous 16 px, Safari iOS zoome au focus */
.dv-stf{order:4;width:100%;overflow-x:auto;scrollbar-width:none}
.dv-stf::-webkit-scrollbar{display:none}
.dv-body{flex-direction:column}
.dv-tree{display:none}
.dv-chips{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.dv-crow{display:flex;gap:6px;overflow-x:auto;padding:0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dv-crow::-webkit-scrollbar{display:none}
.dv-crow:empty{display:none}
.dv-chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd-strong);background:var(--card);color:var(--tx);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.dv-chip.on{background:var(--grn);border-color:var(--grn);color:var(--cream)}
.dv-chip.on .dv-tn{color:var(--cream);opacity:.8}
.dv-crumb{padding:10px 12px}
.dv-grid{gap:10px;padding:12px 12px 24px}
.dv-col{gap:14px}
.dv-prev{width:100%;border-left:none}
.dv-pb{padding:14px 14px 20px}
.dv-pop{padding:0}
.dv-popbox{width:100%;height:100%;max-width:none;border-radius:0}
.dv-navbtn{padding:7px 10px}
.dv-toast{bottom:18px}
}</style>
</head>

</main>

<script>
const BLOB="{\"salt\":\"eoEkLcSMFSX3dZygpCrxzg==\",\"iv\":\"7iS1pglFEVUjZFYl\",\"data\":\"kGM3M5gBJdUOmeSHuTQ3/hq2JLk3NzvNZJqKOOSvQt3m/2okfGHpgy4BOiQWFTMzxSGXs/1eI3bc4WfLF/Lkr8oUq5othlJ5RQRL0Z7GFSG0sW4xfZgDSc2bLuMF+v5r/KMp1vwALrQN+CZsBCj277WmnsAvmu2v23tSf3DyScLFncj/CSKrXFy1h9GSBQ==\"}";

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

(function(){var b=document.getElementById('themeToggle');if(!b)return;
function icon(){b.textContent=document.documentElement.classList.contains('dark')?'☀':'☾';}
icon();
b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');
try{localStorage.setItem('vivelan-theme',d?'dark':'light')}catch(e){}icon();});})();

/* ===== Drive « Contenu » : bibliothèque B-rolls / refs (préfixe dv) ===== */
/* dv:pure:start — fonctions pures (aucun DOM), exercées par le harnais de test */
var DV_PRODUITS=['coussin','chaussettes','commun'];
var DV_PROD_LABEL={coussin:'Coussin',chaussettes:'Chaussettes',commun:'Commun'};
var DV_SECTIONS={plans:'B-rolls',references:'Refs'};
var DV_STATUT_LABEL={valide:'Validé',a_valider:'À valider',ecarte:'Écarté'};
var DV_STATUT_FILTRE={valide:'Validés',a_valider:'À valider',ecarte:'Écartés'};
var DV_RANG_STATUT={valide:0,a_valider:1,ecarte:2};
var DV_RECHARGE_MS=30*60*1000; /* jeton d'accès valable 24 h : on recharge l'index au-delà de 30 min */
var DV_JETON_MS=20*3600*1000;  /* contrôle périodique (onglet resté au premier plan) : rechargement avant l'expiration du jeton */
var DV_SVG={
  video:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9.5v5l4.5-2.5z"></path></svg>',
  image:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>',
  audio:'<svg viewBox="0 0 24 24"><path d="M4 10v4 M8 6v12 M12 9v6 M16 4v16 M20 10v4"></path></svg>',
  autre:'<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z M14 3v4h4"></path></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5 M12 7.5v.01"></path></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>',
  loupe:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>'
};
function dvA(o,k){return !!o&&Object.prototype.hasOwnProperty.call(o,k);}
function dvEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
/* normalisation de recherche : sans accents, minuscules, tirets / points / soulignés = espaces */
function dvNorm(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[-_.\/]+/g,' ');}
function dvTokens(q){var n=dvNorm(q).trim();return n?n.split(/\s+/):[];}
function dvHay(e){if(e._h==null)e._h=dvNorm([e.id,e.fichier,e.description,e.usage].join(' '));return e._h;}
function dvMatch(e,toks){var h=dvHay(e);for(var i=0;i<toks.length;i++){if(h.indexOf(toks[i])===-1)return false;}return true;}
function dvStatut(e){return e&&dvA(DV_STATUT_LABEL,e.statut)?e.statut:'a_valider';}
function dvPasse(e,st){return !!st[dvStatut(e)];}
function dvBase(f){return String(f||'').replace(/\.[^.\/]+$/,'');}
function dvLabel(idx,code){
  var t=idx&&idx.titres;
  if(dvA(t,code)&&t[code])return String(t[code]);
  var s=String(code==null?'':code).replace(/^\d+[_-]/,'').replace(/[-_]+/g,' ').trim();
  return s?s.charAt(0).toUpperCase()+s.slice(1):'Sans dossier';
}
function dvProdLabel(p){return dvA(DV_PROD_LABEL,p)?DV_PROD_LABEL[p]:dvLabel(null,p);}
function dvOu(idx,e,avecSection){return (avecSection?DV_SECTIONS[e.section]+' › ':'')+dvProdLabel(e.produit)+' › '+dvLabel(idx,e.dossier);}
function dvKind(e){
  var k=e&&e.kind;
  if(k==='video'||k==='image'||k==='audio')return k;
  var x=String(e&&e.fichier||'').split('.').pop().toLowerCase();
  if(/^(mp4|mov|m4v|webm)$/.test(x))return 'video';
  if(/^(jpe?g|png|webp|gif|avif)$/.test(x))return 'image';
  if(/^(mp3|wav|m4a|aac|ogg|flac)$/.test(x))return 'audio';
  return 'autre';
}
function dvDuree(d){
  if(d==null||d===''||isNaN(Number(d)))return '';
  d=Number(d);var s=d>0&&d<1?1:Math.round(d);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function dvDureeLongue(d){
  if(d==null||d===''||isNaN(Number(d)))return '';
  d=Number(d);return d<60?String(Math.round(d*10)/10).replace('.',',')+' s':dvDuree(d);
}
function dvTaille(o){
  o=Number(o);if(!o)return '';
  if(o<102400)return Math.max(1,Math.round(o/1024))+' ko';
  var mo=o/1048576;return (mo>=10?String(Math.round(mo)):mo.toFixed(1).replace('.',','))+' Mo';
}
/* ratio largeur/hauteur d'une vignette : celui du média (champ format « LxH »), 1:1 pour l'audio,
   borné pour qu'une capture très haute ou très large ne déforme pas la grille */
function dvRatio(e){
  if(dvKind(e)==='audio')return 1;
  var m=/^(\d+)\s*[x×]\s*(\d+)$/.exec(String(e&&e.format||'').trim());
  var r=m&&Number(m[2])>0?Number(m[1])/Number(m[2]):0;
  return r>0?Math.min(2.4,Math.max(0.42,r)):0.75;
}
/* URL signée d'un fichier : chaque segment de rel encodé, puis le jeton */
function dvUrl(base,qs,rel){
  if(!rel)return '';
  return base+String(rel).split('/').map(encodeURIComponent).join('/')+(qs?'?'+qs:'');
}
/* normalise l'index reçu (champs texte jamais null, creas toujours un tableau, _i = rang) */
function dvPrep(idx){
  if(!idx||typeof idx!=='object'||!Array.isArray(idx.entrees))return null;
  if(!idx.titres||typeof idx.titres!=='object')idx.titres={};
  if(!idx.ordre||typeof idx.ordre!=='object')idx.ordre={};
  var racine=String(idx.racine||'').replace(/\/+$/,'');
  idx.entrees=idx.entrees.filter(function(e){return e&&typeof e==='object'&&e.rel;});
  idx.entrees.forEach(function(e,i){
    ['id','section','produit','type','dossier','fichier','rel','chemin','kind','statut','description','usage','raison_ecart',
     'format','son','modele','media_id','valide_par','valide_le'].forEach(function(k){e[k]=e[k]==null?'':String(e[k]);});
    if(!Array.isArray(e.creas))e.creas=e.creas?[String(e.creas)]:[];
    if(!e.fichier)e.fichier=e.rel.split('/').pop();
    if(!e.id)e.id=dvBase(e.fichier);
    if(!e.chemin)e.chemin=(racine?racine+'/':'')+e.rel;
    e._i=i;e._h=null;
  });
  return idx;
}
function dvEntrees(idx){return idx&&Array.isArray(idx.entrees)?idx.entrees:[];}
function dvProduits(idx,section){
  var l=DV_PRODUITS.slice();
  dvEntrees(idx).forEach(function(e){if(e.section===section&&e.produit&&l.indexOf(e.produit)===-1)l.push(e.produit);});
  return l;
}
/* dossiers d'un produit : ordre de l'index pour les plans (+ restes), alphabétique (libellé) pour les refs */
function dvDossiers(idx,section,produit){
  var vus=[],out=[];
  dvEntrees(idx).forEach(function(e){if(e.section===section&&e.produit===produit&&vus.indexOf(e.dossier)===-1)vus.push(e.dossier);});
  if(section==='plans'&&idx&&dvA(idx.ordre,produit)&&Array.isArray(idx.ordre[produit]))
    idx.ordre[produit].forEach(function(c){c=String(c);if(out.indexOf(c)===-1)out.push(c);});
  var reste=vus.filter(function(c){return out.indexOf(c)===-1;});
  reste.sort(function(a,b){return dvLabel(idx,a).localeCompare(dvLabel(idx,b),'fr');});
  return out.concat(reste);
}
/* arbre d'une section, compteurs selon les statuts affichés */
function dvArbre(idx,section,statuts){
  return dvProduits(idx,section).map(function(p){
    var cpt=Object.create(null),tot=0;
    dvEntrees(idx).forEach(function(e){
      if(e.section===section&&e.produit===p&&dvPasse(e,statuts)){tot++;cpt[e.dossier]=(cpt[e.dossier]||0)+1;}
    });
    return {produit:p,label:dvProdLabel(p),n:tot,dossiers:dvDossiers(idx,section,p).map(function(c){return {code:c,label:dvLabel(idx,c),n:cpt[c]||0};})};
  });
}
function dvCompteSection(idx,section,statuts){
  var n=0;dvEntrees(idx).forEach(function(e){if(e.section===section&&dvPasse(e,statuts))n++;});return n;
}
function dvComparateur(idx,section){
  var rgP=Object.create(null),rgD=Object.create(null);
  dvProduits(idx,section).forEach(function(p,i){
    rgP[p]=i;var m=rgD[p]=Object.create(null);
    dvDossiers(idx,section,p).forEach(function(c,j){m[c]=j;});
  });
  function rp(e){return e.produit in rgP?rgP[e.produit]:999;}
  function rd(e){var m=rgD[e.produit];return m&&e.dossier in m?m[e.dossier]:999;}
  return function(a,b){
    return (rp(a)-rp(b))||(rd(a)-rd(b))||(DV_RANG_STATUT[dvStatut(a)]-DV_RANG_STATUT[dvStatut(b)])
      ||String(a.fichier).localeCompare(String(b.fichier),'fr',{numeric:true});
  };
}
/* f = {section, sel:{produit|null (= tout), dossier|null}, statuts, q} ; en recherche : toute la section */
function dvFiltrer(idx,f){
  var toks=dvTokens(f.q),rech=toks.length>0,items=[],masques=0;
  dvEntrees(idx).forEach(function(e){
    if(e.section!==f.section)return;
    if(rech){if(!dvMatch(e,toks))return;}
    else if(f.sel.produit!=null){if(e.produit!==f.sel.produit)return;if(f.sel.dossier!=null&&e.dossier!==f.sel.dossier)return;}
    if(!dvPasse(e,f.statuts)){masques++;return;}
    items.push(e);
  });
  items.sort(dvComparateur(idx,f.section));
  return {items:items,masques:masques,recherche:rech};
}
function dvIcone(k){return '<span class="dv-ic">'+(dvA(DV_SVG,k)?DV_SVG[k]:DV_SVG.autre)+'</span>';}
function dvPluriel(n,mot){return n+' '+mot+(n>1?'s':'');}

      h+='<div class="dv-tds">'+dvDosHtml('dv-td',p.produit,null,'Tout',p.n,on(null))
        +p.dossiers.map(function(d){return dvDosHtml('dv-td',p.produit,d.code,d.label,d.n,on(d.code));}).join('')+'</div>';
    }
    return h+'</div>';

/* mobile : rangée des produits + rangée des dossiers du produit courant */
function dvChipsHtml(idx,st){
  var rech=dvTokens(st.q).length>0,a=dvArbre(idx,st.section,st.statuts),cur=null;
  var r1=dvDosHtml('dv-chip','*',null,'Tout',dvCompteSection(idx,st.section,st.statuts),!rech&&st.sel.produit==null)
    +a.map(function(p){if(p.produit===st.sel.produit)cur=p;

  var r2=cur?dvDosHtml('dv-chip',cur.produit,null,'Tout',cur.n,!rech&&st.sel.dossier==null)
    +cur.dossiers.map(function(d){return dvDosHtml('dv-chip',cur.produit,d.code,d.label,d.n,!rech&&st.sel.dossier===d.code);}).join(''):'';
  return '<div class="dv-crow" role="group" aria-label="Produit">'+r1+'</div><div class="dv-crow" role="group" aria-label="Dossier">'+r2+'</div>';
}
function dvCrumbHtml(idx,st,n,masques){

  else if(st.sel.produit==null)h+=sep+'<span class="here">Tout</span>';

/* presse-papier : API moderne, repli textarea + execCommand ; rend une promesse de booléen */
function dvCopier(t){
  function repli(){
    var prev=document.activeElement,ok=false;
    try{
      var ta=document.createElement('textarea');
      ta.value=t;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
      ok=document.execCommand('copy');ta.remove();
    }catch(e){ok=false;}
    try{if(prev&&prev.focus)prev.focus({preventScroll:true});}catch(e){}
    return ok;
  }
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(t).then(function(){return true;},function(){return repli();});
  }
  return Promise.resolve(repli());
}
function dvToast(msg){
  var t=document.getElementById('dvToast');
  if(!t){t=document.createElement('div');t.id='dvToast';t.className='dv-toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(dvToast._t);dvToast._t=setTimeout(function(){t.classList.remove('on');},1800);
}

    +'<label class="dv-search">'+DV_SVG.loupe+'<input type="search" class="dv-q" placeholder="Rechercher un média (nom, description, usage)…" autocomplete="off" spellcheck="false" aria-label="Rechercher un média"></label>'
    +'<div class="dv-stf" role="group" aria-label="Statuts affichés">'
    +Object.keys(DV_STATUT_FILTRE).map(function(k){return '<button type="button" class="dv-st" data-dv-st="'+k+'"><i class="dv-dot dv-s-'+k+'"></i>'+DV_STATUT_FILTRE[k]+'</button>';}).join('')
    +'</div>'
    +(opts.fermer?'<button type="button" class="dv-x dv-close" data-dv-close title="Fermer (Échap)" aria-label="Fermer la bibliothèque">✕</button>':'')
    +'</div>'
    +'<div class="dv-body"><nav class="dv-tree" aria-label="Dossiers"></nav><div class="dv-chips"></div>'
    +'<div class="dv-main"><div class="dv-crumb"></div><div class="dv-grid"></div><div class="dv-msg" hidden></div></div></div>'

  var root=host.querySelector('.dv');
  function q1(sel){return root.querySelector(sel);}
  var elQ=q1('.dv-q'),elTree=q1('.dv-tree'),elChips=q1('.dv-chips'),elMain=q1('.dv-main'),elCrumb=q1('.dv-crumb'),
      elGrid=q1('.dv-grid'),elMsg=q1('.dv-msg'),elPrev=q1('.dv-prev');
  var mmFin=window.matchMedia?window.matchMedia('(hover: hover) and (pointer: fine)'):null;
  var mmCalme=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
  /* colonnes de la mosaïque : 5 B-rolls / 3 refs, 2 sur mobile (même seuil que le CSS) */
  var mmMobile=window.matchMedia?window.matchMedia('(max-width:720px)'):null;
  function nbColonnes(){return mmMobile&&mmMobile.matches?2:(D.section==='references'?3:5);}
  if(mmMobile){var auChangement=function(){if(D.etat==='ok')renderMain();};
    if(mmMobile.addEventListener)mmMobile.addEventListener('change',auChangement);else if(mmMobile.addListener)mmMobile.addListener(auChangement);}

  function etat(){return {section:D.section,sel:D.sel[D.section],statuts:D.statuts,ouverts:D.ouverts[D.section],q:D.q};}
  /* sélection mémorisée → la ramener sur un produit / dossier qui existe dans l'index reçu */
  function valider(){
    Object.keys(DV_SECTIONS).forEach(function(sec){
      var s=D.sel[sec],ps=dvProduits(D.idx,sec);
      if(s.produit==null){s.dossier=null;return;} /* « Tout » */
      if(ps.indexOf(s.produit)===-1)s.produit=ps[0];
      if(s.dossier!=null&&dvDossiers(D.idx,sec,s.produit).indexOf(s.dossier)===-1)s.dossier=null;
    });
    var p0=D.sel[D.section].produit;if(p0!=null)D.ouverts[D.section][p0]=true;
  }
  function msg(h){elMsg.innerHTML=h;elMsg.hidden=!h;}
  var chipsCle='';
  /* retour en haut de la grille : dv-main défile lui-même (desktop, pop-up) ; si c'est la page
     entière qui défile (page Contenu sur mobile), on ramène le haut du corps dans la vue */
  function haut(){
    elMain.scrollTop=0;
    var y=q1('.dv-body').getBoundingClientRect().top;if(y<0)window.scrollBy(0,y);
  }
  function renderTop(){
    root.querySelectorAll('[data-dv-sec]').forEach(function(b){var on=b.getAttribute('data-dv-sec')===D.section;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
    root.querySelectorAll('[data-dv-n]').forEach(function(b){b.textContent=D.etat==='ok'?dvCompteSection(D.idx,b.getAttribute('data-dv-n'),D.statuts):'';});
    root.querySelectorAll('[data-dv-st]').forEach(function(b){var on=!!D.statuts[b.getAttribute('data-dv-st')];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
  }
  function renderMain(){
    arreterSurvol();
    if(D.etat!=='ok'){
      elTree.innerHTML='';elChips.innerHTML='';elGrid.innerHTML='';
      elCrumb.innerHTML='<span class="dv-cp">'+dvEsc(DV_SECTIONS[D.section])+'</span>';
      if(D.etat==='erreur')msg('<div class="t">Bibliothèque injoignable</div><div>'+dvEsc(D.err)+'</div>'
        +(D.retry?'<button type="button" class="dv-btn" data-dv-retry>Réessayer</button>':''));
      else if(D.etat==='vide')msg('<div class="t">Bibliothèque en préparation</div><div>La bibliothèque est en cours de synchronisation depuis le serveur — revenez dans quelques minutes.</div>'
        +'<button type="button" class="dv-btn" data-dv-retry>Réessayer</button>');
      else msg('<span class="dv-spin"></span><div>Chargement de la bibliothèque…</div>');
      return;
    }
    var st=etat();
    elTree.innerHTML=dvArbreHtml(D.idx,st);
    /* rangées de puces (mobile) : défilement horizontal gardé au re-rendu (celui des dossiers seulement
       si le produit n'a pas changé), puis puce active ramenée dans la vue */
    var sl=[].map.call(elChips.querySelectorAll('.dv-crow'),function(r){return r.scrollLeft;});
    var cle=D.section+'|'+st.sel.produit;if(cle!==chipsCle){sl[1]=0;chipsCle=cle;}
    elChips.innerHTML=dvChipsHtml(D.idx,st);
    [].forEach.call(elChips.querySelectorAll('.dv-crow'),function(r,i){
      if(sl[i])r.scrollLeft=sl[i];
      var c=r.querySelector('.dv-chip.on');if(!c)return;
      var a=r.getBoundingClientRect(),b=c.getBoundingClientRect();
      if(b.left<a.left)r.scrollLeft+=b.left-a.left-12;else if(b.right>a.right)r.scrollLeft+=b.right-a.right+12;
    });
    var r=dvFiltrer(D.idx,st),ctx={base:D.base,qs:D.qs,ou:''};
    elCrumb.innerHTML=dvCrumbHtml(D.idx,st,r.items.length,r.masques);
    /* mosaïque : chaque tuile va dans la colonne la moins haute (hauteur estimée d'après le ratio connu
       du média) — l'ordre de lecture reste ligne par ligne et rien n'attend le chargement des images */
    var n=nbColonnes(),cols=[],hs=[],c;
    var cw=((elGrid.clientWidth||960)-36-(n-1)*14)/n;if(!(cw>40))cw=170;
    for(c=0;c<n;c++){cols.push([]);hs.push(0);}
    r.items.forEach(function(e){
      ctx.ou=r.recherche||st.sel.produit==null?dvOu(D.idx,e,false):(st.sel.dossier==null?dvLabel(D.idx,e.dossier):'');
      var k=0;for(c=1;c<n;c++){if(hs[c]<hs[k]-1)k=c;}
      cols[k].push(dvTuileHtml(e,e._i,ctx));
      hs[k]+=cw/dvRatio(e)+42+(e.description?34:0)+(ctx.ou?17:0);
    });
    elGrid.innerHTML=r.items.length?cols.map(function(t){return '<div class="dv-col">'+t.join('')+'</div>';}).join(''):'';
    if(r.items.length)msg('');
    else if(r.recherche)msg('<div class="t">Aucun résultat</div><div>Aucun média ne correspond à « '+dvEsc(D.q.trim())+' »'
      +(r.masques?' parmi les statuts affichés — '+dvPluriel(r.masques,'résultat')+' masqué'+(r.masques>1?'s':'')+' par les filtres.':'.')+'</div>');
    else msg('<div class="t">Dossier vide</div><div>'+(r.masques?dvPluriel(r.masques,'média')+' masqué'+(r.masques>1?'s':'')+' par les filtres de statut.':'Aucun média dans ce dossier pour l’instant.')+'</div>');
  }
  function render(){renderTop();renderMain();}

  function charger(){
    if(D.enCours)return D.enCours;
    var P0=opts.auth?opts.auth():null;
    if(!P0||!P0.key||!P0.worker){D.etat='erreur';D.retry=false;D.err='Clé d’accès absente du build — bibliothèque indisponible.';render();return Promise.resolve();}
    var avait=D.etat==='ok';
    if(!avait){D.etat='chargement';render();}
    D.enCours=fetch(P0.worker+'/biblio',{headers:{'Authorization':'Bearer '+P0.key},cache:'no-store'})
      .then(function(r){return r.text().then(function(t){
        var j=null;try{j=JSON.parse(t);}catch(x){}
        if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
        if(!j||typeof j!=='object')throw new Error('réponse illisible du serveur');
        return j;});})
      .then(function(j){
        D.base=String(j.base||'');D.qs=String(j.qs||'');D.charge=Date.now();
        fermerApercu();
        var idx=dvPrep(j.index);
        if(!idx){D.idx=null;D.etat='vide';}else{D.idx=idx;D.etat='ok';valider();}
      })
      .catch(function(e){
        if(avait){dvToast('Actualisation de la bibliothèque impossible');return;}
        var m=String(e&&e.message||e);
        D.etat='erreur';D.retry=true;
        D.err=/fetch|network|load failed/i.test(m)?'Connexion au serveur impossible — vérifiez le réseau, puis réessayez.':'Erreur : '+m+'.';
      })
      .then(function(){D.enCours=null;render();});
    return D.enCours;
  }

  /* ---- aperçu ---- */
  function ouvrirApercu(i){
    var e=D.idx&&D.idx.entrees[i];if(!e)return;
    arreterSurvol();
    D.apercu=i;
    elPrev.innerHTML=dvApercuHtml(e,i,{base:D.base,qs:D.qs,ou:dvOu(D.idx,e,true)});
    elPrev.hidden=false;
    var x=elPrev.querySelector('[data-dv-xprev]');if(x)x.focus({preventScroll:true});
  }
  function fermerApercu(){
    if(elPrev.hidden)return false;
    elPrev.querySelectorAll('video,audio').forEach(function(m){try{m.pause();m.removeAttribute('src');m.load();}catch(x){}});
    var dedans=elPrev.contains(document.activeElement);
    elPrev.hidden=true;elPrev.innerHTML='';
    var i=D.apercu;D.apercu=-1;
    if(dedans){var b=root.querySelector('[data-dv-info="'+i+'"]');if(b)b.focus({preventScroll:true});}
    return true;
  }

  /* ---- clic sur un média : copie du chemin ---- */
  function choisir(i){
    var e=D.idx&&D.idx.entrees[i];if(!e)return;
    dvCopier(e.chemin).then(function(ok){
      if(ok)dvToast('Chemin copié');
      else{dvToast('Copie impossible — le chemin est affiché dans l’aperçu');ouvrirApercu(i);}
    });
    var t=root.querySelector('.dv-tile[data-i="'+i+'"]');
    if(t){t.classList.add('dv-done');setTimeout(function(){t.classList.remove('dv-done');},900);}
  }

  /* ---- lecture muette au survol (pointeur fin, hors reduced-motion) ---- */
  var sv={tile:null,timer:0,video:null};
  function arreterSurvol(){
    clearTimeout(sv.timer);
    if(sv.video){try{sv.video.pause();sv.video.removeAttribute('src');sv.video.load();}catch(x){}sv.video.remove();}
    sv={tile:null,timer:0,video:null};
  }
  elGrid.addEventListener('pointerover',function(ev){
    if(ev.pointerType&&ev.pointerType!=='mouse')return;
    if(!mmFin||!mmFin.matches||(mmCalme&&mmCalme.matches))return;
    var t=ev.target.closest('.dv-tile');
    if(!t||t===sv.tile)return;
    arreterSurvol();
    if(t.getAttribute('data-k')!=='video')return;
    sv.tile=t;
    sv.timer=setTimeout(function(){
      var e=D.idx&&D.idx.entrees[Number(t.getAttribute('data-i'))],th=t.querySelector('.dv-th');
      if(!e||!th||sv.tile!==t)return;
      var v=document.createElement('video');
      v.className='dv-hv';v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;
      v.setAttribute('muted','');v.setAttribute('playsinline','');v.preload='auto';
      v.addEventListener('playing',function(){v.classList.add('on');});
      v.src=dvUrl(D.base,D.qs,e.rel);
      th.appendChild(v);sv.video=v;
      var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    },160);
  });
  elGrid.addEventListener('pointerout',function(ev){
    if(!sv.tile)return;
    if(ev.relatedTarget&&sv.tile.contains(ev.relatedTarget))return;
    arreterSurvol();
  });
  /* vignette annoncée mais introuvable → icône du type */
  elGrid.addEventListener('error',function(ev){
    var im=ev.target;if(!im||im.tagName!=='IMG')return;
    var t=im.closest('.dv-tile'),th=im.parentNode;im.remove();
    if(t&&th)th.insertAdjacentHTML('afterbegin',dvIcone(t.getAttribute('data-k')));
  },true);

  /* ---- délégation des clics ---- */
  root.addEventListener('click',function(ev){
    var t=ev.target,b;
    if((b=t.closest('[data-dv-pick]'))){choisir(Number(b.getAttribute('data-dv-pick')));return;}
    if((b=t.closest('[data-dv-info]'))){ouvrirApercu(Number(b.getAttribute('data-dv-info')));return;}
    if((b=t.closest('[data-dv-copy]'))){
      var ec=D.idx&&D.idx.entrees[Number(b.getAttribute('data-dv-copy'))];
      if(ec)dvCopier(ec.chemin).then(function(ok){dvToast(ok?'Chemin copié':'Copie impossible — sélectionnez le chemin à la main');});
      return;
    }
    if((b=t.closest('[data-dv-xprev]'))){fermerApercu();return;}
    if((b=t.closest('[data-dv-close]'))){if(opts.fermer)opts.fermer();return;}
    if((b=t.closest('[data-dv-retry]'))){charger();return;}
    if((b=t.closest('[data-dv-sec]'))){
      var sec=b.getAttribute('data-dv-sec');
      if(sec!==D.section){D.section=sec;fermerApercu();if(D.etat==='ok')valider();sauver();render();haut();}
      return;
    }
    if((b=t.closest('[data-dv-st]'))){var k=b.getAttribute('data-dv-st');D.statuts[k]=!D.statuts[k];sauver();render();return;}
    if((b=t.closest('[data-dv-prod]'))){
      var p=b.getAttribute('data-dv-prod'),ov=D.ouverts[D.section];
      if(ov[p])delete ov[p];else ov[p]=true;
      sauver();elTree.innerHTML=dvArbreHtml(D.idx,etat());
      var nb=elTree.querySelector('[data-dv-prod="'+p+'"]');if(nb)nb.focus({preventScroll:true});
      return;
    }
    if((b=t.closest('[data-dv-p]'))){
      var p2=b.getAttribute('data-dv-p'),d=b.getAttribute('data-dv-dos');
      if(p2==='*')D.sel[D.section]={produit:null,dossier:null};
      else{D.sel[D.section]={produit:p2,dossier:d==='*'?null:d};D.ouverts[D.section][p2]=true;}
      if(D.q){D.q='';elQ.value='';}
      fermerApercu();sauver();render();haut();
      return;
    }
  });
  elQ.addEventListener('input',function(){D.q=elQ.value;render();haut();});

  /* Échap : aperçu d'abord, puis recherche en cours ; false = rien à fermer ici */
  function echap(){
    if(fermerApercu())return true;
    if(document.activeElement===elQ&&elQ.value){elQ.value='';D.q='';render();return true;}
    return false;
  }
  function ouvrir(o){
    o=o||{};
    if(o.section&&dvA(DV_SECTIONS,o.section))D.section=o.section;
    /* arrivée : refs = tout ; B-rolls = produit de la session, sinon Coussin */
    arrivee(o.produit&&o.produit!=='commun'?o.produit:null);
    fermerApercu();
    if(D.q){D.q='';elQ.value='';}
    if(D.etat==='ok')valider();
    sauver();
    var vieux=D.charge&&Date.now()-D.charge>DV_RECHARGE_MS;
    /* 'vide' = index pas encore synchronisé : on retente à chaque ouverture */
    if(D.etat==='init'||D.etat==='vide'||(D.etat==='erreur'&&D.retry)||vieux)charger();
    render();
    haut();
    if(mmFin&&mmFin.matches)setTimeout(function(){try{elQ.focus({preventScroll:true});}catch(x){}},0);
  }
  /* ms = âge au-delà duquel on recharge (défaut 30 min) ; l'état 'vide' est toujours retenté */
  function rafraichirSiVieux(ms){if(D.etat==='vide'||(D.charge&&Date.now()-D.charge>(ms||DV_RECHARGE_MS)))charger();}
  function arreter(){arreterSurvol();fermerApercu();}
  return {ouvrir:ouvrir,charger:charger,echap:echap,arreter:arreter,rafraichirSiVieux:rafraichirSiVieux};
}

var P=null,dvDrive=null;
function boot(payload){
  P=payload;
  dvDrive=dvCreer(document.getElementById('dvHost'),{auth:function(){return P;}});
  dvDrive.ouvrir({});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dvDrive&&dvDrive.echap())e.preventDefault();});
/* onglet ou fenêtre revenu au premier plan après plus de 30 min → index (et jeton d'accès) rechargés */
function dvRevenu(){if(!document.hidden&&dvDrive)dvDrive.rafraichirSiVieux();}
document.addEventListener('visibilitychange',dvRevenu);
window.addEventListener('focus',dvRevenu);
/* onglet resté au premier plan : on recharge avant l'expiration du jeton 24 h (sans fermer l'aperçu toutes les 30 min) */
setInterval(function(){if(!document.hidden&&dvDrive)dvDrive.rafraichirSiVieux(DV_JETON_MS);},10*60*1000);

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../../login.html');return;}
boot(p);})();
</script>
</body>
