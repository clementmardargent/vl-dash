<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vivélan — Créas</title>
<script>try{if(localStorage.getItem('vivelan-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/shared.css">
<style>
[hidden]{display:none!important} /* nos display:flex écraseraient sinon l'attribut hidden */
@keyframes spin{to{transform:rotate(360deg)}}
.crea-main{flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;padding:24px 48px 32px;box-sizing:border-box;display:flex;flex-direction:column}
.crea-box{flex:1;min-height:0;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
/* -- colonne sessions -- */
.crea-side{flex:none;width:280px;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.side-head{flex:none;padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-head .t{font-family:'Lora',serif;font-weight:600;font-size:17px;color:var(--ink)}
.btn-new{padding:8px 13px;font-size:12.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--cream);background:var(--grn);border:none;border-radius:9px;cursor:pointer}
.btn-new:hover{background:var(--grn-dk)}
.side-list{flex:1;overflow-y:auto}
.sess{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:13px 16px;border:none;border-bottom:1px solid var(--bd-soft);background:transparent;cursor:pointer;text-align:left;font-family:'Figtree',sans-serif}
.sess.on{background:var(--grn-bg)}
.sess .nm{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sess .sb{font-size:12px;color:var(--faint);margin-top:2px}
.sess .sb.run{color:var(--grn)}
.sess .sb.ask{color:var(--gold)}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--grn-bg-hov);border-top-color:var(--grn);animation:spin .9s linear infinite;box-sizing:border-box}
.dot-unread{flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.who-dot{flex:none;width:19px;height:19px;border-radius:50%;background:var(--amb-bg);color:var(--amb);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
/* -- pop-up prénom (première visite) : impossible à fermer sans répondre -- */
.name-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,17,.82);align-items:center;justify-content:center;padding:24px;z-index:100}
.name-overlay.open{display:flex}
.name-box{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.name-box h2{font-family:'Lora',serif;font-weight:600;font-size:22px;margin:0;color:var(--ink)}
.name-box p{margin:0;font-size:13.5px;color:var(--mut)}
#nameInput{padding:12px 14px;font-size:15px;font-family:'Figtree',sans-serif;border:1px solid var(--bd-strong);border-radius:10px;background:var(--input);color:var(--tx);outline:none}
#nameInput:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
.side-empty{padding:22px 16px;font-size:13px;color:var(--faint);text-align:center}
/* -- zone chat -- */
.crea-chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
#dropHint{position:absolute;inset:10px;z-index:30;border:2px dashed var(--grn);border-radius:14px;background:var(--grn-bg);display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:15px;font-weight:700;color:var(--grn)}
.chat-head{flex:none;display:flex;align-items:center;gap:11px;padding:14px 22px;border-bottom:1px solid var(--bd)}
.chat-head .ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--grn-bg);color:var(--grn);display:flex;align-items:center;justify-content:center}
.chat-head .nm{font-size:14.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.chat-head .sb{font-size:12px;color:var(--faint)}
.badge-run{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--grn);background:var(--grn-bg);padding:6px 13px;border-radius:999px}
.badge-run .spin{width:13px;height:13px}
.badge-ask{font-size:12px;font-weight:700;color:var(--amb);background:var(--amb-bg);padding:6px 13px;border-radius:999px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.empty-state{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px}
.empty-state h2{font-family:'Lora',serif;font-weight:600;font-size:30px;margin:0;color:var(--ink)}
.empty-state p{margin:0 0 18px;font-size:15.5px;color:var(--mut)}
/* -- messages -- */
.msg{display:flex;flex-direction:column}
.msg.me{align-items:flex-end}
.msg.agent{align-items:flex-start}
.msg .stack{max-width:74%;display:flex;flex-direction:column;gap:8px}
.bubble{padding:10px 15px;font-size:14px;line-height:1.55;text-wrap:pretty;white-space:pre-wrap;word-break:break-word}
.bubble code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.88em;padding:1px 5px;border-radius:5px}
.msg.agent .bubble code{background:rgba(127,127,127,.16)}
.msg.me .bubble code{background:rgba(255,255,255,.18)}
.bubble .mdh{font-weight:700;display:block;margin:2px 0}
.bubble .mdd{font-weight:700}
.msg.me .bubble{border-radius:16px 16px 4px 16px;background:var(--grn);color:var(--cream)}
.msg.me .bubble a{color:var(--cream);text-decoration:underline;font-weight:600}
.msg.agent .bubble{border-radius:16px 16px 16px 4px;background:var(--panel);color:var(--tx)}
.msg.agent .bubble a{color:var(--grn);text-decoration:underline;font-weight:600}
.msg .when{font-size:11px;color:var(--faint);margin-top:4px}
.media-card{border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(145deg,var(--panel),var(--track))}
.media-card img,.media-card video{display:block;width:100%;max-width:100%}
.media-card .cap{padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--mut);border-top:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-family:'Figtree',sans-serif;text-align:left;color:inherit;cursor:pointer}
.file-card:hover{border-color:var(--bd-hov)}
.file-card .fic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--amb-bg);color:var(--amb);display:flex;align-items:center;justify-content:center}
.file-card .fn{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card .fm{font-size:11.5px;color:var(--faint)}
.err-banner{margin:0 22px 10px;padding:10px 14px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:13px;font-weight:600}
/* -- composer -- */
.composer{flex:none;padding:14px 22px 18px;border-top:1px solid var(--bd)}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip-file{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--bd);padding:6px 10px;border-radius:8px}
.chip-file button{border:none;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;padding:0;line-height:1}
.chip-file button:hover{color:var(--red)}
#composeForm{display:flex;gap:10px;align-items:flex-end}
.btn-attach{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd-strong);background:var(--card);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-attach:hover{border-color:var(--grn);color:var(--grn)}
#msgInput{flex:1;min-width:0;resize:none;padding:12px 14px;font-size:14px;line-height:1.5;font-family:'Figtree',sans-serif;border:1px solid var(--bd-strong);border-radius:12px;background:var(--input);color:var(--tx);outline:none;box-sizing:border-box}
#msgInput:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
#msgInput:disabled{opacity:.55}
.btn-send{flex:none;padding:12px 22px;font-size:13.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--cream);background:var(--grn);border:none;border-radius:12px;cursor:pointer}
.btn-send:hover{background:var(--grn-dk)}
.btn-send:disabled{opacity:.55;cursor:wait}
/* -- lecteur markdown -- */
.md-overlay{display:none;position:fixed;inset:0;background:rgba(20,53,45,.45);align-items:center;justify-content:center;padding:32px;z-index:50}
.md-overlay.open{display:flex}
.md-box{width:100%;max-width:780px;height:calc(100vh - 96px);background:var(--card);border-radius:18px;box-shadow:0 24px 60px rgba(20,53,45,.3);display:flex;flex-direction:column;overflow:hidden}
.md-head{flex:none;display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--bd)}
.md-head .fic{flex:none;width:32px;height:32px;border-radius:8px;background:var(--amb-bg);color:var(--amb);display:flex;align-items:center;justify-content:center}
.md-head .nm{flex:1;font-size:14.5px;font-weight:700;color:var(--ink);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-x{width:32px;height:32px;border:none;border-radius:8px;background:var(--panel);color:var(--mut);font-size:15px;cursor:pointer;line-height:1}
.md-x:hover{background:var(--track)}
.md-body{flex:1;min-height:0;overflow-y:auto;padding:32px 40px}
.md-body h1{font-family:'Lora',serif;font-weight:600;font-size:28px;color:var(--ink);margin:0 0 16px}
.md-body h2{font-family:'Lora',serif;font-weight:600;font-size:20px;color:var(--ink);margin:26px 0 10px}
.md-body p{margin:0 0 12px;font-size:14.5px;line-height:1.65;color:var(--tx);text-wrap:pretty}
.md-body .li{display:flex;gap:10px;margin:0 0 8px;font-size:14.5px;line-height:1.6;color:var(--tx)}
.md-body .li .d{flex:none;color:var(--grn);font-weight:700}
.md-body .q{margin:0 0 12px;padding:10px 16px;border-left:3px solid var(--grn);background:var(--panel);border-radius:0 10px 10px 0;font-size:14px;line-height:1.6;color:var(--mut);font-style:italic}
/* -- sélecteur de session mobile (masqué sur desktop) -- */
#mobileSess{display:none}
/* -- mobile ≤720px : uniquement des surcharges — le rendu desktop est inchangé -- */
@media (max-width:720px){
.crea-main{padding:14px 10px 16px}
.crea-side{display:none}
#mobileSess{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
#mobileSess .mchip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--bd-strong);background:var(--card);color:var(--tx);font-size:12.5px;font-weight:700;font-family:'Figtree',sans-serif;cursor:pointer}
#mobileSess .mchip.on{background:var(--grn);color:var(--cream);border-color:var(--grn)}
#mobileSess .mchip .spin{width:12px;height:12px}
#mobileSess .mchip.on .spin{border-color:rgba(253,249,239,.35);border-top-color:var(--cream)}
.msg .stack{max-width:88%}
.chat-body{padding:14px}
.composer{padding:10px 12px 14px}
.md-overlay{padding:10px}
.md-box{height:calc(100vh - 40px)}
.md-body{padding:20px 18px}
.chat-head{padding:12px 14px}
}</style>
</head>
<body>
<div class="vl-shell" style="height:100vh;min-height:0">
<div class="vl-top"></div>
<header class="vl-header">
  <div class="brand">
    <a href="../index.html" style="display:block"><img src="../assets/logo-vivelan.png" alt="Vivélan"></a>
    <span class="vl-admin">Admin</span>
  </div>
  <div class="vl-hright"><button id="themeToggle" class="theme-btn" title="Basculer clair/sombre">☾</button><div class="vl-avatar">V</div></div>
</header>
<main class="crea-main">
  <div class="vl-crumb" style="flex:none;margin-bottom:16px"><a href="../index.html">Tableau de bord</a> <span class="sep">/</span> <span class="here">Créas</span></div>
  <div class="crea-box">
    <aside class="crea-side">
      <div class="side-head"><span class="t">Sessions</span><button type="button" id="newBtn" class="btn-new">+ Nouvelle</button></div>
      <div id="sessList" class="side-list"></div>
    </aside>
    <section class="crea-chat" id="chatZone">
      <div id="dropHint" hidden>Déposez vos fichiers ici</div>
      <div id="mobileSess"></div>
      <div id="chatHead" class="chat-head" hidden>
        <div class="ico"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3l1.8 4.7L18 9.5l-4.2 1.8L12 16l-1.8-4.7L6 9.5l4.2-1.8z M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"></path></svg></div>
        <div style="flex:1;min-width:0"><div class="nm" id="selName"></div><div class="sb" id="selWhen"></div></div>
        <span id="badgeRun" class="badge-run" hidden><span class="spin"></span>L'agent travaille…</span>
        <span id="badgeAsk" class="badge-ask" hidden>En attente de votre réponse</span>
      </div>
      <div id="chatBody" class="chat-body" hidden></div>
      <div id="emptyState" class="empty-state">
        <h2>Bonjour</h2>
        <p>Que souhaitez-vous créer aujourd'hui&nbsp;?</p>
      </div>
      <div id="errBanner" class="err-banner" hidden></div>
      <div class="composer">
        <div id="chips" hidden></div>
        <form id="composeForm">
          <button type="button" id="attachBtn" class="btn-attach" title="Joindre un fichier"><svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.3 3.3 0 014.7 4.7L10 18.4a1.7 1.7 0 01-2.4-2.4L16 7.5"></path></svg></button>
          <input type="file" id="fileInput" multiple hidden>
          <textarea id="msgInput" rows="2"></textarea>
          <button type="submit" id="sendBtn" class="btn-send">Envoyer</button>
        </form>
      </div>
    </section>
  </div>
</main>
</div>
<div id="nameOverlay" class="name-overlay">
  <form id="nameForm" class="name-box">
    <h2>Bienvenue 👋</h2>
    <p>Première visite de l'espace Créas sur ce navigateur — dites-nous qui vous êtes, pour savoir qui lance quoi.</p>
    <input id="nameInput" type="text" placeholder="Votre prénom" autocomplete="given-name" maxlength="40">
    <button type="submit" class="btn-send" style="width:100%">C'est parti</button>
  </form>
</div>
<div id="mdOverlay" class="md-overlay">
  <div class="md-box">
    <div class="md-head">
      <div class="fic"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 3H6v18h12V7z M14 3v4h4"></path></svg></div>
      <span class="nm" id="mdName"></span>
      <button type="button" id="mdClose" class="md-x">✕</button>
    </div>
    <div class="md-body" id="mdBody"></div>
  </div>
</div>
<script>
const BLOB="{\"salt\":\"P/ARlITpm5zUDKf4pKlG/Q==\",\"iv\":\"WwnbONs0Y1wCwRga\",\"data\":\"QX1ZUvYS3EIdiECr0F2wYzwxXdEXoH1Z7hONtveUqyoQHoRxoPLZa0YMqfoDDIBthzdBgkpKpbtzI9wNs+dWWYB54vqcaHDPIZWIVUlG2GdxIsrxJdTszf9AE1kPHg8yj4JHsBUai9WLAfQJSvzR6hiEizAxLcQyd48bCamd6lnHVXWfX1Zv5keJwnsVMQ==\"}";

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

(function(){var b=document.getElementById('themeToggle');if(!b)return;
function icon(){b.textContent=document.documentElement.classList.contains('dark')?'☀':'☾';}
icon();
b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');
try{localStorage.setItem('vivelan-theme',d?'dark':'light')}catch(e){}icon();});})();

'use strict';
var P=null; /* {key, worker} — depuis le blob chiffré */
var state={sessions:[],sel:null,lastId:0,attachments:[],mdName:null,mdText:'',sending:false};
var TIMER=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function bySel(){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].id===state.sel)return state.sessions[i];return null;}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+P.key},opt.headers||{});
return fetch(P.worker+path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;});});}
function showErr(msg){var b=document.getElementById('errBanner');b.textContent=msg;b.hidden=false;
clearTimeout(showErr._t);showErr._t=setTimeout(function(){b.hidden=true;},6000);}

var MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function frWhen(iso){var d=new Date(iso);if(isNaN(d))return '';
var today=new Date();var same=d.toDateString()===today.toDateString();
var hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
return same?hm:d.getDate()+' '+MOIS[d.getMonth()]+' '+hm;}
function frDay(iso){var d=new Date(iso);if(isNaN(d))return '';
return 'ouverte le '+d.getDate()+' '+MOIS[d.getMonth()];}

/* libellés d'état — 'file'/'production'/'attente_medias' = l'agent travaille */
var RUNNING={file:1,production:1,attente_medias:1};
function subOf(s){
  if(s.status==='production')return {t:'Production en cours…',cls:'run',spin:true};
  if(s.status==='attente_medias')return {t:'Génération des médias…',cls:'run',spin:true};
  if(s.status==='file')return {t:'Transmis à l\'agent…',cls:'run',spin:true};
  if(s.status==='besoin_humain')return {t:'Une question pour vous',cls:'ask',spin:false};
  return {t:frDay(s.created_at),cls:'',spin:false};
}

var FILE_SVG='<svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 3H6v18h12V7z M14 3v4h4"></path></svg>';

/* markdown léger dans les bulles : gras, italique, code, liens, titres, puces — tout est échappé d'abord */
function mdInline(s){
  var h=esc(s);
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/^#{1,4}\s+(.+)$/gm,'<span class="mdh">$1</span>');
  h=h.replace(/^[-*•]\s+/gm,'<span class="mdd">—</span> ');
  return h;
}

function whoDot(s){
  if(!s.auteur)return '';
  return '<span class="who-dot" title="Lancée par '+esc(s.auteur)+'">'+esc(s.auteur.charAt(0))+'</span>';
}
function sessRow(s){
  var sub=subOf(s);
  return '<button type="button" class="sess'+(state.sel===s.id?' on':'')+'" data-sess="'+s.id+'">'
    +'<div style="flex:1;min-width:0"><div class="nm">'+esc(s.name)+'</div>'
    +'<div class="sb '+sub.cls+'">'+esc(sub.t)+'</div></div>'
    +whoDot(s)
    +(sub.spin?'<span class="spin" title="L\'agent travaille"></span>':'')
    +(!sub.spin&&s.unread?'<span class="dot-unread" title="Travail à consulter"></span>':'')
    +'</button>';
}
function mobileChip(s){
  var sub=subOf(s);
  return '<button type="button" class="mchip'+(state.sel===s.id?' on':'')+'" data-sess="'+s.id+'">'
    +esc(s.name)+whoDot(s)+(sub.spin?'<span class="spin"></span>':(s.unread?'<span class="dot-unread"></span>':''))+'</button>';
}
function msgHtml(m){
  var me=m.role!=='agent';
  var parts='';
  if(m.text)parts+='<div class="bubble">'+mdInline(m.text)+'</div>';
  if(m.file){
    var f=m.file;
    if(f.kind==='image')parts+='<div class="media-card" style="width:240px"><img src="'+esc(f.url)+'" alt="" loading="lazy"><div class="cap">'+esc(f.name)+'</div></div>';
    else if(f.kind==='video')parts+='<div class="media-card" style="width:260px"><video src="'+esc(f.url)+'" controls preload="metadata"></video><div class="cap">'+esc(f.name)+'</div></div>';
    else if(f.kind==='md')parts+='<button type="button" class="file-card" data-md="'+esc(f.url)+'" data-mdname="'+esc(f.name)+'">'
      +'<div class="fic">'+FILE_SVG+'</div><div style="min-width:0"><div class="fn">'+esc(f.name)+'</div><div class="fm">'+esc(f.meta||'')+'</div></div></button>';
    else parts+='<a class="file-card" href="'+esc(f.url)+'" target="_blank" rel="noopener" download="'+esc(f.name)+'">'
      +'<div class="fic">'+FILE_SVG+'</div><div style="min-width:0"><div class="fn">'+esc(f.name)+'</div><div class="fm">'+esc(f.meta||'')+'</div></div></a>';
  }
  if(!parts)return '';
  return '<div class="msg '+(me?'me':'agent')+'"><div class="stack">'+parts+'</div>'
    +'<span class="when">'+esc(frWhen(m.when))+'</span></div>';
}

function renderSide(){
  var side=document.getElementById('sessList');
  side.innerHTML=state.sessions.length?state.sessions.map(sessRow).join('')
    :'<div class="side-empty">Aucune session — écrivez un premier message, elle se crée toute seule.</div>';
  document.getElementById('mobileSess').innerHTML=state.sessions.map(mobileChip).join('');
}
function renderHead(){
  var sel=bySel();
  var headEl=document.getElementById('chatHead');
  var emptyEl=document.getElementById('emptyState');
  var bodyEl=document.getElementById('chatBody');
  if(!sel){headEl.hidden=true;bodyEl.hidden=true;emptyEl.hidden=false;}
  else{
    headEl.hidden=false;emptyEl.hidden=true;bodyEl.hidden=false;
    document.getElementById('selName').textContent=sel.name;
    document.getElementById('selWhen').textContent='Agent créas · '+frDay(sel.created_at);
    document.getElementById('badgeRun').hidden=!RUNNING[sel.status];
    document.getElementById('badgeAsk').hidden=sel.status!=='besoin_humain';
  }
  document.getElementById('msgInput').placeholder=sel?'Répondre à l\'agent…':'Décrivez la vidéo à produire — la session se crée à l\'envoi…';
  var chips=document.getElementById('chips');
  chips.hidden=state.attachments.length===0;
  chips.innerHTML=state.attachments.map(function(f,i){
    return '<span class="chip-file">'+FILE_SVG+esc(f.name)+'<button type="button" data-rm="'+i+'">✕</button></span>';}).join('');
}
function appendMsgs(list){
  var bodyEl=document.getElementById('chatBody');
  var atBottom=bodyEl.scrollHeight-bodyEl.scrollTop-bodyEl.clientHeight<80;
  var html='';
  for(var i=0;i<list.length;i++){html+=msgHtml(list[i]);if(list[i].id>state.lastId)state.lastId=list[i].id;}
  bodyEl.insertAdjacentHTML('beforeend',html);
  if(atBottom)bodyEl.scrollTop=bodyEl.scrollHeight;
}
function renderMd(){
  var ov=document.getElementById('mdOverlay');
  if(!state.mdName){ov.classList.remove('open');return;}
  ov.classList.add('open');
  document.getElementById('mdName').textContent=state.mdName;
  document.getElementById('mdBody').innerHTML=state.mdText.split('\n').filter(function(l){return l.trim();}).map(function(l){
    if(l.indexOf('# ')===0)return '<h1>'+esc(l.slice(2))+'</h1>';
    if(l.indexOf('## ')===0)return '<h2>'+esc(l.slice(3))+'</h2>';
    if(l.indexOf('- ')===0||l.indexOf('* ')===0)return '<div class="li"><span class="d">—</span><span>'+esc(l.slice(2))+'</span></div>';
    if(l.indexOf('> ')===0)return '<div class="q">'+esc(l.slice(2))+'</div>';
    return '<p>'+esc(l)+'</p>';}).join('');
}

/* ---- chargements ---- */
function loadSessions(){
  return api('/sessions').then(function(j){state.sessions=j.sessions;renderSide();renderHead();});
}
function openSession(id){
  state.sel=id;state.lastId=0;
  document.getElementById('chatBody').innerHTML='';
  renderSide();renderHead();
  api('/sessions/'+id+'/lu',{method:'POST'}).catch(function(){});
  var s=bySel();if(s)s.unread=0;
  return api('/sessions/'+id+'/messages').then(function(j){
    appendMsgs(j.messages);
    document.getElementById('chatBody').scrollTop=document.getElementById('chatBody').scrollHeight;
  }).catch(function(e){showErr('Chargement impossible : '+e.message);});
}
function tick(){
  if(document.hidden)return;
  loadSessions().then(function(){
    if(state.sel===null)return;
    return api('/sessions/'+state.sel+'/messages?after='+state.lastId).then(function(j){
      if(j.messages.length)appendMsgs(j.messages);
    });
  }).catch(function(){/* réseau : on retentera au tick suivant */});
}

/* ---- clics (délégation) ---- */
document.addEventListener('click',function(e){
  var s=e.target.closest('[data-sess]');
  if(s){openSession(Number(s.getAttribute('data-sess')));return;}
  var md=e.target.closest('[data-md]');
  if(md){
    state.mdName=md.getAttribute('data-mdname');state.mdText='Chargement…';renderMd();
    fetch(md.getAttribute('data-md')).then(function(r){return r.text();})
      .then(function(t){state.mdText=t;renderMd();})
      .catch(function(){state.mdText='Impossible de charger le fichier.';renderMd();});
    return;
  }
  var rm=e.target.closest('[data-rm]');
  if(rm){state.attachments.splice(Number(rm.getAttribute('data-rm')),1);renderHead();return;}
});
document.getElementById('newBtn').addEventListener('click',function(){
  state.sel=null;state.lastId=0;state.attachments=[];
  document.getElementById('msgInput').value='';
  renderSide();renderHead();
  document.getElementById('msgInput').focus();
});
document.getElementById('mdClose').addEventListener('click',function(){state.mdName=null;renderMd();});
document.getElementById('mdOverlay').addEventListener('click',function(e){
  if(e.target===this){state.mdName=null;renderMd();}
});

/* ---- pièces jointes ---- */
var fileInput=document.getElementById('fileInput');
document.getElementById('attachBtn').addEventListener('click',function(){fileInput.click();});
fileInput.addEventListener('change',function(){
  for(var i=0;i<fileInput.files.length;i++)state.attachments.push(fileInput.files[i]);
  fileInput.value='';renderHead();
});
var chatZone=document.getElementById('chatZone');
chatZone.addEventListener('dragover',function(e){e.preventDefault();document.getElementById('dropHint').hidden=false;});
chatZone.addEventListener('dragleave',function(e){
  if(e.currentTarget===e.target||!e.currentTarget.contains(e.relatedTarget))document.getElementById('dropHint').hidden=true;});
chatZone.addEventListener('drop',function(e){
  e.preventDefault();document.getElementById('dropHint').hidden=true;
  var fs=e.dataTransfer.files||[];
  for(var i=0;i<fs.length;i++)state.attachments.push(fs[i]);
  if(fs.length)renderHead();
});

/* ---- envoi ---- */
function sendFile(sid,f){
  return fetch(P.worker+'/sessions/'+sid+'/fichier',{method:'POST',
    headers:{'Authorization':'Bearer '+P.key,'X-File-Name':encodeURIComponent(f.name)},body:f})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;});});
}
document.getElementById('composeForm').addEventListener('submit',function(e){
  e.preventDefault();
  if(state.sending)return;
  var input=document.getElementById('msgInput');
  var text=input.value.trim();
  var files=state.attachments.slice();
  if(!text&&files.length===0)return;
  state.sending=true;
  document.getElementById('sendBtn').disabled=true;
  var start=state.sel!==null?Promise.resolve({id:state.sel})
    :api('/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auteur:PRENOM||''})});
  start.then(function(s){
    var sid=s.id;
    var chain=Promise.resolve();
    files.forEach(function(f){chain=chain.then(function(){return sendFile(sid,f);});});
    if(text)chain=chain.then(function(){return api('/sessions/'+sid+'/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})});});
    return chain.then(function(){
      input.value='';state.attachments=[];
      return loadSessions().then(function(){
        if(state.sel!==sid)return openSession(sid);
        return api('/sessions/'+sid+'/messages?after='+state.lastId).then(function(j){appendMsgs(j.messages);});
      });
    });
  }).catch(function(e2){showErr('Envoi échoué : '+e2.message);})
  .finally(function(){state.sending=false;document.getElementById('sendBtn').disabled=false;renderHead();});
});
/* Entrée = envoyer, Maj+Entrée = saut de ligne */
document.getElementById('msgInput').addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.keyCode===13)&&!e.shiftKey){e.preventDefault();document.getElementById('composeForm').requestSubmit();}
});

/* ---- prénom (première visite de l'espace Créa) ---- */
var PRENOM=null;
try{PRENOM=localStorage.getItem('crea_prenom')||null;}catch(e){}
function demarrer(){
  loadSessions().catch(function(e){showErr('Worker injoignable : '+e.message);});
  TIMER=setInterval(tick,4000);
}
document.getElementById('nameForm').addEventListener('submit',function(e){
  e.preventDefault();
  var v=document.getElementById('nameInput').value.trim();
  if(!v)return;
  PRENOM=v.charAt(0).toUpperCase()+v.slice(1);
  try{localStorage.setItem('crea_prenom',PRENOM);}catch(e2){}
  document.getElementById('nameOverlay').classList.remove('open');
  demarrer();
});
function boot(payload){
  P=payload;
  if(!P.key){showErr('Clé d\'accès absente du build — page en lecture seule.');
    document.getElementById('msgInput').disabled=true;return;}
  if(!PRENOM){
    document.getElementById('nameOverlay').classList.add('open');
    document.getElementById('nameInput').focus();
    return; /* rien ne charge tant que le prénom n'est pas donné */
  }
  demarrer();
}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../login.html');return;}
boot(p);})();
</script>
