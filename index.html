<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Compta Vivélan</title><style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#15271b;--mut:#5f7367;--bd:#dde5dd;--good:#0a7d4f;--bad:#c0392b;--warn:#b8860b;--acc:#1d5c3d}
@media(prefers-color-scheme:dark){:root{--bg:#101613;--card:#18211b;--tx:#e8f0e9;--mut:#8fa396;--bd:#26332a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
#gate{display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#gate input{font-size:17px;padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(320px,80vw)}
#gate button{font-size:16px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
#err{color:var(--bad);min-height:1.2em}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700}
.tile .v{font-size:26px;font-weight:800;margin-top:2px}.tile .s{font-size:12px;color:var(--mut)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--mut)}
td.note{text-align:left;color:var(--mut);font-size:12px;max-width:260px;white-space:normal}
.pill{padding:2px 8px;border-radius:999px;font-weight:700}
.p-good{background:rgba(10,125,79,.14);color:var(--good)}.p-bad{background:rgba(192,57,43,.14);color:var(--bad)}.p-warn{background:rgba(184,134,11,.14);color:var(--warn)}.p-na{color:var(--mut)}
.foot{color:var(--mut);font-size:12px;margin-top:16px}
</style></head><body>
<div id="gate"><h1>🔒 Compta Vivélan</h1><input id="pw" type="password" placeholder="Mot de passe" autofocus>
<button onclick="unlock()">Ouvrir</button><div id="err"></div></div>
<div class="wrap" id="app" style="display:none"></div>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(key){const blob=JSON.parse(BLOB);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}
async function unlock(){const pw=document.getElementById('pw').value;const blob=JSON.parse(BLOB);
try{const key=await deriveKey(pw,b2u(blob.salt));const data=await tryDecrypt(key);
const raw=await crypto.subtle.exportKey('raw',key);
localStorage.setItem('compta_key',JSON.stringify({k:btoa(String.fromCharCode(...new Uint8Array(raw))),exp:Date.now()+30*864e5}));
render(data);}catch(e){document.getElementById('err').textContent='Mot de passe incorrect';}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
(async()=>{try{const s=JSON.parse(localStorage.getItem('compta_key')||'null');
if(s&&s.exp>Date.now()){const key=await crypto.subtle.importKey('raw',b2u(s.k),{name:'AES-GCM'},false,['decrypt']);
render(await tryDecrypt(key));}}catch(e){localStorage.removeItem('compta_key');}})();
const eur=(n)=>n==null?'—':n.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
function merPill(m,be){if(m==null)return'<span class="pill p-na">—</span>';
const c=m>=be*1.15?'p-good':(m>=be?'p-warn':'p-bad');return'<span class="pill '+c+'">'+m.toFixed(2)+'</span>';}
function render(d){document.getElementById('gate').style.display='none';const app=document.getElementById('app');app.style.display='block';
const t=d.totals,be=d.params.be_roas;
const missing=t.spendMissingDays?'<div class="sub">⚠️ '+t.spendMissingDays+' jour(s) sans spend Meta saisi — le profit total ignore ces jours.</div>':'';
app.innerHTML='<h1>Compta Vivélan</h1><div class="sub">Généré le '+new Date(d.generatedAt).toLocaleString('fr-FR')+' · BE ROAS '+be+' · CAC max '+d.params.cac_break_even+' €</div>'
+'<div class="tiles">'
+'<div class="tile"><div class="l">CA net</div><div class="v">'+eur(t.revenue)+'</div><div class="s">'+t.orders+' commandes</div></div>'
+'<div class="tile"><div class="l">Spend Meta</div><div class="v">'+eur(t.spend)+'</div><div class="s">MER '+(t.mer??'—')+'</div></div>'
+'<div class="tile"><div class="l">Profit net</div><div class="v '+(t.net>0?'good':'bad')+'">'+eur(t.net)+'</div><div class="s">après COGS, frais, pub, outils</div></div>'
+'<div class="tile"><div class="l">CAC</div><div class="v">'+eur(t.cac)+'</div><div class="s">plafond '+d.params.cac_break_even+' €</div></div>'
+'<div class="tile"><div class="l">Charges fixes</div><div class="v">'+eur(t.fixedMonthly)+'</div><div class="s">par mois</div></div>'
+'</div>'+missing
+'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Spend</th><th>Cmd</th><th>CA net</th><th>COGS</th><th>Frais</th><th>Profit</th><th>MER</th><th>MER 3j</th><th>CAC</th><th>Note</th></tr></thead><tbody>'
+d.days.map(x=>{const pc=x.net==null?'':(x.net>0?'good':'bad');
return'<tr><td>'+x.date+'</td><td>'+(x.spend==null?'<span class="pill p-na">à saisir</span>':eur(x.spend))+'</td><td>'+x.orders+'</td><td>'+eur(x.netRevenue)+'</td><td>'+eur(x.cogs)+'</td><td>'+eur(x.fees)+'</td>'
+'<td class="'+pc+'"><b>'+(x.net==null?'—':eur(x.net))+'</b></td><td>'+merPill(x.mer,be)+'</td><td>'+merPill(x.mer3,be)+'</td><td>'+(x.cac==null?'—':eur(x.cac))+'</td><td class="note">'+x.note+'</td></tr>'}).join('')
+'</tbody></table></div>'
+'<div class="foot">Profit jour = CA − refunds − COGS ('+d.params.cogs_per_order_bundle+' €/cmd) − frais paiement − spend − charges fixes/30. Session mémorisée 30 jours.</div>';}
</script></body></html>
