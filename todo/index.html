<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vivélan — To-do list</title>
<script>try{if(localStorage.getItem('vivelan-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/shared.css">
<style>
.todo-input{flex:1;min-width:0;padding:13px 16px;font-size:14.5px;font-family:'Figtree',sans-serif;border:1px solid var(--bd-strong);border-radius:12px;background:var(--card);color:var(--tx);outline:none}
.todo-input:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
.todo-input:disabled{opacity:.55;cursor:not-allowed}
.todo-add{padding:0 20px;font-size:13.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--cream);background:var(--grn);border:none;border-radius:12px;cursor:pointer}
.todo-add:hover{background:var(--grn-dk)}
.todo-add:disabled{opacity:.55;cursor:not-allowed}
.wchip{padding:5px 13px;border-radius:999px;border:1px solid var(--bd-strong);background:var(--card);color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Figtree',sans-serif}
.wchip.on{background:var(--grn);color:var(--cream);border-color:var(--grn)}
.sec-label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--amb);margin-bottom:10px}
.trow{position:relative;display:flex;align-items:center;gap:12px;padding:13px 20px 13px 14px;border-bottom:1px solid var(--bd-soft);background:transparent}
.trow:hover{background:var(--bg)}
.trow.dragging{opacity:.35}
.ins-line{position:absolute;left:10px;right:10px;height:3px;border-radius:999px;background:var(--grn);z-index:5;pointer-events:none}
.ins-line.top{top:-2px}
.ins-line.bottom{bottom:-2px}
.grip{flex:none;cursor:grab;color:var(--faint2);font-size:13px;letter-spacing:1px;user-select:none}
.circ{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--bd-hov);background:transparent;cursor:pointer;padding:0}
.circ:hover{border-color:var(--grn);background:var(--grn-bg)}
.ttl{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--ink)}
.whobtn{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:'Figtree',sans-serif;cursor:pointer}
.whomenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--bd-mid);border-radius:10px;box-shadow:0 10px 28px rgba(20,53,45,.16);padding:6px;z-index:20;min-width:160px;display:flex;flex-direction:column;gap:2px}
.who-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:none;border-radius:7px;background:transparent;color:var(--ink);font-size:13px;font-weight:600;font-family:'Figtree',sans-serif;cursor:pointer;text-align:left}
.who-opt.on{background:var(--panel)}
.who-opt:hover{background:var(--panel)}
.who-opt .chk{color:var(--grn);font-size:12px}
.del{flex:none;width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--faint2);font-size:13px;cursor:pointer;line-height:1;padding:0}
.del:hover{background:var(--red-bg);color:var(--red)}
.drow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--bd-soft)}
.drow:hover{background:var(--bg)}
.dcheck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--grn);background:var(--grn);color:var(--cream);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dttl{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--faint);text-decoration:line-through}
.done-toggle{display:flex;align-items:center;gap:8px;border:none;background:transparent;padding:0;margin-bottom:10px;cursor:pointer;font-family:'Figtree',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.done-toggle:hover{color:var(--mut)}
.empty{text-align:center;padding:34px 20px;font-size:14px;color:var(--faint)}
.tdesc{font-size:12.5px;font-weight:400;color:var(--mut);margin-top:3px;line-height:1.45;word-break:break-word;white-space:pre-line}
.tdesc a{color:var(--grn);font-weight:600;text-decoration:none}
.tdesc a:hover{text-decoration:underline}
.editbtn{flex:none;width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--faint2);font-size:13px;cursor:pointer;line-height:1;padding:0}
.editbtn:hover{background:var(--grn-bg);color:var(--grn)}
.vl-card.dropzone{outline:2px dashed var(--grn);outline-offset:-2px}
.td-overlay{display:none;position:fixed;inset:0;background:rgba(20,53,45,.35);align-items:center;justify-content:center;padding:24px;z-index:50}
.td-overlay.open{display:flex}
.td-form{width:100%;max-width:480px;background:var(--card);border-radius:16px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(20,53,45,.25)}
.td-x{width:30px;height:30px;border:none;border-radius:8px;background:var(--panel);color:var(--mut);font-size:15px;cursor:pointer;line-height:1}
.td-x:hover{background:var(--track)}
.td-cancel{padding:11px 18px;font-size:13.5px;font-weight:600;font-family:'Figtree',sans-serif;color:var(--grn);background:var(--grn-bg);border:none;border-radius:10px;cursor:pointer}
.td-cancel:hover{background:var(--grn-bg-hov)}
.td-submit{padding:11px 20px;font-size:13.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--cream);background:var(--grn);border:none;border-radius:10px;cursor:pointer}
.td-submit:hover{background:var(--grn-dk)}
textarea.todo-input{resize:vertical;min-height:88px;line-height:1.5}
/* mobile : lignes plus compactes — aucune règle desktop modifiée */
@media (max-width:720px){
.trow{gap:8px;padding:12px 12px 12px 8px}
.grip{display:none} /* le drag HTML5 n'existe pas au doigt — la poignée ne fait que voler de la place */
.whobtn{padding:4px 8px;font-size:10.5px}
.drow{gap:10px;padding:12px 14px}
}
</style>
</head>
<body>
<div class="vl-shell">
<div class="vl-top"></div>
<header class="vl-header">
  <div class="brand">
    <a href="../index.html" style="display:block"><img src="../assets/logo-vivelan.png" alt="Vivélan"></a>
    <span class="vl-admin">Admin</span>
  </div>
  <div class="vl-hright"><span class="vl-gen" id="sync"></span><button id="themeToggle" class="theme-btn" title="Basculer clair/sombre">☾</button><div class="vl-avatar">V</div></div>
</header>
<main class="vl-main" style="max-width:760px">
    <div class="vl-crumb"><a href="../index.html">Tableau de bord</a> <span class="sep">/</span> <span class="here">To-do list</span></div>
    <div id="roBanner" hidden style="background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:18px">Synchronisation désactivée (pas de token) — lecture seule.</div>
    <h1 class="vl-h1" style="margin-bottom:8px">To-do list</h1>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:26px">
      <span id="progressTxt" style="font-size:13.5px;color:var(--mut)"></span>
      <div style="flex:1;max-width:220px;height:6px;border-radius:999px;background:var(--track);overflow:hidden"><div id="progressBar" style="height:100%;border-radius:999px;background:var(--grn);width:0%"></div></div>
    </div>

    <form id="addForm" style="display:flex;flex-direction:column;gap:10px;margin-bottom:26px">
      <div style="display:flex;gap:10px">
        <input id="newTitle" type="text" class="todo-input" placeholder="Nouvelle tâche… (Entrée pour ajouter)">
        <button type="submit" class="todo-add" id="addBtn">Ajouter</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12.5px;color:var(--faint)">Filtrer&nbsp;:</span>
        <span id="filterChips" style="display:flex;align-items:center;gap:8px"></span>
      </div>
    </form>

    <div class="sec-label">À faire</div>
    <div id="openList" class="vl-card" style="margin-bottom:28px"></div>

    <div class="sec-label" style="color:var(--faint)">Plus tard</div>
    <div id="laterList" class="vl-card" style="margin-bottom:28px"></div>

    <div id="doneWrap"></div>
  </main>
<footer class="vl-footer"><span>Vivélan — espace interne</span><span>v2</span></footer>
<div id="overlay" hidden style="position:fixed;inset:0;z-index:10"></div>
  <div id="editOverlay" class="td-overlay">
    <form id="editForm" class="td-form">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2 class="serif" style="font-weight:600;font-size:21px;margin:0;color:var(--ink)">Modifier la tâche</h2>
        <button type="button" id="editClose" class="td-x">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="editTitle" style="font-size:13px;font-weight:600;color:var(--ink)">Titre</label>
        <input id="editTitle" type="text" class="todo-input" autocomplete="off">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="editDesc" style="font-size:13px;font-weight:600;color:var(--ink)">Description</label>
        <textarea id="editDesc" class="todo-input" rows="4" placeholder="Notes, contexte, liens… (les URL seront cliquables)"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" id="editCancel" class="td-cancel">Annuler</button>
        <button type="submit" class="td-submit">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

var SYNC=(function(){
var GH=null,REPO='',PATH='',MSG='',SHA=null,TIMER=null,PUSHING=false,DIRTY=false,GEN=0,SER=null,APPLY=null;
function api(){return 'https://api.github.com/repos/'+REPO+'/contents/'+PATH;}
function hdr(){return {Authorization:'Bearer '+GH,Accept:'application/vnd.github+json'};}
function b64utf8(s){var u=new TextEncoder().encode(s),b='';for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b);}
function utf8b64(b){return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),function(c){return c.charCodeAt(0);}));}
function setSync(t){var el=document.getElementById('sync');if(el)el.textContent=t;}
async function push(keepalive){clearTimeout(TIMER);
if(S.ro||!DIRTY)return;
if(PUSHING){TIMER=setTimeout(push,2000);return;} /* verrou : jamais deux envois simultanés */
PUSHING=true;setSync('⏳ envoi…');
var gen=GEN;
try{
if(!SHA){var r0=await fetch(api(),{headers:hdr(),cache:'no-store'});
if(r0.ok)SHA=(await r0.json()).sha;else if(r0.status!==404)throw new Error('lecture HTTP '+r0.status);}
var body={message:MSG,content:b64utf8(SER())};if(SHA)body.sha=SHA;
var put=await fetch(api(),{method:'PUT',headers:hdr(),keepalive:!!keepalive,body:JSON.stringify(body)});
if(!put.ok){
/* 409/422 = quelqu'un a poussé entre notre lecture et notre écriture → on relit le sha et on renvoie */
if(put.status===409||put.status===422){setSync('⏳ conflit de version — nouvel essai…');SHA=null;PUSHING=false;TIMER=setTimeout(push,800);return;}
throw new Error('commit HTTP '+put.status);}
var res=await put.json();SHA=res.content&&res.content.sha?res.content.sha:null;
if(GEN===gen){DIRTY=false;setSync('✅ synchronisé');}
else{TIMER=setTimeout(push,500);} /* modifié pendant l'envoi → on repousse */
}catch(e){setSync('❌ envoi échoué ('+e.message+') — réessai auto…');TIMER=setTimeout(push,15000);}
finally{PUSHING=false;}}
var S={ro:true,
init:function(p,msg,ser,apply){GH=p.gh;REPO=p.repo;PATH=p.path;MSG=msg;SER=ser;APPLY=apply;S.ro=!GH;
if(S.ro){var b=document.getElementById('roBanner');if(b)b.hidden=false;return;}
setSync('✅ synchronisé');
window.addEventListener('pagehide',function(){if(DIRTY)push(true);});
document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='hidden'){if(DIRTY)push(true);}
else if(!DIRTY&&!PUSHING)S.refresh();});},
refresh:async function(){if(S.ro)return;
try{var r=await fetch(api(),{headers:hdr(),cache:'no-store'});
if(r.status===404){SHA=null;return;}
if(!r.ok)throw new Error('HTTP '+r.status);
var f=await r.json();SHA=f.sha;
if(!DIRTY&&!PUSHING)APPLY(JSON.parse(utf8b64(f.content)));}
catch(e){/* silencieux : le seed est déjà affiché */}},
change:function(){if(S.ro)return;GEN++;DIRTY=true;setSync('⏳ envoi…');clearTimeout(TIMER);TIMER=setTimeout(push,2000);}};
return S;})();

'use strict';
var WHO = ['', 'Matis', 'Clément'];
var FILTERS = ['all', 'Matis', 'Clément', ''];
var state = { tasks: [], doneOpen: true, filterWho: 'all', menuFor: null, editFor: null };
var dragId = null, overIdx = null, overBucket = null;

function normTasks(obj){
  return (obj && Array.isArray(obj.tasks) ? obj.tasks : [])
    .filter(function(t){ return t && typeof t.title === 'string'; })
    .map(function(t){
      return {
        id: Number(t.id) || 0,
        title: String(t.title),
        done: !!t.done,
        who: WHO.indexOf(t.who) >= 0 ? t.who : '',
        later: !!t.later,
        desc: typeof t.desc === 'string' ? t.desc : ''
      };
    });
}
function newId(){
  var id = Date.now();
  while (state.tasks.some(function(t){ return t.id === id; })) id++;
  return id;
}
function serialize(){
  /* later/desc omis quand vides : data/todo.json reste identique pour les tâches simples */
  return JSON.stringify({ tasks: state.tasks.map(function(t){
    var o = { id: t.id, title: t.title, done: t.done, who: t.who };
    if (t.later) o.later = true;
    if (t.desc) o.desc = t.desc;
    return o;
  }) }, null, 2) + '\n';
}
function save(){ SYNC.change(); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* URLs de la description → liens cliquables (tout le reste est échappé) */
function linkify(s){
  var out = '', re = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi, last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    var url = m[0];
    /* ponctuation finale hors du lien ; une ')' finale n'est retirée que si non appariée
       (les URLs Wikipedia/Notion du type /Coussin_(objet) restent intactes) */
    for (;;) {
      if (/[.,;:]$/.test(url)) { url = url.slice(0, -1); continue; }
      if (/\)$/.test(url) && (url.match(/\(/g) || []).length < (url.match(/\)/g) || []).length) { url = url.slice(0, -1); continue; }
      break;
    }
    var trail = m[0].slice(url.length);
    var href = /^https?:/i.test(url) ? url : 'https://' + url;
    out += '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(url) + '</a>' + esc(trail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

function whoStyle(w){
  if (w === 'Matis')   return 'border:1px solid transparent;background:var(--grn-bg);color:var(--grn)';
  if (w === 'Clément') return 'border:1px solid transparent;background:var(--amb-bg);color:var(--amb)';
  return 'border:1px dashed var(--bd-x);background:transparent;color:var(--faint)';
}
function whoLabel(w){ return w || 'Non assigné'; }

function openTasks(){ return state.tasks.filter(function(t){ return !t.done && !t.later; }); }
function laterTasks(){ return state.tasks.filter(function(t){ return !t.done && t.later; }); }
function doneTasks(){ return state.tasks.filter(function(t){ return t.done; }); }
function matchesFilter(t){ return state.filterWho === 'all' || (t.who || '') === state.filterWho; }
function visibleOpen(){ return openTasks().filter(matchesFilter); }
function visibleLater(){ return laterTasks().filter(matchesFilter); }
function listTasks(bucket){ return bucket === 'later' ? visibleLater() : visibleOpen(); }

function menuHtml(t){
  var opts = WHO.map(function(v){
    var on = (t.who || '') === v;
    return '<button type="button" class="who-opt' + (on ? ' on' : '') + '" data-action="assign" data-id="' + t.id + '" data-who="' + esc(v) + '">' +
      '<span>' + whoLabel(v) + '</span><span class="chk">' + (on ? '✓' : '') + '</span></button>';
  }).join('');
  return '<div class="whomenu">' + opts + '</div>';
}

function rowHtml(t, i){
  return '<div class="trow"' + (SYNC.ro ? '' : ' draggable="true"') + ' data-id="' + t.id + '" data-idx="' + i + '">' +
    '<div class="ins-line top" hidden></div>' +
    '<div class="ins-line bottom" hidden></div>' +
    '<span class="grip" title="Glisser pour réordonner ou changer de liste">⋮⋮</span>' +
    '<button type="button" class="circ" data-action="toggle" data-id="' + t.id + '" aria-label="Marquer comme faite"></button>' +
    '<div class="ttl">' + esc(t.title) + (t.desc ? '<div class="tdesc">' + linkify(t.desc) + '</div>' : '') + '</div>' +
    '<div style="position:relative;flex:none">' +
      '<button type="button" class="whobtn" style="' + whoStyle(t.who || '') + '" data-action="menu" data-id="' + t.id + '">' + whoLabel(t.who) + ' ▾</button>' +
      (state.menuFor === t.id ? menuHtml(t) : '') +
    '</div>' +
    '<button type="button" class="editbtn" data-action="edit" data-id="' + t.id + '" aria-label="Modifier">✎</button>' +
    '<button type="button" class="del" data-action="remove" data-id="' + t.id + '" aria-label="Supprimer">✕</button>' +
  '</div>';
}

function render(){
  /* un render pendant un drag détache la ligne source : son dragend ne remonte plus
     jusqu'au conteneur — on remet l'état de drag à zéro ici pour éviter un drag zombie */
  if (dragId !== null) resetDrag();
  var open = visibleOpen();
  var later = visibleLater();
  var done = doneTasks().filter(matchesFilter);
  var allDone = doneTasks().length;
  var dayTotal = allDone + openTasks().length; /* la barre mesure la journée — « plus tard » exclu */

  document.getElementById('progressTxt').textContent = allDone + ' / ' + dayTotal + ' faites' + (laterTasks().length ? ' · ' + laterTasks().length + ' pour plus tard' : '');
  document.getElementById('progressBar').style.width = (dayTotal ? Math.round(allDone / dayTotal * 100) : 0) + '%';

  document.getElementById('filterChips').innerHTML = FILTERS.map(function(v){
    return '<button type="button" class="wchip' + (state.filterWho === v ? ' on' : '') + '" data-action="filter" data-who="' + esc(v) + '">' + (v === 'all' ? 'Tous' : whoLabel(v)) + '</button>';
  }).join('');

  var listEl = document.getElementById('openList');
  if (open.length === 0) {
    listEl.innerHTML = '<div class="empty">' + (openTasks().length === 0 ? 'Tout est fait.' : 'Aucune tâche pour ce filtre.') + '</div>';
  } else {
    listEl.innerHTML = open.map(rowHtml).join('');
  }

  var laterEl = document.getElementById('laterList');
  if (later.length === 0) {
    laterEl.innerHTML = '<div class="empty">' + (laterTasks().length === 0 ? 'Glisse ici une tâche à garder pour plus tard.' : 'Aucune tâche pour ce filtre.') + '</div>';
  } else {
    laterEl.innerHTML = later.map(rowHtml).join('');
  }

  var doneWrap = document.getElementById('doneWrap');
  if (done.length === 0) {
    doneWrap.innerHTML = '';
  } else {
    var rows = done.map(function(t){
      return '<div class="drow">' +
        '<button type="button" class="dcheck" data-action="toggle" data-id="' + t.id + '" aria-label="Remettre à faire">✓</button>' +
        '<span class="dttl">' + esc(t.title) + '</span>' +
        '<button type="button" class="del" data-action="remove" data-id="' + t.id + '" aria-label="Supprimer">✕</button>' +
      '</div>';
    }).join('');
    doneWrap.innerHTML =
      '<button type="button" class="done-toggle" data-action="toggledone">Terminées (' + done.length + ') <span style="font-size:12px">' + (state.doneOpen ? '▾' : '▸') + '</span></button>' +
      (state.doneOpen ? '<div class="vl-card" style="overflow:hidden">' + rows + '</div>' : '');
  }

  document.getElementById('overlay').hidden = state.menuFor === null;
}

/* ---- drag & drop (réordonner ET basculer À faire ⇄ Plus tard) ---- */
function clearLines(){
  var lines = document.querySelectorAll('.ins-line');
  for (var i = 0; i < lines.length; i++) lines[i].hidden = true;
  document.getElementById('openList').classList.remove('dropzone');
  document.getElementById('laterList').classList.remove('dropzone');
}
function showLine(listEl, idx){
  clearLines();
  var rows = listEl.querySelectorAll('.trow');
  if (!rows.length) { listEl.classList.add('dropzone'); return; }
  if (idx < rows.length) rows[idx].querySelector('.ins-line.top').hidden = false;
  else rows[rows.length - 1].querySelector('.ins-line.bottom').hidden = false;
}
function resetDrag(){ dragId = null; overIdx = null; overBucket = null; clearLines();
  var d = document.querySelector('.trow.dragging'); if (d) d.classList.remove('dragging'); }
/* écouteurs posés UNE FOIS par conteneur (délégation) : les lignes sont recréées à chaque render */
function setupDrag(listEl, bucket){
  listEl.addEventListener('dragstart', function(e){
    if (e.target.closest && e.target.closest('a')) return; /* glisser un lien de description = drag natif du lien, pas de la tâche */
    var row = e.target.closest('.trow');
    if (!row) return;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', row.getAttribute('data-id')); } catch(err) {}
    dragId = Number(row.getAttribute('data-id'));
    if (state.menuFor !== null) { state.menuFor = null; document.getElementById('overlay').hidden = true; var m = document.querySelector('.whomenu'); if (m) m.remove(); }
    setTimeout(function(){ row.classList.add('dragging'); }, 0);
  });
  listEl.addEventListener('dragover', function(e){
    if (dragId === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var row = e.target.closest('.trow');
    var target;
    if (row) {
      var idx = Number(row.getAttribute('data-idx'));
      var r = row.getBoundingClientRect();
      target = e.clientY < r.top + r.height / 2 ? idx : idx + 1;
    } else {
      target = listTasks(bucket).length; /* zone vide ou bord du conteneur → fin de liste */
    }
    if (overBucket !== bucket || overIdx !== target) { overBucket = bucket; overIdx = target; showLine(listEl, target); }
  });
  listEl.addEventListener('drop', function(e){ e.preventDefault(); doDrop(); });
  listEl.addEventListener('dragend', resetDrag);
}
function doDrop(){
  if (dragId === null || overIdx === null || overBucket === null) { resetDrag(); return; }
  var vis = listTasks(overBucket);
  var refId = overIdx < vis.length ? vis[overIdx].id : null;
  var toLater = overBucket === 'later';
  var current = state.tasks.find(function(x){ return x.id === dragId; });
  if (refId === dragId && current && !!current.later === toLater) { resetDrag(); render(); return; }
  var dragged = null;
  var arr = state.tasks.filter(function(x){
    if (x.id === dragId) { dragged = x; return false; }
    return true;
  });
  if (!dragged) { resetDrag(); return; }
  dragged = Object.assign({}, dragged, { later: toLater }); /* le drop dans une liste fixe la catégorie */
  var inBucket = function(x){ return !x.done && !!x.later === toLater; };
  var insertAt;
  if (refId !== null) {
    insertAt = arr.findIndex(function(x){ return x.id === refId; });
    if (insertAt < 0) insertAt = arr.length;
  } else {
    var lastVis = -1;
    for (var i = 0; i < arr.length; i++) { if (inBucket(arr[i]) && matchesFilter(arr[i])) lastVis = i; }
    if (lastVis >= 0) {
      insertAt = lastVis + 1;
    } else {
      var lastB = -1;
      for (var j = 0; j < arr.length; j++) { if (inBucket(arr[j])) lastB = j; }
      insertAt = lastB >= 0 ? lastB + 1 : arr.length;
    }
  }
  arr.splice(insertAt, 0, dragged);
  state.tasks = arr;
  resetDrag();
  save();
  render();
}

/* ---- clicks (délégation) ---- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  if (SYNC.ro && action !== 'filter' && action !== 'toggledone') return; /* lecture seule */
  var id = Number(el.getAttribute('data-id'));
  if (action === 'filter') {
    var f = el.getAttribute('data-who');
    state.filterWho = f === null ? 'all' : f;
    render();
  } else if (action === 'toggle') {
    state.tasks = state.tasks.map(function(x){ return x.id === id ? Object.assign({}, x, { done: !x.done }) : x; });
    state.menuFor = null;
    save(); render();
  } else if (action === 'remove') {
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    state.menuFor = null;
    save(); render();
  } else if (action === 'menu') {
    state.menuFor = state.menuFor === id ? null : id;
    render();
  } else if (action === 'assign') {
    var w = el.getAttribute('data-who') || '';
    state.tasks = state.tasks.map(function(x){ return x.id === id ? Object.assign({}, x, { who: w }) : x; });
    state.menuFor = null;
    save(); render();
  } else if (action === 'edit') {
    openEdit(id);
  } else if (action === 'toggledone') {
    state.doneOpen = !state.doneOpen; /* préférence d'affichage locale, pas de push */
    render();
  }
});

document.getElementById('overlay').addEventListener('click', function(){
  state.menuFor = null;
  render();
});

/* ---- modal d'édition (titre + description — la description ne s'ajoute qu'ici) ---- */
var editOverlay = document.getElementById('editOverlay');
var editTitle = document.getElementById('editTitle');
var editDesc = document.getElementById('editDesc');
var pendingRemote = null; /* remote reçu pendant l'édition : appliqué à la fermeture, jamais perdu */
function applyRemote(remote){
  state.tasks = normTasks(remote);
  state.menuFor = null;
  render();
}
function openEdit(id){
  var t = state.tasks.find(function(x){ return x.id === id; });
  if (!t) return;
  state.editFor = id;
  editTitle.value = t.title;
  editDesc.value = t.desc || '';
  editOverlay.classList.add('open');
  editTitle.focus();
}
function closeEdit(){
  state.editFor = null;
  editOverlay.classList.remove('open');
  if (pendingRemote) { var r = pendingRemote; pendingRemote = null; applyRemote(r); }
}
document.getElementById('editClose').addEventListener('click', closeEdit);
document.getElementById('editCancel').addEventListener('click', closeEdit);
editOverlay.addEventListener('click', function(e){ if (e.target === editOverlay) closeEdit(); });
document.getElementById('editForm').addEventListener('submit', function(e){
  e.preventDefault();
  if (SYNC.ro || state.editFor === null) return;
  var title = editTitle.value.trim();
  if (!title) { editTitle.focus(); return; }
  var desc = editDesc.value.trim();
  var id = state.editFor;
  /* un autre appareil a poussé pendant l'édition : on rebase sur son état avant d'appliquer l'édition */
  if (pendingRemote) { state.tasks = normTasks(pendingRemote); pendingRemote = null; }
  state.tasks = state.tasks.map(function(x){ return x.id === id ? Object.assign({}, x, { title: title, desc: desc }) : x; });
  closeEdit();
  save(); render();
});

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  if (SYNC.ro) return;
  var input = document.getElementById('newTitle');
  var title = input.value.trim();
  if (!title) return;
  var who = (state.filterWho === 'Matis' || state.filterWho === 'Clément') ? state.filterWho : '';
  state.tasks = [{ id: newId(), title: title, done: false, who: who, later: false, desc: '' }].concat(state.tasks);
  input.value = '';
  save(); render();
  input.focus();
});

function boot(payload){
  SYNC.init(payload, 'todo : maj depuis le dashboard', serialize, function(remote){
    if (state.editFor !== null) { pendingRemote = remote; return; } /* édition en cours : mis en attente, appliqué à la fermeture */
    pendingRemote = null;
    applyRemote(remote);
  });
  state.tasks = normTasks(payload.seed);
  if (SYNC.ro) {
    var inp = document.getElementById('newTitle');
    inp.disabled = true;
    inp.placeholder = 'Lecture seule — synchronisation désactivée';
    document.getElementById('addBtn').disabled = true;
  } else {
    setupDrag(document.getElementById('openList'), 'open');
    setupDrag(document.getElementById('laterList'), 'later');
  }
  render();
  SYNC.refresh(); /* seed affiché, puis état le plus récent multi-appareils */
}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../login.html');return;}
boot(p);})();
</script>
