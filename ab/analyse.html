const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

function renderBoot(AB_DATA, isLive) {

var GRN = 'var(--grn)', GRNBG = 'var(--grn-bg)', AMB = 'var(--amb)', AMBBG = 'var(--amb-bg)', MUT = 'var(--faint)', GOLD = 'var(--gold)';

};

var fmtE = function(n){ return Math.round(n).toLocaleString('fr-FR') + ' €'; };

};

var selFromHash = function(){
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  for (var i = 0; i < T.length; i++){ if (T[i].id === h) return h; }
  return T[0].id;
};

function tooEarly(t){
  if (t.status === 'plan' || t.winner) return false;
  var oa = (t.a && t.a.orders) || 0, ob = (t.b && t.b.orders) || 0;

}

var state = { sel: selFromHash(), hovDay: null, formulaOpen: false };

function dOf(a, b){
  if (!isFinite(a) || !isFinite(b) || b === 0) return { txt: '', bg: '' };
  var d = (a / b - 1) * 100;
  var abs = Math.abs(d);
  var txt = (d >= 0 ? '+' : '−') + (abs < 10 ? abs.toFixed(1).replace('.', ',') : Math.round(abs)) + ' %';
  return { txt: txt, bg: d >= 0 ? GRN : 'var(--red)' };
}

/* --- Probabilité bayésienne (formule exacte d'Evan Miller, prior uniforme Beta(1,1)) --- */
function lgamma(x){
  var c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  var y=x, t=x+5.5; t-=(x+0.5)*Math.log(t);
  var s=1.000000000190015;
  for(var j=0;j<6;j++){ y+=1; s+=c[j]/y; }
  return -t+Math.log(2.5066282746310005*s/x);
}
function lbeta(a,b){ return lgamma(a)+lgamma(b)-lgamma(a+b); }
// P(taux de conversion B > taux de conversion A)
// posteriors : A ~ Beta(1+convA, 1+nA-convA), B ~ Beta(1+convB, 1+nB-convB)
/* Probabilité que la MARGE PAR VISITEUR de B dépasse celle de A. Chaque visiteur rapporte 0 € (pas d'achat) ou la marge
   de sa commande : moyenne = marge / visiteurs, variance = (somme des carrés / visiteurs) − moyenne². Les moyennes sur des
   centaines de visiteurs suivent une loi normale (théorème central limite) : P = Φ((mB − mA) / √(varA/nA + varB/nB)). */
function phi(z){ var t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function margeStats(M, S, n){ var m = M / n, v = Math.max(S / n - m * m, 0); return { m: m, se2: v / n }; }
function probMarge(MA, SA, nA, MB, SB, nB){
  var a = margeStats(MA, SA, nA), b = margeStats(MB, SB, nB), se = Math.sqrt(a.se2 + b.se2);
  if (!se) return a.m === b.m ? 0.5 : (b.m > a.m ? 1 : 0);
  return phi((b.m - a.m) / se);
}
function probBbeatsA(convA, nA, convB, nB){
  var aA=1+convA, bA=1+nA-convA, aB=1+convB, bB=1+nB-convB;
  var total=0;
  for(var i=0;i<aB;i++){
    total+=Math.exp(lbeta(aA+i,bA+bB)-Math.log(bB+i)-lbeta(1+i,bB)-lbeta(aA,bA));
  }
  return total;
}

function bayesCard(t){
  // sur la marge par visiteur dès qu'elle est calculée (elle compte à la fois les commandes et ce qu'elles rapportent)
  var useMp = t.a.marge != null && t.b.marge != null && t.a.margeSq != null && t.b.margeSq != null;
  var open = '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 24px;margin-bottom:16px">' +
    '<div style="margin-bottom:16px">' +
      '<div style="font-size:14px;font-weight:700;color:var(--ink)">Quelle variante est la bonne ?</div>' +
      '<div style="font-size:12px;color:var(--faint);margin-top:2px">' + (useMp ? 'probabilité que la marge par visiteur soit la plus haute' : 'probabilité bayésienne, calculée sur le taux de conversion') + '</div>' +
    '</div>';

  var nA = t.a.sessions, nB = t.b.sessions;
  if (!nA || !nB){
    return open + '<div style="font-size:13.5px;color:var(--mut)">Pas encore de données — la probabilité apparaîtra dès les premières sessions.</div></div>';
  }

  var pConv = probBbeatsA(t.a.orders, nA, t.b.orders, nB);
  var pB = useMp ? probMarge(t.a.marge, t.a.margeSq, nA, t.b.marge, t.b.margeSq, nB) : pConv;
  var pA = 1 - pB;
  var leader = pA >= pB ? 'A' : 'B';
  var pLead = Math.max(pA, pB);

  var dot = function(k){
    var c = k === 'A' ? GOLD : GRN;
    return '<span style="flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:' + c + ';color:var(--cream)">' + k + '</span>';
  };

  var html = open +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap">' +
      '<span style="display:flex;align-items:center;gap:10px">' + dot('A') +
        '<span style="font-family:\'Lora\',serif;font-weight:600;font-size:34px;color:' + GOLD + ';font-variant-numeric:tabular-nums">' + fmtPct(pA) + '</span></span>' +
      '<span style="display:flex;align-items:center;gap:10px">' +
        '<span style="font-family:\'Lora\',serif;font-weight:600;font-size:34px;color:' + GRN + ';font-variant-numeric:tabular-nums">' + fmtPct(pB) + '</span>' + dot('B') + '</span>' +
    '</div>';

  // barre pA / pB + marqueurs 95 % (côté variante en tête) et 50 %
  var thrX = leader === 'A' ? 95 : 5;
  var thrShift = thrX >= 50 ? '-100%' : '0';
  html += '<div style="position:relative">' +
      '<div style="display:flex;height:16px;border-radius:999px;overflow:hidden">' +
        '<div style="width:' + (pA * 100).toFixed(2) + '%;background:' + GOLD + ';transition:width .4s"></div>' +
        '<div style="flex:1;background:' + GRN + '"></div>' +
      '</div>' +
      '<div style="position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:rgba(20,53,45,.25)"></div>' +
      '<div style="position:absolute;top:-5px;bottom:-5px;left:' + thrX + '%;width:2px;background:var(--ink);border-radius:999px"></div>' +
    '</div>' +
    '<div style="position:relative;height:16px;margin-top:5px">' +
      '<span style="position:absolute;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint)">50 %</span>' +
      '<span style="position:absolute;left:' + thrX + '%;transform:translateX(' + thrShift + ');font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap">seuil 95 %</span>' +
    '</div>';

  // phrase d'état — le seuil 95 % ne vaut qu'avec du volume : à moins de 10 conversions le
  // pourcentage bouge de dizaines de points par commande, et on ne tranche jamais avant ~100
  var convTot = t.a.orders + t.b.orders;
  var msg, msgStyle;
  if (convTot < 10){
    msg = 'Trop tôt (' + convTot + ' conversion' + (convTot > 1 ? 's' : '') + ') : à ce volume le pourcentage est du bruit — chaque commande le fait bouger de dizaines de points. Aucune lecture possible.';
    msgStyle = 'color:var(--mut);font-weight:600';
  } else if (pLead >= 0.95 && convTot < 100){
    msg = 'La variante ' + leader + ' est à ' + fmtPct(pLead) + ', mais ' + convTot + ' conversions ne suffisent pas — le seuil 95 % ne se lit qu\'à partir de ~100 conversions. On laisse tourner.';
    msgStyle = 'color:' + AMB + ';font-weight:700';
  } else if (pLead >= 0.95){
    msg = 'Fiable : la variante ' + leader + ' a ' + fmtPct(pLead) + ' de chances d’être la meilleure — on peut trancher (en croisant avec la marge par visiteur).';
    msgStyle = 'color:var(--grn);font-weight:700';
  } else if (pLead >= 0.90){
    msg = 'Tendance forte pour ' + leader + ' (' + fmtPct(pLead) + ') — encore un peu de volume pour verrouiller.';
    msgStyle = 'color:' + AMB + ';font-weight:700';
  } else if (pLead >= 0.70){
    msg = 'La variante ' + leader + ' mène (' + fmtPct(pLead) + ') mais rien de fiable — on laisse tourner.';
    msgStyle = 'color:var(--ink);font-weight:600';
  } else {
    msg = 'Trop tôt : les deux variantes sont encore indiscernables (' + fmtPct(pA) + ' / ' + fmtPct(pB) + ').';
    msgStyle = 'color:var(--mut);font-weight:600';
  }
  html += '<div style="margin-top:12px;font-size:14px;' + msgStyle + '">' + msg + '</div>' +
    (useMp
      ? '<div style="margin-top:5px;font-size:12px;color:var(--faint)">Calculé sur la marge par visiteur (CA − frais − COGS) : il compte à la fois le nombre de commandes et ce que chacune rapporte. Sur la conversion seule, B aurait ' + fmtPct(pConv) + ' de chances d’être meilleure.</div>'
      : '<div style="margin-top:5px;font-size:12px;color:var(--faint)">Ce calcul porte sur le taux de conversion — la décision finale croise ce signal avec la marge par visiteur.</div>');

  // évolution jour par jour (cumuls)
  var ds = t.days || [];
  if (ds.length >= 2){
    var cum = [], cA = 0, cB = 0, eA = 0, eB = 0, mA = 0, mB = 0, sA = 0, sB = 0;
    for (var q = 0; q < ds.length; q++){
      cA += ds[q].ordA || 0; cB += ds[q].ordB || 0;
      eA += ds[q].expoA || 0; eB += ds[q].expoB || 0;
      mA += ds[q].mA || 0; mB += ds[q].mB || 0; sA += ds[q].sqA || 0; sB += ds[q].sqB || 0;
      cum.push({ label: ds[q].label, date: ds[q].date, p: (eA && eB) ? (useMp ? probMarge(mA, sA, eA, mB, sB, eB) : probBbeatsA(cA, eA, cB, eB)) * 100 : 50 });
    }
    var W = 640, H = 210, pl = 46, pr = 14, pt = 14, pb = 26;
    var X = function(i){ return pl + i * (W - pl - pr) / (cum.length - 1); };
    var Y = function(v){ return pt + (100 - v) * (H - pt - pb) / 100; };
    var yLab = function(v, col, bold){
      return '<text x="' + (pl - 7) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" font-family="Figtree,sans-serif"' + (bold ? ' font-weight="700"' : '') + ' fill="' + col + '">' + v + ' %</text>';
    };
    var poly = cum.map(function(c, i){ return X(i).toFixed(1) + ',' + Y(c.p).toFixed(1); }).join(' ');
    var dots = cum.map(function(c, i){ return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(c.p).toFixed(1) + '" r="3.5" fill="' + GRN + '"/>'; }).join('');
    var skipX = cum.length > 12;
    var xLabs = cum.map(function(c, i){
      if (skipX && (i + 1) % 2 === 0) return '';
      return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" font-family="Figtree,sans-serif" fill="var(--faint)">' + c.label + '</text>';
    }).join('');
    /* données pour le tooltip au survol (mêmes repères que le tracé) */
    BAYES = { cum: cum, W: W, H: H, pl: pl, pr: pr, pt: pt, pb: pb };
    html += '<div style="margin-top:22px">' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--faint);margin-bottom:8px">ÉVOLUTION DE P(B MEILLEURE)</div>' +
      '<div id="bayesWrap" style="position:relative">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Évolution de la probabilité que B soit meilleure">' +
        '<line x1="' + pl + '" y1="' + Y(0) + '" x2="' + (W - pr) + '" y2="' + Y(0) + '" stroke="var(--grid2)" stroke-width="1"/>' +
        '<line x1="' + pl + '" y1="' + Y(50) + '" x2="' + (W - pr) + '" y2="' + Y(50) + '" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 4"/>' +
        '<line x1="' + pl + '" y1="' + Y(95) + '" x2="' + (W - pr) + '" y2="' + Y(95) + '" stroke="' + AMB + '" stroke-width="1" stroke-dasharray="4 4"/>' +
        yLab(0, '#c9c2b0') + yLab(50, 'var(--faint)') + yLab(95, AMB, true) + yLab(100, '#c9c2b0') +
        '<polyline points="' + poly + '" fill="none" stroke="' + GRN + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
        dots + xLabs +
        '<line id="bayesHov" x1="-100" y1="' + pt + '" x2="-100" y2="' + Y(0) + '" stroke="rgba(20,53,45,.3)" stroke-width="1"/>' +
        '<circle id="bayesDot" cx="-100" cy="-100" r="4.5" fill="' + GRN + '" stroke="var(--card)" stroke-width="2"/>' +
      '</svg>' +
      '<div id="bayesTip" class="vl-tip" style="left:0;top:4px;transform:translateX(-50%);display:none"></div>' +
      '</div></div>';
  } else {
    html += '<div style="margin-top:16px;font-size:12px;color:var(--faint)">L’évolution de la probabilité s’affichera à partir du 2ᵉ jour.</div>';
  }

  // formule avec valeurs injectées
  if (useMp){
    var sa = margeStats(t.a.marge, t.a.margeSq, nA), sb = margeStats(t.b.marge, t.b.margeSq, nB);
    var f2 = function(x){ return x.toFixed(3).replace('.', ','); };
    html += '<details' + (state.formulaOpen ? ' open' : '') + ' style="margin-top:18px">' +
      '<summary data-formula style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--mut);user-select:none">Voir la formule</summary>' +
      '<div style="margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.8;color:var(--ink);overflow-x:auto">' +
        'marge par visiteur : A = ' + f2(sa.m) + ' € (' + nA + ' visiteurs) · B = ' + f2(sb.m) + ' € (' + nB + ' visiteurs)<br>' +
        'erreur type : A ± ' + f2(Math.sqrt(sa.se2)) + ' € · B ± ' + f2(Math.sqrt(sb.se2)) + ' €<br>' +
        'P(B &gt; A) = Φ((mB − mA) / √(σA² + σB²)) = ' + fmtPct(pB) + '<br>' +
        '<span style="color:var(--mut)">Lecture : chaque visiteur rapporte 0 € (pas d’achat) ou la marge de sa commande. Avec quelques centaines de visiteurs, la moyenne suit une loi normale ; le pourcentage est la probabilité que la marge réelle par visiteur de B dépasse celle de A. Seuil de décision : 95 %.</span>' +
      '</div>' +
    '</details>';
    return html + '</div>';
  }
  var aA = 1 + t.a.orders, bA = 1 + nA - t.a.orders, aB = 1 + t.b.orders, bB = 1 + nB - t.b.orders;
  html += '<details' + (state.formulaOpen ? ' open' : '') + ' style="margin-top:18px">' +
    '<summary data-formula style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--mut);user-select:none">Voir la formule</summary>' +
    '<div style="margin-top:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.8;color:var(--ink);overflow-x:auto">' +
      'A ~ Beta(1 + ' + t.a.orders + ', 1 + (' + nA + ' − ' + t.a.orders + ')) = Beta(' + aA + ', ' + bA + ') · B ~ Beta(' + aB + ', ' + bB + ') — prior uniforme Beta(1,1)<br>' +
      'P(pB &gt; pA) = Σ_{i=0}^{αB−1} B(αA+i, βA+βB) / [ (βB+i) · B(1+i, βB) · B(αA, βA) ] = ' + fmtPct(pB) + '<br>' +
      '<span style="color:var(--mut)">Lecture : on modélise le taux de conversion de chaque variante par une loi Beta mise à jour par les données ; le pourcentage est la probabilité exacte que le taux réel de B dépasse celui de A. Seuil de décision : 95 %.</span>' +
    '</div>' +
  '</details>';

  return html + '</div>';
}

function render(){
  var t = null;
  for (var i = 0; i < T.length; i++){ if (T[i].id === state.sel) t = T[i]; }
  t = t || T[0];
  var st = stStyles[t.status];
  var hasData = t.status !== 'plan' && !!(t.a && t.b) && t.a.ca !== undefined;
  var early = tooEarly(t);

  var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px">' + T.map(function(x){
    return '<button class="chip sm' + (t.id === x.id ? ' on' : '') + '" data-test="' + x.id + '" style="padding:6px 14px">' + x.short + '</button>';
  }).join('') + '</div>';

  html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">' +
    '<span style="flex:none;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:' + st.stFg + ';background:' + st.stBg + ';border:' + st.stBd + ';padding:4px 11px;border-radius:999px">' + st.stTxt + '</span>' +
    '<span style="font-size:12.5px;color:var(--faint)">' + t.meta + '</span></div>' +
    '<h1 style="font-family:\'Lora\',serif;font-weight:600;font-size:30px;margin:0 0 6px;color:var(--ink)">' + t.title + '</h1>' +
    '<p style="margin:0 0 26px;font-size:14.5px;color:var(--mut);max-width:720px;text-wrap:pretty">' + t.hyp + '</p>';

  if (hasData){
    // métrique de décision : la MARGE PAR VISITEUR (CA − frais de paiement − COGS), sinon le CA réalisé
    var useM = t.a.marge != null && t.b.marge != null;
    var score = function(x){ return useM ? (x.sessions ? x.marge / x.sessions : 0) : x.ca; };
    var delta = '';
    if (!t.winner && !early && Math.min(score(t.a), score(t.b)) > 0){
      delta = Math.abs((Math.max(score(t.a), score(t.b)) / Math.min(score(t.a), score(t.b)) - 1) * 100).toFixed(1).replace('.', ',');
    }
    var leaderK = t.winner ? t.winner : (score(t.a) >= score(t.b) ? 'A' : 'B');

    var mkPanel = function(k, v, isLeader){
      var o = k === 'B' ? t.a : null;
      var dd = function(g){
        if (!o) return { txt: '', fg: 'transparent' };
        return dOf(g(v), g(o));
      };
      var dCa = dd(function(x){ return x.ca; });
      var dOrders = dd(function(x){ return x.orders; });
      var dSessions = dd(function(x){ return x.sessions; });
      var dCvr = dd(function(x){ return x.sessions ? x.orders / x.sessions : NaN; });
      var dAov = dd(function(x){ return x.orders ? x.ca / x.orders : NaN; });
      var dMpv = dd(function(x){ return x.sessions && x.marge != null ? x.marge / x.sessions : NaN; });
      var dMarge = dd(function(x){ return x.marge != null ? x.marge : NaN; });
      var mpv = v.sessions && v.marge != null ? (v.marge / v.sessions).toFixed(2).replace('.', ',') + ' €' : '—';
      var color = k === 'A' ? GOLD : GRN;
      var bd = (isLeader && !early) ? (k === 'A' ? 'var(--gold-bd)' : 'var(--grn-bd)') : 'var(--bd)';
      var chip = '';
      if (isLeader && t.winner){
        chip = '<span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--grn);background:var(--grn-bg);padding:4px 10px;border-radius:999px">Gagnante · déployée</span>';
      } else if (isLeader && early){
        chip = '<span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--mut);background:var(--track2);padding:4px 10px;border-radius:999px">trop tôt pour conclure</span>';
      } else if (isLeader && delta){
        chip = '<span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--grn);background:var(--grn-bg);padding:4px 10px;border-radius:999px">En tête · +' + delta + (useM ? ' % de marge par visiteur' : ' % de CA') + '</span>';
      }
      var cvr = v.sessions ? (v.orders / v.sessions * 100).toFixed(1).replace('.', ',') + ' %' : '—';
      var aov = v.orders ? fmtE(v.ca / v.orders) : '—';
      return '<div style="background:var(--card);border:2px solid ' + bd + ';border-radius:16px;padding:22px 24px">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">' +
          '<span style="flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:' + color + ';color:var(--cream)">' + k + '</span>' +
          '<span style="flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink)">' + v.name + '</span>' +
          chip +
        '</div>' +
        (useM
          ? '<div style="font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);margin-bottom:4px" title="CA encaissé (remises déduites) − frais de paiement réels − COGS (grille de l’agent), avant pub">MARGE PAR VISITEUR</div>' +
            '<div style="display:flex;align-items:center;gap:4px;margin-bottom:16px">' +
              '<span style="font-family:\'Lora\',serif;font-weight:600;font-size:36px;color:' + color + ';font-variant-numeric:tabular-nums">' + mpv + '</span>' +
              dBadge(dMpv, true) +
            '</div>'
          : '<div style="font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);margin-bottom:4px">CA RÉALISÉ</div>' +
            '<div style="display:flex;align-items:center;gap:4px;margin-bottom:16px">' +
              '<span style="font-family:\'Lora\',serif;font-weight:600;font-size:36px;color:' + color + ';font-variant-numeric:tabular-nums">' + fmtE(v.ca) + '</span>' +
              dBadge(dCa, true) +
            '</div>') +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px">' +
          (useM ? kpiCell('MARGE TOTALE', fmtE(Math.round(v.marge)), dMarge) + kpiCell('CA RÉALISÉ', fmtE(Math.round(v.ca)), dCa) : '') +
          kpiCell('COMMANDES', v.orders.toLocaleString('fr-FR'), dOrders) +
          kpiCell('SESSIONS', v.sessions.toLocaleString('fr-FR'), dSessions) +
          kpiCell('CONVERSION', cvr, dCvr) +
          kpiCell('PANIER MOYEN', aov, dAov) +
        '</div>' +
      '</div>';
    };

    html += '<div class="ab-panels" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">' +
      mkPanel('A', t.a, leaderK === 'A') + mkPanel('B', t.b, leaderK === 'B') + '</div>';

    html += bayesCard(t);

    if (t.verdict){
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--grn-bg);border:1px solid var(--bd-strong);border-radius:12px;padding:13px 18px;font-size:14px;font-weight:600;color:var(--grn)">' + t.verdict + '</div>';
    }

    var days = t.days || [];
    if (days.length){
      var dMax = 1;
      for (var j = 0; j < days.length; j++){ dMax = Math.max(dMax, days[j].ordA, days[j].ordB); }
      var colStyle = 'flex:1 1 0' + (days.length < 8 ? ';max-width:110px' : '');

      var cols = days.map(function(d, di){
        var hov = state.hovDay === di;
        var ha = Math.max(2, d.ordA / dMax * 142), hb = Math.max(2, d.ordB / dMax * 142);
        var tip = '';
        if (hov){
          tip = '<div style="position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:#14352d;color:#fdf9ef;border-radius:8px;padding:7px 11px;font-size:12.5px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(20,53,45,.3);z-index:10;font-variant-numeric:tabular-nums">' +
            '<div style="font-weight:700;margin-bottom:2px">' + d.label + ' · ' + fmtDate(d.date) + '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="width:8px;height:8px;border-radius:50%;background:#d9a851"></span>Variante A&nbsp;: ' + plural(d.ordA, 'commande') + '</div>' +
            '<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#5cb893"></span>Variante B&nbsp;: ' + plural(d.ordB, 'commande') + '</div>' +
          '</div>';
        }
        return '<div data-day="' + di + '" style="' + colStyle + ';position:relative;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:150px;border-radius:6px;background:' + (hov ? 'var(--bd-soft)' : 'transparent') + '">' +
          tip +
          '<div style="width:38%;max-width:20px;border-radius:3px 3px 0 0;height:' + ha + 'px;background:' + (hov ? 'var(--gold-dk)' : 'var(--gold)') + '"></div>' +
          '<div style="width:38%;max-width:20px;border-radius:3px 3px 0 0;height:' + hb + 'px;background:' + (hov ? 'var(--grn-dk)' : 'var(--grn)') + '"></div>' +
        '</div>';
      }).join('');

      var labels = days.map(function(d, di){
        return '<span style="' + colStyle + ';text-align:center;font-size:11.5px;color:var(--faint)">' + (days.length > 12 && (di + 1) % 2 === 0 ? '' : d.label) + '</span>';
      }).join('');

      html += '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 24px;margin-bottom:16px">' +
        '<div style="display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap">' +
          '<span style="font-size:14px;font-weight:700;color:var(--ink);margin-right:auto">Commandes par jour</span>' +
          '<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink)"><span style="flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold)"></span>' + t.a.name + '</span>' +
          '<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink)"><span style="flex:none;width:10px;height:10px;border-radius:50%;background:var(--grn)"></span>' + t.b.name + '</span>' +
        '</div>' +
        '<div style="display:flex;align-items:flex-end;justify-content:center;gap:8px;height:150px;border-bottom:1px solid var(--grid2)">' + cols + '</div>' +
        '<div style="display:flex;justify-content:center;gap:8px;margin-top:8px">' + labels + '</div>' +
      '</div>';
    }
  } else {
    html += '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--bd-strong);border-radius:16px;padding:64px 26px">' +
      '<span style="font-family:\'Lora\',serif;font-weight:600;font-size:19px;color:var(--ink)">Pas encore de données</span>' +
      '<span style="font-size:13.5px;color:var(--mut);text-align:center">Ce test n’a pas démarré — l’analyse apparaîtra ici dès les premières sessions.</span>' +
    '</div>';
  }

  app.innerHTML = html;
}

app.addEventListener('click', function(e){
  var f = e.target.closest('[data-formula]');
  if (f){ e.preventDefault(); state.formulaOpen = !state.formulaOpen; render(); return; }
  var b = e.target.closest('[data-test]');
  if (b){
    var id = b.dataset.test;
    location.hash = id;
    if (id !== state.sel){ state.sel = id; state.hovDay = null; render(); }
  }
});

app.addEventListener('mouseover', function(e){
  var c = e.target.closest('[data-day]');
  var i = c ? parseInt(c.dataset.day) : null;
  if (i !== state.hovDay){ state.hovDay = i; render(); }
});

app.addEventListener('mouseleave', function(){
  if (state.hovDay !== null){ state.hovDay = null; render(); }
  hideBayesTip();
});

/* --- tooltip du graphique d'évolution : suit la souris en X (jour le plus proche) ET en Y, comme la compta --- */
function hideBayesTip(){
  var tip = document.getElementById('bayesTip');
  var line = document.getElementById('bayesHov');
  var dot = document.getElementById('bayesDot');
  if (tip) tip.style.display = 'none';
  if (line){ line.setAttribute('x1', -100); line.setAttribute('x2', -100); }
  if (dot){ dot.setAttribute('cx', -100); dot.setAttribute('cy', -100); }
}
app.addEventListener('mousemove', function(e){
  var wrap = document.getElementById('bayesWrap');
  if (!wrap || !BAYES){ return; }
  if (!(e.target.closest && e.target.closest('#bayesWrap'))){ hideBayesTip(); return; }
  var tip = document.getElementById('bayesTip');
  var line = document.getElementById('bayesHov');
  var dot = document.getElementById('bayesDot');
  if (!tip || !line || !dot) return;
  var r = wrap.getBoundingClientRect();
  var n = BAYES.cum.length;
  var span = BAYES.W - BAYES.pl - BAYES.pr;
  var xv = (e.clientX - r.left) / r.width * BAYES.W;
  var idx = Math.max(0, Math.min(n - 1, Math.round((xv - BAYES.pl) / span * (n - 1))));
  var c = BAYES.cum[idx];
  var X = BAYES.pl + idx * span / (n - 1);
  var Yv = BAYES.pt + (100 - c.p) * (BAYES.H - BAYES.pt - BAYES.pb) / 100;
  line.setAttribute('x1', X); line.setAttribute('x2', X);
  dot.setAttribute('cx', X); dot.setAttribute('cy', Yv);
  tip.innerHTML = '<div style="font-weight:700;margin-bottom:2px">' + c.label + ' · ' + fmtDate(c.date) + '</div>' +
    '<div>P(B meilleure)&nbsp;: <span style="font-weight:700;color:#5cb893">' + c.p.toFixed(1).replace('.', ',') + ' %</span></div>';
  tip.style.display = 'block';
  tip.style.left = Math.min(86, Math.max(12, X / BAYES.W * 100)) + '%';
  var th = tip.offsetHeight || 54;
  var my = e.clientY - r.top;
  var top = my - th - 12; /* juste au-dessus du curseur — jamais sous la souris */
  if (top < 4) top = Math.min(r.height - th - 4, my + 18); /* pas la place en haut → il passe sous le curseur */
  tip.style.top = top + 'px';
});

window.addEventListener('hashchange', function(){
  var s = selFromHash();
  if (s !== state.sel){ state.sel = s; state.hovDay = null; render(); }
});

function setGen(data, live){
  var g = document.getElementById('genline');
  if (!g) return;
  var gd = new Date(data.generatedAt);
  g.textContent = live
    ? 'Live · ' + gd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : 'Snapshot du ' + gd.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' ' + gd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

window.__abUpdate = function(d, live){
  T = d.tests;
  var ok = false;
  for (var i = 0; i < T.length; i++){ if (T[i].id === state.sel) ok = true; }
  if (!ok){ state.sel = selFromHash(); }
  setGen(d, live);
  render();
};
setGen(AB_DATA, isLive);
render();
}

var VL_STATS_URL = 'https://vivelan-ab.vivelan.workers.dev/stats';
var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function frDateISO(iso) {
  var p = String(iso).split('-'); var y = +p[0], m = +p[1], d = +p[2];
  return (d === 1 ? '1er' : d) + ' ' + MOIS_FR[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : '');
}
function mapTests(rawTests) {
  // du plus récent au plus ancien (date de démarrage) ; à date égale, le dernier inscrit d'abord
  return rawTests.map(function (t, i) { return [t, i]; })
    .sort(function (x, y) { return (y[0].debut || '').localeCompare(x[0].debut || '') || y[1] - x[1]; })
    .map(function (x) { return x[0]; })
    .map(function (t) {
    var V = t.data.V;
    var status = t.statut === 'en_cours' ? 'run' : t.statut === 'termine' ? 'done' : 'plan';
    return {
      id: t.id,
      status: status,
      short: t.nom.length > 24 ? t.nom.slice(0, 22) + '…' : t.nom,
      title: t.nom,
      hyp: t.hypothese,
      page: t.page,
      meta: status === 'run'
        ? 'Démarré le ' + frDateISO(t.debut) + (t.debutTs ? ' à ' + new Date(t.debutTs).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' }).replace(':', ' h ') : '') + ' · J+' + t.data.joursEcoules
        : status === 'done' ? 'Du ' + frDateISO(t.debut) + ' au ' + frDateISO(t.fin) : 'Prévu — pas encore lancé',
      a: { name: t.variantes.A, ca: V.A.revenue, sessions: V.A.expo, orders: V.A.orders, marge: V.A.marge == null ? null : V.A.marge, margeSq: V.A.margeSq == null ? null : V.A.margeSq },
      b: { name: t.variantes.B, ca: V.B.revenue, sessions: V.B.expo, orders: V.B.orders, marge: V.B.marge == null ? null : V.B.marge, margeSq: V.B.margeSq == null ? null : V.B.margeSq },
      days: t.data.timeline.map(function (d, i) { return { label: 'J' + (i + 1), date: d.d, ordA: d.ordA, ordB: d.ordB, expoA: d.expoA, expoB: d.expoB, mA: d.mA || 0, mB: d.mB || 0, sqA: d.sqA || 0, sqB: d.sqB || 0 }; }),
      stats: t.data.stats,
      winner: null,
      verdict: t.verdict || null
    };
  });
}
function boot(payload) {
  renderBoot({ generatedAt: payload.generatedAt, tests: mapTests(payload.tests) }, false);
  if (!payload.statsKey) return;
  // registre = les entrées du snapshot sans leurs données. Seuls les tests EN COURS sont recalculés
  // en live : les tests terminés ou prévus ne bougent plus, on garde le snapshot du build
  // (recalculer badge/assurance relisait des milliers de commandes Shopify : 20-30 s par ouverture).
  var reg = payload.tests.filter(function (t) { return t.statut === 'en_cours'; }).map(function (t) {
    var c = {}; for (var k in t) { if (k !== 'data' && k !== 'expoLabel') c[k] = t[k]; } return c;
  });
  if (!reg.length) return;
  fetch(VL_STATS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + payload.statsKey },
    body: JSON.stringify({ tests: reg })
  })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (live) {
      var byId = {}; live.tests.forEach(function (t) { byId[t.id] = t; });
      var merged = payload.tests.map(function (t) { return byId[t.id] || t; });
      renderBoot({ generatedAt: live.generatedAt, tests: mapTests(merged) }, true);
    })
    .catch(function (e) {
      var g = document.getElementById('genline');
      if (g) g.textContent += ' · live indisponible (' + (e && e.message ? e.message : e) + ')';
    });
}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../login.html');return;}
boot(p);})();
