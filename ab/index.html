<style>
#filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
#filters .chip{padding:6px 14px}
#list{display:flex;flex-direction:column;gap:16px}
.test-card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 24px;transition:box-shadow .18s,transform .18s,border-color .18s}
.test-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,53,45,.10);border-color:var(--bd-hov)}
.tc-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tc-st{flex:none;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.tc-meta{font-size:12.5px;color:var(--faint)}
.tc-early{flex:none;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--mut);background:var(--track2);padding:4px 10px;border-radius:999px}
.tc-arrow{margin-left:auto;color:var(--grn);font-size:16px}
.tc-title{font-family:'Lora',serif;font-weight:600;font-size:20px;color:var(--ink);margin-bottom:4px}
.tc-hyp{font-size:13.5px;color:var(--mut);margin-bottom:16px;text-wrap:pretty}
.tc-variants{display:flex;flex-direction:column;gap:8px}
.v-row{display:flex;align-items:center;gap:14px;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;background:var(--card)}
.v-badge{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.v-name{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink)}
.v-tag{font-weight:500;color:var(--faint)}
.v-data{flex:none;display:flex;align-items:center;gap:12px}
.v-track{width:150px;height:8px;border-radius:999px;background:var(--track2);overflow:hidden}
.v-bar{height:100%;border-radius:999px}
.v-ca{width:76px;text-align:right;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.v-n{width:92px;text-align:right;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tc-verdict{margin-top:14px}
#empty{text-align:center;padding:48px 0;font-size:14px;color:var(--faint)}
/* mobile : les chiffres d'une variante passent sous son nom — aucune règle desktop modifiée */
@media (max-width:720px){
.test-card{padding:18px 16px}
.tc-head{flex-wrap:wrap}
.v-row{flex-wrap:wrap;gap:10px;padding:11px 13px}
.v-data{flex:1 1 100%;justify-content:flex-end}
.v-track{flex:1 1 auto}
.v-ca,.v-n{width:auto;white-space:nowrap}
}
</style>
</head>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

function renderBoot(AB_DATA, isLive) {
  if (window.__abUpdate) return window.__abUpdate(AB_DATA, isLive);
  var GRN = 'var(--grn)', GRNBG = 'var(--grn-bg)', AMB = 'var(--amb)', AMBBG = 'var(--amb-bg)', MUT = 'var(--faint)';

  var state = { filter: 'Tous' };

  var tests = AB_DATA.tests;

  function setGen(data, live) {
    var gd = new Date(data.generatedAt);
    document.getElementById('genline').textContent = live
      ? 'Données live · rafraîchies à ' + gd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + ' — recharger la page pour actualiser'
      : 'Données réelles · générées le ' +
        gd.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + ' à ' +
        gd.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  var stStyles = {
    run:  { txt: 'En cours', style: 'color:' + GRN + ';background:' + GRNBG + ';border:1px solid transparent' },
    done: { txt: 'Terminé',  style: 'color:' + AMB + ';background:' + AMBBG + ';border:1px solid transparent' },
    plan: { txt: 'Prévu',    style: 'color:' + MUT + ';background:transparent;border:1px dashed var(--bd-x)' }
  };

  function fmtE(n) { return n.toLocaleString('fr-FR') + ' €'; }

  function tooEarly(t) {
    if (t.status === 'plan' || t.winner) return false;
    var oa = (t.a && t.a.orders) || 0, ob = (t.b && t.b.orders) || 0;
    return oa + ob < 10;
  }

  function variantHTML(k, v, other, t) {
    var hasData = v && v.ca !== undefined;
    // métrique principale : la marge (profit avant pub) quand elle est calculée, sinon le CA
    var useM = hasData && v.marge != null && other && other.marge != null;
    var val = function (x) { return useM ? x.marge : x.ca; };
    var leads = hasData && other && other.ca !== undefined && !tooEarly(t) && val(v) / Math.max(v.sessions, 1) > val(other) / Math.max(other.sessions, 1);
    var isWinner = t.winner === k;
    var maxCa = hasData ? Math.max(val(v), (other && val(other)) || 0, 1) : 1;
    var barPct = hasData ? Math.max(0, Math.round(val(v) / maxCa * 100)) : 0;
    var barColor = leads ? GRN : 'var(--barmut)';
    var caColor = leads ? GRN : 'var(--mut)';
    var badgeBg = (leads || isWinner) ? GRN : 'var(--track2)';
    var badgeFg = (leads || isWinner) ? 'var(--cream)' : 'var(--mut)';
    var rowStyle = isWinner
      ? 'background:' + GRNBG + ';border-color:var(--bd-x)'
      : '';
    var tag = isWinner ? '· déployée' : '';

    var html = '<div class="v-row"' + (rowStyle ? ' style="' + rowStyle + '"' : '') + '>';
    html += '<span class="v-badge" style="background:' + badgeBg + ';color:' + badgeFg + '">' + k + '</span>';
    html += '<span class="v-name">' + v.name + '<span class="v-tag"> ' + tag + '</span></span>';
    if (hasData) {
      html += '<div class="v-data">';
      html += '<div class="v-track"><div class="v-bar" style="background:' + barColor + ';width:' + barPct + '%"></div></div>';
      html += '<span class="v-ca" style="color:' + caColor + '">' + fmtE(Math.round(val(v))) + (useM ? ' <small style="font-weight:600;font-size:11px">de marge</small>' : '') + '</span>';
      html += '<span class="v-n">' + (v.sessions || 0).toLocaleString('fr-FR') + ' sessions</span>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function cardHTML(t) {
    var st = stStyles[t.status];
    var html = '<a class="test-card" href="analyse.html#' + t.id + '">';
    html += '<div class="tc-head">';
    html += '<span class="tc-st" style="' + st.style + '">' + st.txt + '</span>';
    html += '<span class="tc-meta">' + t.meta + '</span>';
    if (tooEarly(t)) html += '<span class="tc-early">trop tôt pour conclure</span>';
    html += '<span class="tc-arrow">→</span>';
    html += '</div>';
    html += '<div class="tc-title">' + t.title + '</div>';
    html += '<div class="tc-hyp">' + t.hyp + '</div>';
    html += '<div class="tc-variants">' + variantHTML('A', t.a, t.b, t) + variantHTML('B', t.b, t.a, t) + '</div>';
    if (t.verdict) {
      html += '<div class="vl-verdict tc-verdict">' + t.verdict + '</div>';
    }
    html += '</a>';
    return html;
  }

  var statusOf = { 'En cours': 'run', 'Terminés': 'done', 'Prévus': 'plan' };
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var filtersEl = document.getElementById('filters');

  function render() {
    var chips = filtersEl.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('on', chips[i].getAttribute('data-filter') === state.filter);
    }
    var visible = tests.filter(function (t) {
      return state.filter === 'Tous' || t.status === statusOf[state.filter];
    });
    listEl.innerHTML = visible.map(cardHTML).join('');
    if (visible.length === 0) {
      emptyEl.removeAttribute('hidden');
    } else {
      emptyEl.setAttribute('hidden', '');
    }
  }

  filtersEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter');
    render();
  });

  window.__abUpdate = function (d, live) { tests = d.tests; setGen(d, live); render(); };
  setGen(AB_DATA, isLive);
  render();
}

var VL_STATS_URL = 'https://vivelan-ab.vivelan.workers.dev/stats';
var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function frDateISO(iso) {
  var p = String(iso).split('-'); var y = +p[0], m = +p[1], d = +p[2];
  return (d === 1 ? '1er' : d) + ' ' + MOIS_FR[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : '');
}
function mapTests(rawTests) {
  // du plus récent au plus ancien (date de démarrage) ; à date égale, le dernier inscrit d'abord
  return rawTests.map(function (t, i) { return [t, i]; })
    .sort(function (x, y) { return (y[0].debut || '').localeCompare(x[0].debut || '') || y[1] - x[1]; })
    .map(function (x) { return x[0]; })
    .map(function (t) {
    var V = t.data.V;
    var status = t.statut === 'en_cours' ? 'run' : t.statut === 'termine' ? 'done' : 'plan';
    return {
      id: t.id,
      status: status,
      short: t.nom.length > 24 ? t.nom.slice(0, 22) + '…' : t.nom,
      title: t.nom,
      hyp: t.hypothese,
      page: t.page,
      meta: status === 'run'
        ? 'Démarré le ' + frDateISO(t.debut) + (t.debutTs ? ' à ' + new Date(t.debutTs).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' }).replace(':', ' h ') : '') + ' · J+' + t.data.joursEcoules
        : status === 'done' ? 'Du ' + frDateISO(t.debut) + ' au ' + frDateISO(t.fin) : 'Prévu — pas encore lancé',
      a: { name: t.variantes.A, ca: V.A.revenue, sessions: V.A.expo, orders: V.A.orders, marge: V.A.marge == null ? null : V.A.marge, margeSq: V.A.margeSq == null ? null : V.A.margeSq },
      b: { name: t.variantes.B, ca: V.B.revenue, sessions: V.B.expo, orders: V.B.orders, marge: V.B.marge == null ? null : V.B.marge, margeSq: V.B.margeSq == null ? null : V.B.margeSq },
      days: t.data.timeline.map(function (d, i) { return { label: 'J' + (i + 1), date: d.d, ordA: d.ordA, ordB: d.ordB, expoA: d.expoA, expoB: d.expoB, mA: d.mA || 0, mB: d.mB || 0, sqA: d.sqA || 0, sqB: d.sqB || 0 }; }),
      stats: t.data.stats,
      winner: null,
      verdict: t.verdict || null
    };
  });
}
function boot(payload) {
  renderBoot({ generatedAt: payload.generatedAt, tests: mapTests(payload.tests) }, false);
  if (!payload.statsKey) return;
  // registre = les entrées du snapshot sans leurs données. Seuls les tests EN COURS sont recalculés
  // en live : les tests terminés ou prévus ne bougent plus, on garde le snapshot du build
  // (recalculer badge/assurance relisait des milliers de commandes Shopify : 20-30 s par ouverture).
  var reg = payload.tests.filter(function (t) { return t.statut === 'en_cours'; }).map(function (t) {
    var c = {}; for (var k in t) { if (k !== 'data' && k !== 'expoLabel') c[k] = t[k]; } return c;
  });
  if (!reg.length) return;
  fetch(VL_STATS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + payload.statsKey },
    body: JSON.stringify({ tests: reg })
  })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (live) {
      var byId = {}; live.tests.forEach(function (t) { byId[t.id] = t; });
      var merged = payload.tests.map(function (t) { return byId[t.id] || t; });
      renderBoot({ generatedAt: live.generatedAt, tests: mapTests(merged) }, true);
    })
    .catch(function (e) {
      var g = document.getElementById('genline');
      if (g) g.textContent += ' · live indisponible (' + (e && e.message ? e.message : e) + ')';
    });
}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../login.html');return;}
boot(p);})();
