<style>
.lk-search{width:100%;box-sizing:border-box;padding:13px 16px;font-size:14.5px;font-family:'Figtree',sans-serif;border:1px solid var(--bd-strong);border-radius:12px;background:var(--card);color:var(--tx);outline:none;margin-bottom:22px}
.lk-search:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
.lk-row{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--bd-soft)}
.lk-row:hover{background:var(--bg)}
.lk-badge{flex:none;width:74px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 0;border-radius:6px}
.lk-badge.grn{color:var(--grn);background:var(--grn-bg)}
.lk-badge.amb{color:var(--amb);background:var(--amb-bg)}
.lk-copy{flex:none;padding:7px 13px;font-size:12.5px;font-weight:600;font-family:'Figtree',sans-serif;color:var(--grn);background:var(--grn-bg);border:none;border-radius:8px;cursor:pointer}
.lk-copy:hover{background:var(--grn-bg-hov)}
.lk-act{flex:none;width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--faint2);font-size:13px;cursor:pointer;line-height:1;padding:0}
.lk-act.edit:hover{background:var(--grn-bg);color:var(--grn)}
.lk-act.del:hover{background:var(--red-bg);color:var(--red)}
.lk-act.confirm{width:auto;padding:0 9px;font-size:11.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--red);background:var(--red-bg)}
.lk-overlay{display:none;position:fixed;inset:0;background:rgba(20,53,45,.35);align-items:center;justify-content:center;padding:24px;z-index:50}
.lk-overlay.open{display:flex}
.lk-form{width:100%;max-width:440px;background:var(--card);border-radius:16px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(20,53,45,.25)}
.lk-x{width:30px;height:30px;border:none;border-radius:8px;background:var(--panel);color:var(--mut);font-size:15px;cursor:pointer;line-height:1}
.lk-x:hover{background:var(--track)}
.lk-input{padding:12px 14px;font-size:14.5px;font-family:'Figtree',sans-serif;border:1px solid var(--bd-strong);border-radius:10px;background:var(--input);color:var(--tx);outline:none}
.lk-input:focus{border-color:var(--grn);box-shadow:0 0 0 3px var(--bd)}
.lk-input.err{border-color:var(--red)}
.lk-cancel{padding:11px 18px;font-size:13.5px;font-weight:600;font-family:'Figtree',sans-serif;color:var(--grn);background:var(--grn-bg);border:none;border-radius:10px;cursor:pointer}
.lk-cancel:hover{background:var(--grn-bg-hov)}
.lk-submit{padding:11px 20px;font-size:13.5px;font-weight:700;font-family:'Figtree',sans-serif;color:var(--cream);background:var(--grn);border:none;border-radius:10px;cursor:pointer}
.lk-submit:hover{background:var(--grn-dk)}
/* catégories : Tutos · À regarder (+ sous-liste Déjà vues) · Contacts */
.lk-sec{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--amb)}
.lk-sec .n{font-size:11px;font-weight:600;letter-spacing:0;color:var(--faint);font-variant-numeric:tabular-nums}
.lk-list{border-radius:14px;overflow:hidden;margin-bottom:28px}
.lk-list.lk-avu{margin-bottom:10px}
.lk-list.lk-vu{margin-left:20px}
.lk-list.lk-vu .lk-row{opacity:.72}
.lk-list.lk-vu .lk-row:hover{opacity:1}
.lk-empty{text-align:center;padding:24px 20px;font-size:13.5px;color:var(--faint)}
/* glisser-déposer : même patron que la to-do */
.lk-grip{flex:none;cursor:grab;color:var(--faint2);font-size:13px;letter-spacing:1px;user-select:none}
.lk-row.dragging{opacity:.35}
.lk-ins{position:absolute;left:10px;right:10px;height:3px;border-radius:999px;background:var(--grn);z-index:5;pointer-events:none}
.lk-ins.top{top:-2px}
.lk-ins.bottom{bottom:-2px}
/* .lk-list rogne ses bords (overflow:hidden pour les coins arrondis) : lignes d'insertion rentrées en tête et en fin de liste */
.lk-list .lk-row:first-child .lk-ins.top{top:0}
.lk-list .lk-row:last-child .lk-ins.bottom{bottom:0}
.vl-card.dropzone{outline:2px dashed var(--grn);outline-offset:-2px}
.lk-seen{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;border:2px solid var(--bd-hov);background:transparent;color:transparent;font-size:12px;line-height:1;cursor:pointer}
.lk-seen:hover{border-color:var(--grn);background:var(--grn-bg);color:var(--grn)}
.lk-seen.on{border-color:var(--grn);background:var(--grn);color:var(--cream)}
.lk-toggle{display:flex;align-items:center;gap:8px;margin:0 0 10px 20px;padding:4px 6px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-family:'Figtree',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.lk-toggle:hover{color:var(--mut)}
.lk-toggle.ferme{margin-bottom:28px}
.lk-toggle.dropzone{outline:2px dashed var(--grn);outline-offset:2px}
.lk-toggle.fixe,.lk-toggle.fixe:hover{cursor:default;color:var(--faint)} /* en recherche : libellé seul, la sous-liste reste ouverte */

@media (max-width:720px){
.lk-grip,.lk-dnd{display:none} /* pas de glisser au doigt : la catégorie se change dans « Modifier » */
.lk-list.lk-vu,.lk-toggle{margin-left:10px}
.lk-row{gap:10px;padding:12px 12px}
.lk-badge{width:60px;font-size:10px}
.lk-copy{padding:7px 10px;font-size:12px}
}

</div>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

var SYNC=(function(){
var GH=null,REPO='',PATH='',MSG='',SHA=null,TIMER=null,PUSHING=false,DIRTY=false,GEN=0,SER=null,APPLY=null;
function api(){return 'https://api.github.com/repos/'+REPO+'/contents/'+PATH;}
function hdr(){return {Authorization:'Bearer '+GH,Accept:'application/vnd.github+json'};}
function b64utf8(s){var u=new TextEncoder().encode(s),b='';for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b);}
function utf8b64(b){return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),function(c){return c.charCodeAt(0);}));}
function setSync(t){var el=document.getElementById('sync');if(el)el.textContent=t;}
async function push(keepalive){clearTimeout(TIMER);
if(S.ro||!DIRTY)return;
if(PUSHING){TIMER=setTimeout(push,2000);return;} /* verrou : jamais deux envois simultanés */
PUSHING=true;setSync('⏳ envoi…');
var gen=GEN;
try{
if(!SHA){var r0=await fetch(api(),{headers:hdr(),cache:'no-store'});
if(r0.ok)SHA=(await r0.json()).sha;else if(r0.status!==404)throw new Error('lecture HTTP '+r0.status);}
var body={message:MSG,content:b64utf8(SER())};if(SHA)body.sha=SHA;
var put=await fetch(api(),{method:'PUT',headers:hdr(),keepalive:!!keepalive,body:JSON.stringify(body)});
if(!put.ok){
/* 409/422 = quelqu'un a poussé entre notre lecture et notre écriture → on relit le sha et on renvoie */
if(put.status===409||put.status===422){setSync('⏳ conflit de version — nouvel essai…');SHA=null;PUSHING=false;TIMER=setTimeout(push,800);return;}
throw new Error('commit HTTP '+put.status);}
var res=await put.json();SHA=res.content&&res.content.sha?res.content.sha:null;
if(GEN===gen){DIRTY=false;setSync('✅ synchronisé');}
else{TIMER=setTimeout(push,500);} /* modifié pendant l'envoi → on repousse */
}catch(e){setSync('❌ envoi échoué ('+e.message+') — réessai auto…');TIMER=setTimeout(push,15000);}
finally{PUSHING=false;}}
var S={ro:true,
init:function(p,msg,ser,apply){GH=p.gh;REPO=p.repo;PATH=p.path;MSG=msg;SER=ser;APPLY=apply;S.ro=!GH;
if(S.ro){var b=document.getElementById('roBanner');if(b)b.hidden=false;return;}
setSync('✅ synchronisé');
window.addEventListener('pagehide',function(){if(DIRTY)push(true);});
document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='hidden'){if(DIRTY)push(true);}
else if(!DIRTY&&!PUSHING)S.refresh();});},
refresh:async function(){if(S.ro)return;
try{var r=await fetch(api(),{headers:hdr(),cache:'no-store'});
if(r.status===404){SHA=null;return;}
if(!r.ok)throw new Error('HTTP '+r.status);
var f=await r.json();SHA=f.sha;
if(!DIRTY&&!PUSHING)APPLY(JSON.parse(utf8b64(f.content)));}
catch(e){/* silencieux : le seed est déjà affiché */}},
change:function(){if(S.ro)return;GEN++;DIRTY=true;setSync('⏳ envoi…');clearTimeout(TIMER);TIMER=setTimeout(push,2000);}};
return S;})();

'use strict';
var links = [];
var q = '', copied = '', copyTimer = null;
var editIdx = -1, delIdx = -1, delTimer = null;
var vuOpen = true; /* sous-liste « Déjà vues » dépliée : préférence d'affichage locale, jamais poussée */
var dragLi = null, overBucket = null, overVi = null;
var CATS = ['tuto', 'regarder', 'vu'];
/* sections dans l'ordre d'affichage. Un lien sans catégorie est « À regarder » (défaut, décision de
   Clément du 15/09 : pas de « À classer ») ; les contacts se rangent tout seuls et ne se glissent pas. */
var SECTIONS = [
  { b: 'tuto', label: 'Tutos', empty: 'Aucun tuto pour l’instant.', dnd: 'Glisse-en un ici.' },
  { b: 'regarder', label: 'À regarder', empty: 'Aucune vidéo à regarder.', dnd: 'Glisse-en une ici.' },
  { b: 'contact', label: 'Contacts', empty: 'Aucun contact pour l’instant.', dnd: '' }
];
var pendingRemote = null; /* distant reçu pendant que la fenêtre Ajouter/Modifier est ouverte : appliqué à la fermeture, jamais perdu */
var editOrig = null; /* { title, raw } de la ligne modifiée, pour la retrouver si le tableau a changé entre-temps */

var isPhone = function(v){ return /^\+?[\d\s().-]{6,}$/.test(v.trim()); };

function normLinks(obj){
  return (obj && Array.isArray(obj.links) ? obj.links : [])
    .filter(function(l){ return l && typeof l.title === 'string' && typeof l.raw === 'string'; })
    .map(function(l){
      /* type deviné pour les entrées sans champ type (jamais re-poussé automatiquement) */
      var type = (l.type === 'link' || l.type === 'contact') ? l.type : (isPhone(l.raw) ? 'contact' : 'link');
      var o = { title: String(l.title), raw: String(l.raw), type: type };
      if (type === 'link') o.cat = CATS.indexOf(l.cat) !== -1 ? l.cat : 'regarder'; /* sans catégorie → À regarder */
      return o;
    });
}
function serialize(){
  /* cat écrit pour chaque lien (jamais pour un contact) */
  return JSON.stringify({ links: links.map(function(l){
    var o = { title: l.title, raw: l.raw, type: l.type };
    if (l.type === 'link' && l.cat) o.cat = l.cat;
    return o;
  }) }, null, 2) + '\n';
}
function save(){ SYNC.change(); }
function bucketOf(l){ return l.type === 'contact' ? 'contact' : (CATS.indexOf(l.cat) !== -1 ? l.cat : 'regarder'); }

function meta(l){
  var v = l.raw.trim();
  if(l.type === 'contact') return { url: 'tel:' + v.replace(/[^+\d]/g, ''), sub: v, badge: 'Contact', copy: v };
  var u = v;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  var h = u;
  try{ h = new URL(u).hostname.replace('www.', ''); }catch(e){}
  var badge = h.indexOf('loom.com') !== -1 ? 'Loom'
    : (h.indexOf('youtube.com') !== -1 || h.indexOf('youtu.be') !== -1) ? 'YouTube'
    : 'Lien';
  return { url: u, sub: h, badge: badge, copy: null };
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

var sectionsEl = document.getElementById('lk-sections');
var noresEl = document.getElementById('lk-nores');
var noresQ = document.getElementById('lk-nores-q');
var qEl = document.getElementById('lk-q');
var overlay = document.getElementById('lk-overlay');
var formEl = document.getElementById('lk-form');
var fTitle = document.getElementById('lk-title');
var fUrl = document.getElementById('lk-url');
var errEl = document.getElementById('lk-err');
var modalTitle = document.getElementById('lk-modal-title');
var submitBtn = document.getElementById('lk-submit');
var urlLabel = document.getElementById('lk-url-label');
var typeEl = document.getElementById('lk-type');
var catWrap = document.getElementById('lk-cat-wrap');
var catEl = document.getElementById('lk-cat');
var catVu = document.getElementById('lk-cat-vu');
var fType = 'link', typeTouched = false, fCat = 'regarder';

function setType(t){
  fType = t;
  var chips = typeEl.querySelectorAll('.chip');
  for(var i = 0; i < chips.length; i++){
    var on = chips[i].getAttribute('data-type') === t;
    chips[i].classList.toggle('on', on);
    chips[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  var contact = t === 'contact';
  urlLabel.textContent = contact ? 'Numéro ou coordonnée' : 'Lien';
  fUrl.placeholder = contact ? '+33 6 12 34 56 78' : 'https://…';
  /* un contact se range tout seul dans Contacts ; style.display car le display:flex inline l'emporterait sur [hidden] */
  catWrap.style.display = contact ? 'none' : 'flex';
}
function setCat(c){
  fCat = c;
  var chips = catEl.querySelectorAll('.chip');
  for(var i = 0; i < chips.length; i++){
    var on = chips[i].getAttribute('data-cat') === c;
    chips[i].classList.toggle('on', on);
    chips[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
}

function qNorm(){ return q.trim().toLowerCase(); }
function matches(l, qq){ return !qq || (l.title + ' ' + meta(l).sub).toLowerCase().indexOf(qq) !== -1; }

/* gi = rang dans links (identité de la ligne), vi = rang parmi les lignes affichées de la catégorie b */
function rowHtml(l, gi, vi, b){
  var m = meta(l), isContact = l.type === 'contact', drag = !SYNC.ro && !isContact, vu = b === 'vu';
  var bodyStyle = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:2px';
  var body = '<span style="font-size:15px;font-weight:600;color:var(--ink)">' + esc(l.title) + '</span>'
    + '<span style="font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.sub) + '</span>';
  var seenLbl = vu ? 'Remettre à regarder' : 'Marquer comme vue';
  return '<div class="lk-row"' + (drag ? ' draggable="true"' : '') + ' data-li="' + gi + '" data-vi="' + vi + '">'
    + (drag ? '<div class="lk-ins top" hidden></div><div class="lk-ins bottom" hidden></div>'
      + '<span class="lk-grip" title="Glisser pour classer ou réordonner">⋮⋮</span>' : '')
    + ((b === 'regarder' || vu) && !SYNC.ro
      ? '<button type="button" class="lk-seen' + (vu ? ' on' : '') + '" data-seen="' + gi + '" title="' + seenLbl + '" aria-label="' + seenLbl + '">✓</button>'
      : '')
    + '<span class="lk-badge ' + (isContact ? 'amb' : 'grn') + '">' + esc(m.badge) + '</span>'
    + (isContact
      ? '<div style="' + bodyStyle + '">' + body + '</div>'
      : '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" draggable="false" style="' + bodyStyle + '">' + body + '</a>')
    + (m.copy
      ? '<button type="button" class="lk-copy" data-copy="' + esc(m.copy) + '" data-title="' + esc(l.title) + '">'
        + (copied === l.title ? 'Copié ✓' : 'Copier') + '</button>'
      : '')
    + (isContact
      ? ''
      : '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" draggable="false" style="flex:none;color:var(--grn);font-size:16px">↗</a>')
    + (SYNC.ro ? '' :
      '<button type="button" class="lk-act edit" data-edit="' + gi + '" aria-label="Modifier">✎</button>'
      + (delIdx === gi
        ? '<button type="button" class="lk-act del confirm" data-del="' + gi + '">Supprimer&nbsp;?</button>'
        : '<button type="button" class="lk-act del" data-del="' + gi + '" aria-label="Supprimer">✕</button>'))
    + '</div>';
}
/* texte de liste vide : la partie « glisse » n'existe qu'en écriture, et .lk-dnd est masquée sur mobile (pas de glisser) */
function hintHtml(empty, dnd){
  return esc(empty) + (dnd && !SYNC.ro ? '<span class="lk-dnd"> ' + esc(dnd) + '</span>' : '');
}
function listHtml(b, gis, hint, cls){
  return '<div class="vl-card lk-list' + (cls ? ' ' + cls : '') + '" data-bucket="' + b + '">'
    + (gis.length
      ? gis.map(function(gi, vi){ return rowHtml(links[gi], gi, vi, b); }).join('')
      : '<div class="lk-empty">' + hint + '</div>')
    + '</div>';
}

function render(){
  if (dragLi !== null) resetDrag(); /* un render pendant un drag détache la ligne source : même garde que la to-do */
  var qq = qNorm(), total = 0, html = '';
  var vis = { tuto: [], regarder: [], vu: [], contact: [] };
  var all = { tuto: 0, regarder: 0, vu: 0, contact: 0 };
  links.forEach(function(l, gi){ var b = bucketOf(l); all[b]++; if (matches(l, qq)) vis[b].push(gi); });
  var gv = vis.vu;
  var vuHint = SYNC.ro ? esc('Aucune vidéo vue pour l’instant.')
    : 'Coche une vidéo dans « À regarder »<span class="lk-dnd"> ou glisse-la ici</span>.';
  SECTIONS.forEach(function(s){
    var g = vis[s.b], reg = s.b === 'regarder';
    total += g.length + (reg ? gv.length : 0);
    /* hors recherche : toutes les catégories ;
       en recherche : celles qui ont un résultat — À regarder aussi quand seules ses « Déjà vues » en ont */
    var montrer = qq ? (g.length > 0 || (reg && gv.length > 0)) : true;
    var sousVu = reg && (!qq || gv.length > 0); /* sous-liste « Déjà vues » rendue */
    if (montrer) {
      /* compteur : total hors recherche, nombre de résultats en recherche */
      html += '<div class="lk-sec">' + esc(s.label) + ' <span class="n">' + (qq ? g.length : all[s.b]) + '</span></div>';
      if (!qq || g.length) html += listHtml(s.b, g, hintHtml(s.empty, s.dnd), sousVu ? 'lk-avu' : '');
    }
    if (sousVu) {
      /* sous-catégorie « Déjà vues » : dépliable, et cible de dépôt même repliée ;
         en recherche, toujours ouverte → simple libellé (un bouton n'aurait aucun effet visible) */
      html += qq
        ? '<div class="lk-toggle fixe" data-bucket="vu">Déjà vues (' + gv.length + ')</div>' + listHtml('vu', gv, vuHint, 'lk-vu')
        : '<button type="button" class="lk-toggle' + (vuOpen ? '' : ' ferme') + '" data-bucket="vu" data-vutoggle="1" aria-expanded="' + vuOpen + '">'
          + 'Déjà vues (' + all.vu + ') <span aria-hidden="true">' + (vuOpen ? '▾' : '▸') + '</span></button>'
          + (vuOpen ? listHtml('vu', gv, vuHint, 'lk-vu') : '');
    }
  });
  sectionsEl.innerHTML = html;
  noresEl.hidden = !(qq && total === 0);
  noresQ.textContent = q.trim();
}

/* recherche instantanée */
qEl.addEventListener('input', function(){ q = qEl.value; render(); });

/* copie (délégation) */
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); });
  }else{
    fallbackCopy(t);
  }
}
sectionsEl.addEventListener('click', function(e){
  if(e.target.closest('[data-vutoggle]')){ vuOpen = !vuOpen; render(); return; } /* affichage local, pas de push */
  var sn = e.target.closest('[data-seen]');
  if(sn){
    e.preventDefault();
    if(SYNC.ro) return;
    var si = parseInt(sn.getAttribute('data-seen'), 10), ls = links[si];
    if(!ls) return;
    links[si] = { title: ls.title, raw: ls.raw, type: ls.type, cat: ls.cat === 'vu' ? 'regarder' : 'vu' };
    if(delIdx !== -1){ delIdx = -1; clearTimeout(delTimer); }
    save();
    render();
    return;
  }
  var ed = e.target.closest('[data-edit]');
  if(ed){
    e.preventDefault();
    if(SYNC.ro) return;
    openModal(parseInt(ed.getAttribute('data-edit'), 10));
    return;
  }
  var dl = e.target.closest('[data-del]');
  if(dl){
    e.preventDefault();
    if(SYNC.ro) return;
    var i = parseInt(dl.getAttribute('data-del'), 10);
    clearTimeout(delTimer);
    if(delIdx === i){
      links.splice(i, 1);
      delIdx = -1;
      save();
    }else{
      delIdx = i;
      /* pendant un glisser, pas de render (il annulerait le glisser) : dragend/drop rafraîchissent */
      delTimer = setTimeout(function(){ delIdx = -1; if(dragLi === null) render(); }, 3000);
    }
    render();
    return;
  }
  var b = e.target.closest('[data-copy]');
  if(!b) return;
  e.preventDefault();
  copyText(b.getAttribute('data-copy'));
  copied = b.getAttribute('data-title');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(function(){ copied = ''; if(dragLi === null) render(); }, 1600);
  render();
});

/* ---- glisser-déposer (même patron que la to-do : réordonner ET changer de catégorie) ---- */
function clearIns(){
  var ins = sectionsEl.querySelectorAll('.lk-ins');
  for(var i = 0; i < ins.length; i++) ins[i].hidden = true;
  var dz = sectionsEl.querySelectorAll('.dropzone');
  for(var j = 0; j < dz.length; j++) dz[j].classList.remove('dropzone');
}
function showIns(cont, vi){
  clearIns();
  var rows = cont.classList.contains('lk-list') ? cont.querySelectorAll('.lk-row[draggable]') : [];
  if(!rows.length){ cont.classList.add('dropzone'); return; }
  if(vi < rows.length) rows[vi].querySelector('.lk-ins.top').hidden = false;
  else rows[rows.length - 1].querySelector('.lk-ins.bottom').hidden = false;
}
function resetDrag(){
  dragLi = null; overBucket = null; overVi = null; clearIns();
  var d = sectionsEl.querySelector('.lk-row.dragging'); if(d) d.classList.remove('dragging');
}
function visibleIn(b){
  var qq = qNorm(), out = [];
  links.forEach(function(l, gi){ if(bucketOf(l) === b && matches(l, qq)) out.push(gi); });
  return out;
}
/* écouteurs posés UNE FOIS sur le conteneur (délégation) : les sections sont recréées à chaque render */
sectionsEl.addEventListener('dragstart', function(e){
  var row = e.target.closest && e.target.closest('.lk-row[draggable]');
  if(!row || SYNC.ro) return;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', row.getAttribute('data-li')); }catch(err){}
  dragLi = Number(row.getAttribute('data-li'));
  if(delIdx !== -1){ delIdx = -1; clearTimeout(delTimer); } /* comme la to-do ferme son menu : le « Supprimer ? » est désarmé */
  setTimeout(function(){ row.classList.add('dragging'); }, 0);
});
sectionsEl.addEventListener('dragover', function(e){
  if(dragLi === null) return;
  var cont = e.target.closest('[data-bucket]');
  if(!cont) return;
  var b = cont.getAttribute('data-bucket');
  if(b === 'contact') return; /* les contacts se rangent tout seuls */
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var row = cont.classList.contains('lk-list') ? e.target.closest('.lk-row[draggable]') : null;
  var target;
  if(row){
    var vi = Number(row.getAttribute('data-vi')), r = row.getBoundingClientRect();
    target = e.clientY < r.top + r.height / 2 ? vi : vi + 1;
  }else{
    target = visibleIn(b).length; /* liste vide, bord du conteneur ou « Déjà vues » repliée → fin de liste */
  }
  if(overBucket !== b || overVi !== target){ overBucket = b; overVi = target; showIns(cont, target); }
});
sectionsEl.addEventListener('drop', function(e){ if(dragLi === null) return; e.preventDefault(); doDrop(); });
/* glisser annulé (Échap, lâché hors cible) : on rend l'état différé (« Copié ✓ », « Supprimer ? ») */
sectionsEl.addEventListener('dragend', function(){ if(dragLi === null) return; resetDrag(); render(); });
function doDrop(){
  if(dragLi === null || overBucket === null || overVi === null){ resetDrag(); return; }
  var b = overBucket, dragged = links[dragLi];
  if(!dragged || dragged.type === 'contact'){ resetDrag(); return; }
  var vis = visibleIn(b);
  /* déposé juste avant ou juste après soi-même dans sa propre liste : rien ne bouge (lignes masquées par la recherche comprises) */
  if(bucketOf(dragged) === b && (vis[overVi] === dragLi || vis[overVi - 1] === dragLi)){ resetDrag(); render(); return; }
  var ref = overVi < vis.length ? links[vis[overVi]] : null;
  var avant = serialize();
  var item = { title: dragged.title, raw: dragged.raw, type: dragged.type };
  item.cat = b; /* le dépôt dans une liste fixe la catégorie */
  var arr = links.filter(function(x){ return x !== dragged; });
  var insertAt;
  if(ref){ /* jamais dragged : son propre emplacement est traité plus haut, et il n'est pas dans vis d'une autre liste */
    insertAt = arr.indexOf(ref);
    if(insertAt < 0) insertAt = arr.length;
  }else{
    var qq = qNorm(), lastVis = -1, lastB = -1;
    for(var i = 0; i < arr.length; i++){
      if(bucketOf(arr[i]) === b){ lastB = i; if(matches(arr[i], qq)) lastVis = i; }
    }
    insertAt = lastVis >= 0 ? lastVis + 1 : (lastB >= 0 ? lastB + 1 : arr.length);
  }
  arr.splice(insertAt, 0, item);
  links = arr;
  if(delIdx !== -1){ delIdx = -1; clearTimeout(delTimer); }
  resetDrag();
  if(serialize() !== avant) save(); /* rien n'a bougé → pas de commit */
  render();
}

/* modal */
function setErr(on){
  errEl.hidden = !on;
  fUrl.classList.toggle('err', on);
}
function openModal(idx){
  editIdx = (typeof idx === 'number' && idx >= 0) ? idx : -1;
  var editing = editIdx !== -1;
  editOrig = editing ? { title: links[editIdx].title, raw: links[editIdx].raw } : null;
  fTitle.value = editing ? links[editIdx].title : '';
  fUrl.value = editing ? links[editIdx].raw : '';
  typeTouched = editing; /* en modification, pas de détection auto */
  setType(editing ? links[editIdx].type : 'link');
  /* nouveau lien : À regarder par défaut, jamais « Déjà vue » (une vidéo devient vue par ✓ ou glisser) ;
     « Déjà vue » n'apparaît qu'en modifiant une vidéo déjà vue, pour garder son état */
  var catActuelle = editing && links[editIdx].cat ? links[editIdx].cat : 'regarder';
  catVu.style.display = catActuelle === 'vu' ? '' : 'none';
  setCat(catActuelle);
  modalTitle.textContent = editing ? 'Modifier le lien' : 'Ajouter un lien';
  submitBtn.textContent = editing ? 'Enregistrer' : 'Ajouter';
  setErr(false);
  overlay.classList.add('open');
  fTitle.focus();
}
function applyRemote(remote){
  links = normLinks(remote);
  if(delIdx !== -1){ delIdx = -1; clearTimeout(delTimer); }
  render();
}
function closeModal(){
  overlay.classList.remove('open');
  if(pendingRemote){ var r = pendingRemote; pendingRemote = null; applyRemote(r); }
}

document.getElementById('lk-open').addEventListener('click', function(){ if(!SYNC.ro) openModal(); });
document.getElementById('lk-close').addEventListener('click', closeModal);
document.getElementById('lk-cancel').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
fTitle.addEventListener('input', function(){ setErr(false); });
fUrl.addEventListener('input', function(){
  setErr(false);
  /* pré-sélection de confort en mode ajout, jamais après un choix manuel */
  if(editIdx === -1 && !typeTouched) setType(isPhone(fUrl.value) ? 'contact' : 'link');
});
typeEl.addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(!c) return;
  typeTouched = true;
  setType(c.getAttribute('data-type'));
});
catEl.addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(!c) return;
  setCat(c.getAttribute('data-cat'));
});

formEl.addEventListener('submit', function(e){
  e.preventDefault();
  if(SYNC.ro) return;
  var t = fTitle.value.trim(), u = fUrl.value.trim();
  if(!t || !u){ setErr(true); return; }
  var item = { title: t, raw: u, type: fType };
  if(fType === 'link') item.cat = (editIdx === -1 && fCat === 'vu') || !fCat ? 'regarder' : fCat; /* un ajout n'entre jamais en « Déjà vue » */
  /* un autre appareil a poussé pendant que la fenêtre était ouverte : on repart de son état (sinon notre
     envoi, fait avec son sha, l'écraserait sans conflit) et on retrouve la ligne par son contenu d'origine */
  if(pendingRemote){
    var wasEditing = editIdx !== -1;
    links = normLinks(pendingRemote);
    pendingRemote = null;
    editIdx = -1;
    if(wasEditing){
      for(var k = 0; k < links.length; k++){
        if(links[k].title === editOrig.title && links[k].raw === editOrig.raw){ editIdx = k; break; }
      }
      /* introuvable (supprimé ou modifié ailleurs) : ajouté en fin plutôt que perdu */
    }
    if(delIdx !== -1){ delIdx = -1; clearTimeout(delTimer); }
  }
  if(editIdx !== -1){
    links[editIdx] = item;
  }else{
    links.push(item);
  }
  save();
  closeModal();
  render();
});

function boot(payload){
  SYNC.init(payload, 'liens : maj depuis le dashboard', serialize, function(remote){
    if(overlay.classList.contains('open')){ pendingRemote = remote; return; } /* fenêtre ouverte : mis en attente, appliqué à la fermeture */
    pendingRemote = null;
    applyRemote(remote);
  });
  links = normLinks(payload.seed);
  if(SYNC.ro) document.getElementById('lk-open').hidden = true;
  render();
  SYNC.refresh(); /* seed affiché, puis état le plus récent multi-appareils */
}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../login.html');return;}
boot(p);})();
</script>
