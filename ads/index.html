<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Ads Vivélan</title><style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#15271b;--mut:#5f7367;--bd:#dde5dd;--good:#0a7d4f;--bad:#c0392b;--warn:#c07f00;--acc:#1d5c3d}
@media(prefers-color-scheme:dark){:root{--bg:#101613;--card:#18211b;--tx:#e8f0e9;--mut:#8fa396;--bd:#26332a;--warn:#e0a52a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
#gate{display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#gate input{font-size:17px;padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(320px,80vw)}
#gate button{font-size:16px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
#err{color:var(--bad);min-height:1.2em}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap;align-items:center}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700}
.tile .v{font-size:26px;font-weight:800;margin-top:2px}.tile .s{font-size:12px;color:var(--mut)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}td:nth-child(2){text-align:left}
th{font-size:11px;text-transform:uppercase;color:var(--mut)}
th.sort{cursor:pointer}th.sort:hover{color:var(--tx)}
tr.total td{font-weight:800;border-top:2px solid var(--bd)}
.pill{padding:2px 9px;border-radius:999px;font-weight:700;display:inline-block}
.p-good{background:rgba(10,125,79,.14);color:var(--good)}.p-bad{background:rgba(192,57,43,.14);color:var(--bad)}
.p-warn{background:rgba(192,127,0,.16);color:var(--warn)}.p-na{color:var(--mut)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);font-weight:700}
.badge.ok{color:var(--good);border-color:var(--good)}.badge.mid{color:var(--warn);border-color:var(--warn)}
td.adname{max-width:230px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.foot{color:var(--mut);font-size:12px;margin:8px 0 18px}
.msel{margin:-8px 0 10px}.tab.sm{padding:5px 13px;font-size:13px;font-weight:600}
.mlab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;min-width:58px}
h2{font-size:16px;margin:18px 0 8px}
</style></head><body>

<button onclick="unlock()">Ouvrir</button><div id="err"></div></div>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryPw(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}
function storePw(pw){localStorage.setItem('vl_pw',JSON.stringify({p:btoa(unescape(encodeURIComponent(pw))),exp:Date.now()+30*864e5}));}
async function unlock(){const pw=document.getElementById('pw').value;
try{const data=await tryPw(pw);storePw(pw);boot(data);}catch(e){document.getElementById('err').textContent='Mot de passe incorrect';}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
(async()=>{try{const s=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(s&&s.exp>Date.now()){boot(await tryPw(decodeURIComponent(escape(atob(s.p)))));}}catch(e){localStorage.removeItem('vl_pw');}})();

let DATA=null,TAB='syn',PERIOD='cumul',DIM='angle',SKEY='spend',SDIR=-1;
const eur=(n,d=0)=>n==null||isNaN(n)?'—':(+n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})+'\u00a0€';
const fr=(n,d=1)=>n==null||isNaN(n)?'—':(+n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>n==null||isNaN(n)?'—':fr(n,d)+'\u00a0%';
function boot(data){DATA=data;document.getElementById('gate').style.display='none';
document.getElementById('app').style.display='block';render(TAB);}
function meta(id){return DATA.registre[id]||null;}
function statutQ(id){const m=meta(id);if(!m)return'qual';return m.statut==='confirmé'?'ok':(m.statut==='partiel'?'mid':'qual');}
function roasPill(r,t){if(r==null||isNaN(r))return'<span class="pill p-na">—</span>';
const c=r>=t.roas20?'p-good':(r>=t.beRoas?'p-warn':'p-bad');return'<span class="pill '+c+'">'+fr(r,2)+'</span>';}
function hookPill(h){if(h==null)return'—';const c=h>=30?'p-good':(h>=20?'p-warn':'p-bad');return'<span class="pill '+c+'">'+fr(h,0)+'\u00a0%</span>';}
// lignes de la vue : cumul = dernier snapshot ; delta = dernier − précédent (par ID)
function rows(){const snaps=DATA.snapshots;const cur=snaps[snaps.length-1];
const prev=snaps.length>1?snaps[snaps.length-2]:null;
const pby={};if(prev)for(const r of prev.rows)pby[r.id]=r;
return cur.rows.map(r=>{const m=meta(r.id);const p=prev?pby[r.id]:null;
let spend=r.spend,purch=r.purch,value=r.value,impr=r.impr,v3s=r.v3s,isNew=false;
if(PERIOD==='delta'&&prev){if(p){spend=+((r.spend||0)-(p.spend||0)).toFixed(2);purch=(r.purch||0)-(p.purch||0);
value=+((r.value||0)-(p.value||0)).toFixed(2);impr=(r.impr||0)-(p.impr||0);v3s=(r.v3s||0)-(p.v3s||0);}else isNew=true;}
const roas=spend>0&&value!=null?value/spend:null;
const cpa=purch>0?spend/purch:null;
const video=(m&&m.type==='vidéo')||((r.v3s||0)>=10&&r.impr>0&&r.v3s/r.impr>0.02);
const hook=video&&impr>0&&v3s!=null?v3s/impr*100:null;
const cpm=PERIOD==='delta'?(impr>0?spend/impr*1000:null):r.cpm;
return{id:r.id,name:r.name,status:r.status,m,isNew,spend:spend||0,purch:purch||0,value:value||0,impr:impr||0,
roas,cpa,hook,video,ctr:PERIOD==='delta'?null:r.ctr,freq:PERIOD==='delta'?null:r.freq,cpm,
cumSpend:r.spend||0,cumPurch:r.purch||0,cumRoas:r.roas};});}
