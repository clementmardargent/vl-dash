<style>
.sav-nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 48px;background:var(--card);border-bottom:1px solid var(--bd)}
.sav-nav a,.sav-nav span{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.sav-nav span{opacity:.6}
.sav-nav a{color:var(--mut)}
.sav-nav a:hover{background:var(--panel);color:var(--ink)}
.sav-nav a.on,.sav-nav a.on:hover{color:var(--cream);background:var(--grn)}
.crumb{font-size:13px;color:var(--faint);margin-bottom:14px}.crumb a{color:var(--mut)}.crumb .sep{margin:0 4px}.crumb .here{color:var(--grn);font-weight:600}
.svg-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.sav-nav{padding:8px 16px}}
</style>
<style>
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.hd h1{font-family:'Lora',serif;font-weight:600;font-size:34px;margin:0;color:var(--ink)}
.hd .n{font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.sub{margin:0 0 22px;font-size:14px;color:var(--mut);max-width:680px}
.bar1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar1 .chip{padding:7px 14px;font-size:13px}
.bar1 .dates{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.bar1 .dates[hidden]{display:none}
.bar1 input[type=date]{font:inherit;font-size:13px;color:var(--tx);background:var(--input);border:1px solid var(--bd-strong);border-radius:8px;padding:5px 8px}
#groups{margin-bottom:22px}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){#list{grid-template-columns:1fr}}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qc .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qc h2{font-family:'Lora',serif;font-weight:600;font-size:19px;margin:0;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.qc .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--faint);margin-top:3px;overflow-wrap:anywhere}
.qc .big{flex:none;text-align:right}
.qc .big b{display:block;font-size:26px;line-height:1;color:var(--grn);font-variant-numeric:tabular-nums}
.qc .big span{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.rw .l{font-size:14px;color:var(--tx);overflow-wrap:anywhere}
.rw .v{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.rw .v b{color:var(--ink)}
.rw .tr{grid-column:1 / -1;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.rw .tr i{display:block;height:100%;border-radius:999px;background:var(--grn)}
.rw.first .tr i{background:var(--grn)}
.rows{display:flex;flex-direction:column;gap:12px}
.free{display:flex;flex-direction:column;gap:8px}
.free .it{display:flex;gap:10px;justify-content:space-between;font-size:14px;padding:8px 12px;background:var(--panel);border-radius:10px}
.free .it q{color:var(--tx);overflow-wrap:anywhere}
.free .it span{flex:none;color:var(--mut);font-variant-numeric:tabular-nums}
.more{align-self:flex-start;font:inherit;font-size:13px;color:var(--grn);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.ft{font-size:12px;color:var(--faint);border-top:1px solid var(--bd);padding-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.nada{font-size:13.5px;color:var(--faint)}
.hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dl{font:inherit;font-size:13px;font-weight:600;color:var(--grn);background:var(--card);border:1px solid var(--bd-strong);border-radius:999px;padding:7px 14px;cursor:pointer}
.dl:hover{border-color:var(--grn)}
.dl:disabled{opacity:.6;cursor:wait}
.dl:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
#empty{text-align:center;padding:56px 0;font-size:15px;color:var(--faint);grid-column:1 / -1}
.warn{background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
#views{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin:6px 0 16px}
#views button{font:inherit;font-size:14.5px;font-weight:600;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;margin-bottom:-1px;cursor:pointer}
#views button:hover{color:var(--tx)}
#views button.on{color:var(--ink);border-bottom-color:var(--grn)}
#views button:focus-visible{outline:2px solid var(--grn);outline-offset:2px;border-radius:6px}
#kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
#kpis:empty{display:none}
#kpis div{flex:1 1 160px;background:var(--panel);border-radius:14px;padding:14px 18px}
#kpis b{display:block;font-size:26px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
#kpis span{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.qc .ord{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--grn);margin-bottom:4px}
.av{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.av .note{text-align:center}
.av .note b{display:block;font-family:'Lora',serif;font-size:38px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.av .note span{font-size:13px;color:var(--mut)}
.av .rows{gap:8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.cmsearch{font:inherit;font-size:13.5px;color:var(--tx);background:var(--input);border:1px solid var(--bd-strong);border-radius:999px;padding:7px 14px;min-width:220px;flex:1 1 220px;max-width:360px}
.cmsearch:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
.chip .k{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.vb{gap:12px}
.vb .vt{font-family:'Lora',serif;font-size:16.5px;line-height:1.5;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere;quotes:'« ' ' »'}
.vb .ctx{font-size:13px;color:var(--mut);border-left:2px solid var(--bd-strong);padding-left:10px;white-space:pre-line;overflow-wrap:anywhere}
.vb .mt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px;color:var(--tx)}
.vb .mt .lbl{padding-top:2px}
.vb .tags{display:flex;gap:6px;flex-wrap:wrap}
.vb .tag{font-size:12px;font-weight:600;color:var(--grn);background:var(--grn-bg);border-radius:999px;padding:3px 10px;cursor:pointer;border:none;font-family:inherit}
.vb .tag:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
</style>
</head>

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

function day(d){return d.toISOString().slice(0,10);}
function range(){if(S.period==='custom')return {depuis:S.from,jusqua:S.to};if(S.period==='all')return {};
  var n=+S.period,t=new Date(),f=new Date(t.getTime()-(n-1)*864e5);return {depuis:day(f),jusqua:day(t)};}
function frDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function shortDate(iso){return iso?new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';}
function load(){if(S.view==='commentaires'){renderCm();if(!S.names.length&&P.savKey)fetch(P.worker+'/reponses',{headers:{'Authorization':'Bearer '+P.savKey}}).then(function(x){return x.json();}).then(function(j){S.names=(j.questionnaires||[]).map(function(x){return x.nom;});if(S.view==='commentaires')views();}).catch(function(){});return;}
  var r=range(),qs=[];if(r.depuis)qs.push('depuis='+r.depuis);if(r.jusqua)qs.push('jusqua='+r.jusqua);
  if(S.view!=='emails'){qs.push('questionnaire='+encodeURIComponent(S.view));if(S.prod!=='all')qs.push('produit='+S.prod);}
  document.getElementById('list').innerHTML='<div id="empty">Chargement…</div>';document.getElementById('kpis').innerHTML='';
  fetch(P.worker+'/reponses'+(qs.length?'?'+qs.join('&'):''),{headers:{'Authorization':'Bearer '+P.savKey}})
  .then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error(j.error||('HTTP '+x.status));return j;});})
  .then(function(j){S.data=j;S.names=(j.questionnaires||[]).map(function(x){return x.nom;});render();})
  .catch(function(e){document.getElementById('list').innerHTML='<div id="empty">Impossible de lire les réponses ('+esc(e.message)+').</div>';});}
function views(){var names=S.names.slice();if(S.view!=='emails'&&S.view!=='commentaires'&&names.indexOf(S.view)<0)names.push(S.view);
  document.getElementById('views').innerHTML='<button class="'+(S.view==='emails'?'on':'')+'" data-v="emails">Réponses des e-mails</button>'+
    names.map(function(n){return '<button class="'+(S.view===n?'on':'')+'" data-v="'+esc(n)+'">'+esc(qnName(n))+'</button>';}).join('')+
    '<button class="'+(S.view==='commentaires'?'on':'')+'" data-v="commentaires">Commentaires</button>';
  document.getElementById('sub').textContent=S.view==='emails'?SUB.emails:S.view==='commentaires'?SUB.cm:SUB.qn;}
function filters(){var el=document.getElementById('groups');
  if(S.view!=='emails'){el.innerHTML=PRODS.map(function(p){return '<button class="chip'+(S.prod===p[0]?' on':'')+'" data-pr="'+p[0]+'">'+p[1]+'</button>';}).join('');return;}
  var qs=(S.data&&S.data.questions)||[],seen={},out=[];qs.forEach(function(q){var p=prefix(q.q);if(!seen[p]){seen[p]=1;out.push(p);}});
  if(out.length<2){el.innerHTML='';return;}
  el.innerHTML='<button class="chip'+(S.group==='all'?' on':'')+'" data-g="all">Toutes</button>'+out.map(function(p){return '<button class="chip'+(S.group===p?' on':'')+'" data-g="'+esc(p)+'">'+esc(AUD[p]||cap(p))+'</button>';}).join('');}
function bar(label,v,n,first){var pc=n?Math.round(v*1000/n)/10:0;
  return '<div class="rw'+(first?' first':'')+'"><span class="l">'+esc(label)+'</span><span class="v"><b>'+num(pc)+' %</b> · '+v+'</span><span class="tr"><i style="width:'+Math.min(pc,100)+'%"></i></span></div>';}
function texts(q,d,max){var L=(d.textes&&d.textes.liste)||[],all=S.open[q.q],shown=all?L:L.slice(0,max);if(!L.length)return '';
  var h='<div class="free">'+shown.map(function(x){return '<div class="it"><q>'+esc(x.texte)+'</q><span>'+(x.note?x.note+' ★ · ':'')+esc(shortDate(x.modifie_le))+'</span></div>';}).join('')+'</div>';
  if(L.length>max)h+='<button class="more" data-more="'+esc(q.q)+'">'+(all?'Réduire':'Tout afficher ('+L.length+')')+'</button>';
  if(d.textes.total>L.length)h+='<div class="nada">Les '+L.length+' plus récentes sur '+d.textes.total+'.</div>';
  return h;}
function choices(q,d,multi){var det=(d.reponses||[]).slice().sort(function(a,b){return (b.personnes||0)-(a.personnes||0);}),n=d.personnes||0;
  var free=det.length>12||det.some(function(x){return /\s/.test(String(x.r||''))||String(x.r||'').length>40;});
  if(free){var all=S.open[q.q],shown=all?det:det.slice(0,20);
    var h='<div class="free">'+shown.map(function(x){return '<div class="it"><q>'+esc(x.libelle||x.label||x.r)+'</q><span>'+(x.personnes||0)+'</span></div>';}).join('')+'</div>';
    if(det.length>20)h+='<button class="more" data-more="'+esc(q.q)+'">'+(all?'Réduire':'Tout afficher ('+det.length+')')+'</button>';return h;}
  return '<div class="rows">'+det.map(function(x,i){return bar(lab(x,'r'),x.personnes||0,n,i===0);}).join('')+'</div>';}
function avis(q,d){var a=d.avis||{},rep=a.repartition||{},n=0;for(var k=1;k<=5;k++)n+=rep[k]||0;
  var h='<div class="av"><div class="note"><b>'+(a.note_moyenne!=null?num(a.note_moyenne):'–')+'</b><span>/ 5</span></div><div class="rows">'+
    [5,4,3,2,1].map(function(k,i){return bar(k+' étoile'+(k>1?'s':''),rep[k]||0,n,false);}).join('')+'</div></div>';
  var t=texts(q,d,5);if(t)h+='<div class="lbl">Commentaires</div>'+t;return h;}
function card(q){var d=q.detail||{},t=d.type||q.type,n=d.personnes||0;
  var who=t==='avis'?(n>1?'avis':'avis'):(n>1?'répondants':'répondant');
  var h='<div class="qc"><div class="top"><div>'+(q.ordre?'<div class="ord">Question '+q.ordre+'</div>':'')+'<h2>'+esc(lab(q,'q'))+'</h2><div class="id">'+esc(q.q)+'</div></div>'+
    '<div class="big"><b>'+n+'</b><span>'+who+'</span></div></div>';
  if(q.erreur)h+='<div class="warn">Détail indisponible ('+esc(q.erreur)+').</div>';
  if(!n)h+='<div class="nada">Aucune réponse sur cette période.</div>';
  else if(t==='avis')h+=avis(q,d);
  else if(t==='texte')h+=texts(q,d,10);
  else{h+=choices(q,d,t==='multi');var tx=texts(q,d,5);if(tx)h+='<div class="lbl">Précisions écrites</div>'+tx;}
  var src=(d.sources||[]).filter(function(s){return s.personnes;});
  var cl=q.clics||0;
  h+='<div class="ft"><span>Dernière réponse : '+esc(frDate(q.dernier))+'</span>'+(t==='multi'?'<span>Plusieurs choix possibles : le total dépasse 100 %</span>':'')+
    (src.length>1?'<span>Origine : '+src.map(function(s){return esc(s.src)+' '+s.personnes;}).join(' · ')+'</span>':'')+'</div></div>';
  return h;}
function kpis(qs,end){var el=document.getElementById('kpis');if(S.view==='emails'){el.innerHTML='';return;}
  var st=qs.reduce(function(m,q){return Math.max(m,(q.detail&&q.detail.personnes)||0);},0),fi=end?((end.detail&&end.detail.personnes)||0):0;
  var pc=st?Math.round(fi*1000/st)/10:0;
  el.innerHTML='<div><b>'+st+'</b><span>ont commencé</span></div><div><b>'+fi+'</b><span>sont allés au bout</span></div><div><b>'+num(pc)+' %</b><span>taux de complétion</span></div>';}
function render(){if(S.view==='commentaires'){renderCm();return;}var j=S.data||{},all=j.questions||[];views();filters();
  var end=all.filter(isEnd)[0],qs=all.filter(function(q){return !isEnd(q);});
  if(S.view==='emails')qs=qs.filter(function(q){return S.group==='all'||prefix(q.q)===S.group;});
  var tot=all.filter(function(q){return !isEnd(q);}).length;
  document.getElementById('cnt').textContent=tot?(tot+(tot>1?' questions':' question')):'';
  document.getElementById('warn').innerHTML=j.tronque?'<div class="warn">Seules les '+all.length+' questions les plus récentes sont détaillées (sur '+j.total_questions+').</div>':'';
  kpis(qs,end);
  var list=document.getElementById('list');
  if(!tot){list.innerHTML='<div id="empty">Aucune réponse pour l’instant.</div>';return;}
  list.innerHTML=qs.map(card).join('');}
document.getElementById('views').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b||b.dataset.v===S.view)return;
  S.view=b.dataset.v;S.group='all';S.open={};try{history.replaceState(null,'',S.view==='emails'?location.pathname:'#'+S.view);}catch(_){}views();load();});
document.getElementById('period').addEventListener('click',function(e){var b=e.target.closest('button[data-p]');if(!b)return;S.period=b.dataset.p;
  document.querySelectorAll('#period button').forEach(function(x){x.classList.toggle('on',x===b);});document.getElementById('dates').hidden=S.period!=='custom';
  if(S.period!=='custom')load();});
document.getElementById('groups').addEventListener('input',function(e){if(e.target.id!=='cmq')return;S.qt=e.target.value;S.focus=true;renderCm();});
['from','to'].forEach(function(k){document.getElementById(k).addEventListener('change',function(e){S[k]=e.target.value;if(S.from&&S.to)load();});});
document.getElementById('groups').addEventListener('click',function(e){var t=e.target.closest('button[data-th]');if(t){S.th=t.dataset.th;renderCm();return;}
  var b=e.target.closest('button[data-g],button[data-pr]');if(!b)return;
  if(b.dataset.pr){S.prod=b.dataset.pr;load();return;}S.group=b.dataset.g;render();});
document.getElementById('list').addEventListener('click',function(e){var t=e.target.closest('button[data-th]');if(t){S.th=t.dataset.th;renderCm();window.scrollTo({top:0,behavior:'smooth'});return;}
  var b=e.target.closest('button[data-more]');if(!b)return;S.open[b.dataset.more]=!S.open[b.dataset.more];render();});
/* Export JSON : toutes les réponses depuis le début, chaque onglet (e-mails, puis chaque questionnaire par produit),
   avec libellés, décomptes et tous les textes libres. Jamais de profil Klaviyo (le relais ne le renvoie pas). */
function get(qs){return fetch(P.worker+'/reponses'+(qs?'?'+qs:''),{headers:{'Authorization':'Bearer '+P.savKey}}).then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error(j.error||('HTTP '+x.status));return j;});});}
function slim(q,extra){var d=q.detail||{},o={q:q.q,question:q.libelle||pretty(q.q),type:d.type||q.type,personnes:d.personnes||0};
  for(var k in extra)o[k]=extra[k];
  if(d.reponses&&d.reponses.length)o.reponses=d.reponses.map(function(r){return {reponse:r.libelle||r.label||pretty(r.r),id:r.r,personnes:r.personnes};});
  if(d.avis)o.avis={note_moyenne:d.avis.note_moyenne,repartition:d.avis.repartition};
  var L=(d.textes&&d.textes.liste)||[];if(L.length)o.verbatim=L.map(function(t){var v={texte:t.texte,date:t.modifie_le};if(t.note)v.note=t.note;if(t.r)v.reponse=t.r;if(t.src)v.origine=t.src;return v;});
  if(q.ordre)o.ordre=q.ordre;return o;}
function exportJson(){var b=document.getElementById('dl');b.disabled=true;b.textContent='Préparation…';
  get('').then(function(em){var names=(em.questionnaires||[]).map(function(x){return x.nom;});
    var jobs=[];names.forEach(function(n){PRODS.filter(function(p){return p[0]!=='all';}).forEach(function(p){jobs.push(get('questionnaire='+encodeURIComponent(n)+'&produit='+p[0]).then(function(j){return {nom:n,produit:p[0],j:j};}));});});
    return Promise.all(jobs).then(function(res){
      var out={exporte_le:new Date().toISOString(),periode:'depuis le début',
        lecture:'Une personne = une voix (sa dernière réponse). « verbatim » = textes libres écrits par les clients, mot pour mot, les plus récents d’abord. « reponses » = décompte des réponses à choix.',
        emails:(em.questions||[]).map(function(q){var p=prefix(q.q);return slim(q,AUD[p]?{audience:AUD[p]}:{});}),questionnaires:[],
        commentaires:((P.commentaires||{}).verbatim||[]).map(function(v){return {texte:v.texte,en_reponse_a:v.repond_a||undefined,date:v.date,pub:v.pub,plateforme:v.plateforme,themes:v.themes,avatar:v.avatar,angle:v.angle};})};
      names.forEach(function(n){var parts=res.filter(function(r){return r.nom===n;});
        out.questionnaires.push({nom:qnName(n),id:n,produits:parts.map(function(r){var qs=r.j.questions||[],end=qs.filter(isEnd)[0];
          return {produit:r.produit,termines:end&&end.detail?end.detail.personnes:0,questions:qs.filter(function(q){return !isEnd(q);}).map(function(q){return slim(q,{});})};})});});
      var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='reponses-clients-vivelan-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);});
  }).catch(function(e){alert('Export impossible : '+e.message);}).then(function(){b.disabled=false;b.textContent='Télécharger (JSON)';});}
document.getElementById('dl').addEventListener('click',exportJson);
function boot(payload){P=payload;var h=decodeURIComponent(location.hash.slice(1));if(/^[a-z0-9_-]{1,64}$/.test(h))S.view=h;views();
  if(!P.savKey){document.getElementById('list').innerHTML='<div id="empty">Clé d’accès absente du build.</div>';return;}load();}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../../login.html');return;}
boot(p);})();
</script>
