<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vivélan — Commentaires</title>
<script>try{if(localStorage.getItem('vivelan-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/shared.css">
<style>
.sav-nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 48px;background:var(--card);border-bottom:1px solid var(--bd)}
.sav-nav a,.sav-nav span{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.sav-nav span{opacity:.6}
.sav-nav a{color:var(--mut)}
.sav-nav a:hover{background:var(--panel);color:var(--ink)}
.sav-nav a.on,.sav-nav a.on:hover{color:var(--cream);background:var(--grn)}
.crumb{font-size:13px;color:var(--faint);margin-bottom:14px}.crumb a{color:var(--mut)}.crumb .sep{margin:0 4px}.crumb .here{color:var(--grn);font-weight:600}
.svg-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.sav-nav{padding:8px 16px}}
</style>
<style>
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{font-family:'Lora',serif;font-weight:600;font-size:34px;margin:0;color:var(--ink)}
.hd .n{font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
#tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
#tabs .chip{padding:8px 16px;font-size:13px}
#list{display:flex;flex-direction:column;gap:14px}
.cm{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;transition:opacity .3s}
.cm .row{display:flex;gap:16px}
.cm.arch{opacity:.62}
.th{flex:none;width:64px}
.th .v{aspect-ratio:9/16;border-radius:10px;background:linear-gradient(145deg,var(--panel),var(--track));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .play{position:relative;width:24px;height:24px;border-radius:50%;background:var(--grn);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:9px;padding-left:2px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.th .lab{font-size:8px;font-weight:600;color:var(--faint);letter-spacing:.5px}
.th .pf{display:block;margin-top:6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.body{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;white-space:nowrap;overflow:hidden}
.meta .w{font-size:12.5px;color:var(--mut)}
.meta .dec{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.dec.keep{color:var(--grn);background:var(--grn-bg)}.dec.hide{color:var(--red);background:var(--red-bg)}.dec.reply{color:var(--amb);background:var(--amb-bg)}.dec.archived{color:var(--mut);background:var(--panel)}
.txt{margin:0;font-size:14.5px;line-height:1.55;color:var(--tx);text-wrap:pretty;white-space:pre-wrap;word-break:break-word}
.hidden-now{font-size:10.5px;font-weight:700;color:var(--red);letter-spacing:.4px;text-transform:uppercase;background:var(--red-bg);padding:3px 8px;border-radius:999px}
.acts{flex:none;display:flex;gap:10px;align-items:flex-start}
.acts button{width:104px;padding:10px 0;font-size:13px;font-weight:700;font-family:'Figtree',sans-serif;color:#fff;border:2px solid transparent;border-radius:10px;cursor:pointer;opacity:.5;transform:scale(.92);transition:opacity .15s,transform .15s}
.acts button.keep{background:var(--grn);border-color:var(--grn)}
.acts button.hide{background:var(--red);border-color:var(--red)}
.acts button.reply{background:var(--amb);border-color:var(--amb)}
.acts button.rec,.acts button:hover{opacity:1;transform:scale(1)}
.acts button:disabled{opacity:.35;cursor:wait;transform:scale(.92)}
.rp{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.rp .l{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amb);margin-bottom:8px}
.rp textarea{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:14px;line-height:1.5;color:var(--tx);background:var(--input);border:1px solid var(--bd-strong);border-radius:10px;padding:10px 12px}
.rp textarea:focus{outline:2px solid var(--grn);outline-offset:1px;border-color:transparent}
.rp .row2{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.rp .send{padding:9px 16px;font-size:13px;font-weight:700;font-family:'Figtree',sans-serif;color:#fff;background:var(--amb);border:none;border-radius:10px;cursor:pointer}
.rp .send:disabled{opacity:.5;cursor:wait}
.rp .cancel{font:inherit;font-size:13px;color:var(--mut);background:none;border:none;cursor:pointer;text-decoration:underline}
.rp .pub{margin:0;font-size:14px;line-height:1.5;color:var(--tx);white-space:pre-wrap}
.rp .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
#empty{text-align:center;padding:48px 0;font-size:14px;color:var(--faint)}
.err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px}
@media (max-width:720px){.cm .row{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end}.acts button{width:auto;padding:10px 16px}}
</style>
</head>
<body>
<div class="vl-shell">
<div class="vl-top"></div>
<header class="vl-header">
  <div class="brand">
    <a href="../../index.html" style="display:block"><img src="../../assets/logo-vivelan.png" alt="Vivélan"></a>
    <span class="vl-admin">Admin</span>
  </div>
  <div class="vl-hright"><button id="themeToggle" class="theme-btn" title="Basculer clair/sombre">☾</button><div class="vl-avatar">V</div></div>
</header>
<nav class="sav-nav">
  <a href="../../sav/commentaires/" class="on">Commentaires</a>
  <span>Mail</span>
  <span>DM</span>
</nav>
  <main class="vl-main" style="max-width:880px;padding-top:40px">
    <div class="crumb"><a href="../../index.html">Tableau de bord</a> <span class="sep">/</span> <a href="../">SAV</a> <span class="sep">/</span> <span class="here">Commentaires</span></div>
    <div class="hd"><h1>Commentaires</h1><span class="n" id="cnt"></span></div>
    <div id="tabs">
      <button class="chip on" data-k="pending">En attente</button>
      <button class="chip" data-k="done">Archivés</button>
      <button class="chip" data-k="all">Tous</button>
    </div>
    <div id="list"></div>
  </main>
<footer class="vl-footer"><span>Vivélan — espace interne</span><span>v2</span></footer>
</div>
<script>
const BLOB="{\"salt\":\"q6HtFXw9tKPuQIwd71PU9w==\",\"iv\":\"GHxLPiJhfhHr8erf\",\"data\":\"jjqNnenymz0vRv4rLzTjrAuw6PBD+Wwk9MpHYxt70P5NNlmNnlhZS8cAvYJB4B3S4fidra2bMd8vTQG5FkuaJD6aBorEe2S9Bmwp+GPFv7aejKrwrjx3YbAap+1amF6tdMq0pyW5albemFLHXQj84bQslmGInvmpO+Bq3z+sYRNfjx8L9rM8O0qiCVHhtXPGb6Kkl+fGCinH0NSpEFeKmN1EN5e1Jglzz4AzYG2Mhu+1TVanrKfWgRw=\"}";

const b2u=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryDecrypt(pw){const blob=JSON.parse(BLOB);const key=await deriveKey(pw,b2u(blob.salt));
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(blob.iv)},key,b2u(blob.data));
return JSON.parse(new TextDecoder().decode(plain));}

(function(){var b=document.getElementById('themeToggle');if(!b)return;
function icon(){b.textContent=document.documentElement.classList.contains('dark')?'☀':'☾';}
icon();
b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');
try{localStorage.setItem('vivelan-theme',d?'dark':'light')}catch(e){}icon();});})();

var P=null,STATE={view:'pending',data:[],counts:{}};
var LABEL={keep:'Garder',hide:'Supprimer',reply:'Répondre'},DONE={keep:'Gardé',hide:'Supprimé',reply:'Répondu',archived:'Archivé'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function frDate(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+P.savKey,'Content-Type':'application/json'},opt.headers||{});
return fetch(P.worker+path,opt).then(function(r){return r.json().then(function(j){if(!r.ok&&!j.meta)throw new Error(j.error||('HTTP '+r.status));return j;});});}
function load(){document.getElementById('list').innerHTML='<div id="empty">Chargement…</div>';
var q=STATE.view==='all'?[api('/comments?status=pending&limit=500'),api('/comments?status=done&limit=500')]:[api('/comments?status='+STATE.view+'&limit=500')];
Promise.all(q).then(function(rs){STATE.data=[].concat.apply([],rs.map(function(d){return d.comments;}));STATE.counts=rs[0].counts||{};
STATE.data.sort(function(a,b){return (b.created_time||'')<(a.created_time||'')?-1:1;});render();})
.catch(function(e){document.getElementById('list').innerHTML='<div id="empty">Impossible de joindre le Worker ('+esc(e.message)+').</div>';});}
function render(){document.getElementById('cnt').textContent=(STATE.counts.pending||0)+' en attente';
var list=document.getElementById('list');if(!STATE.data.length){list.innerHTML='<div id="empty">Aucun commentaire dans cette vue.</div>';return;}
list.innerHTML=STATE.data.map(card).join('');fit();}
function fit(){document.querySelectorAll('.rp textarea').forEach(function(t){t.style.height='auto';t.style.height=Math.max(64,t.scrollHeight+2)+'px';});}
function thumb(c){var vid=(c.media_type||'').toLowerCase().indexOf('video')>=0;var img=c.media_url&&!/\.(mp4|mov|m4v)(\?|$)/i.test(c.media_url);
return '<div class="th"><div class="v">'+(img?'<img src="'+esc(c.media_url)+'" alt="" loading="lazy" onerror="this.remove()">':'')+(vid?'<div class="play">▶</div>':(img?'':'<span class="lab">VISUEL</span>'))+'</div>'+
'<span class="pf">'+(c.platform==='instagram'?'Insta':'Facebook')+'</span></div>';}
function card(c){var done=c.status==='done';var rec=c.claude_action;
var h='<div class="cm'+(done?' arch':'')+'" id="c-'+esc(c.id)+'"><div class="row">'+thumb(c)+'<div class="body"><div class="meta"><span class="w">'+esc(frDate(c.created_time))+(c.like_count?' · '+c.like_count+' j’aime':'')+'</span>'+
(c.is_hidden&&!done?'<span class="hidden-now">Masqué</span>':'')+(done?'<span class="dec '+esc(c.human_action)+'">'+(DONE[c.human_action]||c.human_action)+'</span>':'')+'</div>'+
'<p class="txt">'+esc(c.text||'(sans texte)')+'</p></div>';
if(!done)h+='<div class="acts">'+['keep','hide','reply'].map(function(a){return '<button class="'+a+(rec===a?' rec':'')+'" title="'+(rec===a?'Recommandé par Claude'+(c.claude_reason?' : '+esc(c.claude_reason):''):LABEL[a])+'" onclick="'+(a==='reply'?'toggleReply(\''+esc(c.id)+'\',true)':'decide(\''+esc(c.id)+'\',\''+a+'\')')+'">'+LABEL[a]+'</button>';}).join('')+'</div>';
h+='</div>';
if(done&&c.human_action==='reply'&&c.human_reply)h+='<div class="rp"><div class="l">Réponse publiée</div><p class="pub">'+esc(c.human_reply)+'</p></div>';
if(!done)h+='<div class="rp" id="rp-'+esc(c.id)+'" '+(rec==='reply'?'':'hidden')+'><div class="l">Réponse publique de Vivélan'+(c.claude_reply?' · proposée par Claude, relisez avant de publier':'')+'</div>'+
'<textarea maxlength="2000" oninput="this.parentNode.querySelector(\'.cnt\').textContent=this.value.length+\' / 2000\'">'+esc(c.claude_reply||'')+'</textarea>'+
'<div class="row2"><button class="send" onclick="sendReply(\''+esc(c.id)+'\')">Publier la réponse</button><button class="cancel" onclick="toggleReply(\''+esc(c.id)+'\',false)">Annuler</button><span class="cnt">'+(c.claude_reply||'').length+' / 2000</span></div></div>';
return h+'</div>';}
function toggleReply(id,open){var p=document.getElementById('rp-'+id);if(!p)return;p.hidden=!open;if(open){fit();var t=p.querySelector('textarea');t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
function sendReply(id){var p=document.getElementById('rp-'+id);var text=p.querySelector('textarea').value.trim();if(!text){p.querySelector('textarea').focus();return;}
if(!confirm('Publier cette réponse maintenant, publiquement, sous le commentaire ?\n\n'+text))return;decide(id,'reply',text);}
function decide(id,action,reply){var card=document.getElementById('c-'+id);card.querySelectorAll('button').forEach(function(b){b.disabled=true;});var old=card.querySelector('.err');if(old)old.remove();
api('/comments/decision',{method:'POST',body:JSON.stringify(reply?{id:id,action:action,reply:reply}:{id:id,action:action})}).then(function(r){
if(!r.applied)throw new Error('Meta a refusé : '+JSON.stringify(r.meta).slice(0,160));
card.style.opacity='0';setTimeout(function(){var row=STATE.data.filter(function(c){return c.id===id;})[0];
if(row){row.status='done';row.human_action=action;row.human_reply=reply||null;row.human_at=new Date().toISOString();if(action==='hide')row.is_hidden=1;}
if(STATE.view==='pending')STATE.data=STATE.data.filter(function(c){return c.id!==id;});
STATE.counts.pending=Math.max(0,(STATE.counts.pending||1)-1);STATE.counts.done=(STATE.counts.done||0)+1;render();},300);
}).catch(function(e){card.querySelectorAll('button').forEach(function(b){b.disabled=false;});var d=document.createElement('div');d.className='err';d.textContent='Échec : '+e.message;card.appendChild(d);});}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b||b.dataset.k===STATE.view)return;STATE.view=b.dataset.k;
document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x.dataset.k===STATE.view);});load();});
function boot(payload){P=payload;if(!P.savKey){document.getElementById('list').innerHTML='<div id="empty">Clé d’accès absente du build.</div>';return;}load();}

(async()=>{let p=null;
try{const w=JSON.parse(localStorage.getItem('vl_pw')||'null');
if(w&&w.exp>Date.now()){const pw=decodeURIComponent(escape(atob(w.p)));p=await tryDecrypt(pw);}}catch(e){}
if(p===null){location.replace('../../login.html');return;}
boot(p);})();
</script>
</body>
</html>
